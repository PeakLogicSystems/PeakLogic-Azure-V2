<title>PeakLogic Super-Console</title>
<style>
  :root {
    --rail-bg: #0a0f1d;
    --rail-surface: #121b30;
    --rail-border: #1e2a44;
    --rail-text: #e8ecf5;
    --rail-muted: #7f8db0;
    --rail-active-bg: rgba(139, 92, 246, .16);
    --rail-active-bar: #8b5cf6;

    --bg: #f5f5fb;
    --surface: #ffffff;
    --surface-2: #fbfaff;
    --surface-3: #f2f1fa;
    --border: #e7e5f1;
    --border-strong: #d7d4e8;
    --text: #10152a;
    --text-muted: #5c6480;
    --text-faint: #939ab5;
    --accent: #7c3aed;
    --accent-ink: #6d28d9;
    --accent-soft: #ede9fe;
    --data-val: var(--text-muted);

    --good: #16a34a;
    --good-soft: #dcfce7;
    --good-ink: #15803d;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --warn-ink: #b45309;
    --crit: #dc2626;
    --crit-soft: #fee2e2;
    --crit-ink: #b91c1c;
    --info: #2563eb;
    --info-soft: #dbeafe;
    --info-ink: #1d4ed8;

    --shadow: 0 1px 2px rgba(16, 21, 42, .04), 0 4px 16px rgba(16, 21, 42, .05);
    --shadow-lg: 0 12px 40px rgba(16, 21, 42, .16);
    --radius: 12px;
    --radius-sm: 8px;

    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080c17;
      --surface: #10192b;
      --surface-2: #0d1524;
      --surface-3: #16223a;
      --border: #223049;
      --border-strong: #2c3c58;
      --text: #eef2fb;
      --text-muted: #93a0bd;
      --text-faint: #66728f;
      --accent: #8b5cf6;
      --accent-ink: #a78bfa;
      --accent-soft: #241d45;
      --data-val: var(--text);

      --good: #34d399; --good-soft: #0c2a20; --good-ink: #6ee7b7;
      --warn: #fbbf24; --warn-soft: #2e2408; --warn-ink: #fcd34d;
      --crit: #f87171; --crit-soft: #2e1416; --crit-ink: #fca5a5;
      --info: #60a5fa; --info-soft: #12203c; --info-ink: #93c5fd;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
    }
  }

  :root[data-theme="light"] {
    --bg: #f5f5fb; --surface: #ffffff; --surface-2: #fbfaff; --surface-3: #f2f1fa;
    --border: #e7e5f1; --border-strong: #d7d4e8; --text: #10152a; --text-muted: #5c6480;
    --text-faint: #939ab5; --accent: #7c3aed; --accent-ink: #6d28d9; --accent-soft: #ede9fe;
    --data-val: var(--text-muted);
    --good: #16a34a; --good-soft: #dcfce7; --good-ink: #15803d;
    --warn: #d97706; --warn-soft: #fef3c7; --warn-ink: #b45309;
    --crit: #dc2626; --crit-soft: #fee2e2; --crit-ink: #b91c1c;
    --info: #2563eb; --info-soft: #dbeafe; --info-ink: #1d4ed8;
    --shadow: 0 1px 2px rgba(16,21,42,.04), 0 4px 16px rgba(16,21,42,.05);
    --shadow-lg: 0 12px 40px rgba(16,21,42,.16);
  }
  :root[data-theme="dark"] {
    --bg: #080c17; --surface: #10192b; --surface-2: #0d1524; --surface-3: #16223a;
    --border: #223049; --border-strong: #2c3c58; --text: #eef2fb; --text-muted: #93a0bd;
    --text-faint: #66728f; --accent: #8b5cf6; --accent-ink: #a78bfa; --accent-soft: #241d45;
    --data-val: var(--text);
    --good: #34d399; --good-soft: #0c2a20; --good-ink: #6ee7b7;
    --warn: #fbbf24; --warn-soft: #2e2408; --warn-ink: #fcd34d;
    --crit: #f87171; --crit-soft: #2e1416; --crit-ink: #fca5a5;
    --info: #60a5fa; --info-soft: #12203c; --info-ink: #93c5fd;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .app {
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 248px 1fr;
    -webkit-font-smoothing: antialiased;
  }
  @media (max-width: 760px) { .app { grid-template-columns: 68px 1fr; } }

  /* ---------- Command rail (pinned dark, both themes) ---------- */
  .rail {
    background: var(--rail-bg);
    border-right: 1px solid var(--rail-border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    padding: 18px 12px;
  }
  .brand {
    display: flex; align-items: flex-end; gap: 9px; padding: 6px 8px 20px;
    border: none; background: none; cursor: pointer; width: 100%; font-family: inherit; text-align: left;
  }
  .brand:hover .brand__word .peak { color: #e8ecf5; }
  .brand svg { width: 30px; height: 22px; display: block; }
  .brand__word { font-size: 19px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .brand__word .peak { color: #ffffff; }
  .brand__word .logic { color: #8b5cf6; }
  @media (max-width: 760px) { .brand__word { display: none; } .brand { justify-content: center; padding: 6px 0 20px; } }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav__label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--rail-muted); font-weight: 700; padding: 16px 10px 6px;
  }
  @media (max-width: 760px) { .nav__label { text-align: center; font-size: 8px; padding: 12px 0 4px; } }
  .nav__item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    color: var(--rail-text); font-size: 13.5px; font-weight: 500;
    cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    position: relative; font-family: inherit; transition: background .12s ease;
  }
  .nav__item:hover { background: rgba(255,255,255,.05); }
  .nav__item svg { width: 17px; height: 17px; flex: none; opacity: .82; }
  .nav__item--active { background: var(--rail-active-bg); color: #fff; font-weight: 600; }
  .nav__item--active::before {
    content: ""; position: absolute; left: -12px; top: 7px; bottom: 7px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--rail-active-bar);
  }
  .nav__item--active svg { opacity: 1; color: #a78bfa; }
  .nav__item--sub { padding-left: 38px; font-size: 13px; }
  @media (max-width: 760px) {
    .nav__item { justify-content: center; padding: 11px 0; gap: 0; }
    .nav__item span, .nav__item--sub { display: none; }
    .nav__item--sub { display: none !important; }
  }
  .nav__count {
    margin-left: auto; font-size: 11px; font-family: var(--mono);
    color: var(--rail-muted); background: rgba(255,255,255,.06);
    padding: 1px 7px; border-radius: 20px; font-variant-numeric: tabular-nums;
  }
  @media (max-width: 760px) { .nav__count { display: none; } }

  .rail__foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--rail-border); }
  .who { display: flex; align-items: center; gap: 10px; }
  .who__avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #8b5cf6, #22c55e);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
  }
  .who__name { font-size: 12.5px; font-weight: 600; color: var(--rail-text); line-height: 1.3; }
  .who__role { font-size: 10.5px; color: var(--rail-muted); display: flex; align-items: center; gap: 4px; }
  .who__role .dot { width: 5px; height: 5px; border-radius: 50%; background: #34d399; }
  @media (max-width: 760px) { .who__name, .who__role { display: none; } .who { justify-content: center; } }

  /* ---------- Main ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20;
  }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); min-width: 0; }
  .crumb b { color: var(--text); font-weight: 650; }
  .crumb .sep { color: var(--text-faint); }
  .topbar__spacer { flex: 1; }
  .iconbtn {
    display: grid; place-items: center; width: 34px; height: 34px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); cursor: pointer;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--border-strong); }
  .iconbtn svg { width: 17px; height: 17px; }

  /* Act-as banner */
  .banner {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 28px; background: var(--accent-soft);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    font-size: 13px; color: var(--text);
  }
  .banner__pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70% { box-shadow: 0 0 0 9px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .banner__pulse { animation: none; } }
  .banner b { font-weight: 700; }
  .banner__meta { color: var(--accent-ink); font-family: var(--mono); font-size: 11.5px; }
  .banner__exit {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 13px; border-radius: 20px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
    background: var(--surface); color: var(--accent-ink); font-weight: 650; font-size: 12.5px;
    cursor: pointer; font-family: inherit;
  }
  .banner__exit:hover { background: var(--surface-2); }

  .view { padding: 26px 28px 60px; max-width: 1240px; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view, .banner__pulse { animation: none; } }

  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; font-weight: 750; letter-spacing: -.02em; margin: 0 0 4px; text-wrap: balance; }
  .page-head p { margin: 0; color: var(--text-muted); font-size: 13.5px; max-width: 68ch; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat__label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 650; }
  .stat__value { font-size: 30px; font-weight: 760; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat__sub { font-size: 12px; color: var(--text-faint); margin-top: 7px; font-variant-numeric: tabular-nums; }
  .stat__accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

  /* Panels */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 940px) { .grid2 { grid-template-columns: 1fr; } }
  .panel__head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
  .panel__title { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .panel__note {
    margin-left: auto; font-size: 11px; color: var(--text-faint);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .panel__note code { font-family: var(--mono); color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; }

  /* Tables */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-faint); font-weight: 700; padding: 10px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface);
  }
  .tbl td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tbody tr { transition: background .1s ease; }
  .tbl tbody tr.clickable { cursor: pointer; }
  .tbl tbody tr.clickable:hover { background: var(--surface-3); }
  .tbl .num { font-variant-numeric: tabular-nums; text-align: right; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }
  .sev-cell { width: 4px; padding: 0 !important; }
  .sev-stripe { display: block; width: 4px; align-self: stretch; min-height: 44px; }
  .strong { font-weight: 650; }
  .row-main { display: flex; flex-direction: column; gap: 2px; }
  .row-sub { font-size: 11.5px; color: var(--text-faint); }

  /* Pills */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border-radius: 20px; font-size: 11.5px; font-weight: 650; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .pill--good { background: var(--good-soft); color: var(--good-ink); } .pill--good .dot { background: var(--good); }
  .pill--warn { background: var(--warn-soft); color: var(--warn-ink); } .pill--warn .dot { background: var(--warn); }
  .pill--crit { background: var(--crit-soft); color: var(--crit-ink); } .pill--crit .dot { background: var(--crit); }
  .pill--info { background: var(--info-soft); color: var(--info-ink); } .pill--info .dot { background: var(--info); }
  .pill--neutral { background: var(--surface-3); color: var(--text-muted); } .pill--neutral .dot { background: var(--text-faint); }
  .pill--accent { background: var(--accent-soft); color: var(--accent-ink); } .pill--accent .dot { background: var(--accent); }

  /* Rollup bar */
  .rollup { display: flex; align-items: center; gap: 10px; }
  .rollup__track { flex: 1; height: 7px; border-radius: 20px; background: var(--surface-3); overflow: hidden; display: flex; }
  .rollup__fill { height: 100%; background: var(--good); }
  .rollup__fill.warn { background: var(--warn); }
  .rollup__fill.crit { background: var(--crit); }
  .rollup__val { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 650; cursor: pointer; font-family: inherit; border: 1px solid transparent;
    transition: transform .06s ease, background .12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--primary:hover { background: var(--accent-ink); }
  .btn--ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .btn--ghost:hover { background: var(--surface-2); }
  .btn svg { width: 14px; height: 14px; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .search {
    display: flex; align-items: center; gap: 8px; padding: 8px 13px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); flex: 1; min-width: 200px; max-width: 340px;
  }
  .search svg { width: 15px; height: 15px; color: var(--text-faint); flex: none; }
  .search input { border: none; background: none; outline: none; font-family: inherit; font-size: 13px; color: var(--text); width: 100%; }
  .search input::placeholder { color: var(--text-faint); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; overflow-y: hidden; }
  .tab {
    padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border: none; background: none; font-family: inherit; white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab--active { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .tab__count { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 5px; }

  .spark { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 11.5px; color: var(--text-muted); margin-top: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  .callout {
    display: flex; gap: 12px; padding: 13px 16px; border-radius: var(--radius);
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    font-size: 12.5px; color: var(--text); margin-bottom: 20px; line-height: 1.5;
  }
  .callout svg { width: 18px; height: 18px; color: var(--accent); flex: none; margin-top: 1px; }
  .callout b { font-weight: 700; }
  .callout code { font-family: var(--mono); font-size: 11.5px; background: var(--surface); padding: 1px 5px; border-radius: 4px; color: var(--accent-ink); }

  .empty { padding: 40px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 12.5px; }
  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; font-weight: 600; }

  .grow { animation: fade .2s ease; }

  /* ---------- Conversion funnel ---------- */
  .kpi-hero { display: flex; flex-wrap: wrap; gap: 28px; padding: 20px; align-items: center; }
  .kpi-hero__num { font-size: 46px; font-weight: 780; letter-spacing: -.03em; color: var(--good-ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .kpi-hero__side { min-width: 210px; }
  .kpi-hero__funnel { flex: 1; min-width: 300px; }
  .funnel { display: flex; flex-direction: column; gap: 3px; }
  .funnel__row { display: flex; align-items: center; gap: 12px; }
  .funnel__label { width: 178px; flex: none; font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .funnel__track { flex: 1; height: 22px; min-width: 70px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
  .funnel__fill { height: 100%; border-radius: 6px; transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .funnel__count { width: 48px; text-align: right; font-family: var(--mono); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .funnel__rate { margin-left: 190px; font-size: 11px; color: var(--text-faint); padding: 1px 0; }
  @media (max-width: 640px) { .funnel__label { width: 104px; } .funnel__rate { margin-left: 116px; } }

  /* ---------- Report catalog ---------- */
  .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 820px) { .report-grid { grid-template-columns: 1fr; } }
  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .12s ease, transform .06s ease; }
  .report-card:hover { border-color: var(--border-strong); }
  .report-card:active { transform: translateY(1px); }
  .report-card__title { font-weight: 700; font-size: 14px; letter-spacing: -.01em; text-wrap: balance; }
  .report-card__desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; flex: 1; }
  .report-card__foot { display: flex; align-items: center; gap: 8px; margin-top: 2px; }

  /* ---------- Overlay / drawer / modal / toast ---------- */
  /* The overlay root is a sibling of .app, so it does NOT inherit .app's
     color/font — without this, drawer/modal text fell back to the browser
     default (black), which is illegible on the dark theme. Real bug caught
     in the device drawer's twin values. */
  #overlay-root { font-family: var(--sans); color: var(--text); }
  .overlay { position: fixed; inset: 0; background: rgba(8,12,23,.55); backdrop-filter: blur(2px); z-index: 40; opacity: 0; animation: ovfade .16s ease forwards; }
  @keyframes ovfade { to { opacity: 1; } }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(468px, 96vw); background: var(--surface);
    border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 50;
    display: flex; flex-direction: column; animation: slidein .22s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes slidein { from { transform: translateX(100%); } to { transform: none; } }

  // ---------- Device & Firmware Version Catalog (PRD §5.16 FW-1, SRS §3.18 FW-1.1) ----------
  // Canonical per-product-type record of the firmware versions PeakLogic supports,
  // grouped into named channels. This is the source of truth the twin's firmware
  // properties are validated against (FW-2) and the channel picker is driven from
  // (FW-4). Versions are newest-first within each channel; index 0 is "current".
  // NOTE: deliberately version/compatibility metadata only — whether PeakLogic also
  // hosts and distributes the images themselves is left open by PRD §5.16.
  const FIRMWARE_CATALOG = {
    pool_system:  { product: "Pool chemistry controller", channels: { stable: ["4.2.1", "4.1.6", "4.0.9"], beta: ["4.3.0"] } },
    hvac:         { product: "HVAC / RTU monitor",        channels: { stable: ["4.2.1", "4.2.0", "4.1.4"], beta: ["4.3.0"] } },
    refrigeration:{ product: "Refrigeration probe",       channels: { stable: ["4.2.1", "4.1.9"],          beta: ["4.3.0"] } },
    energy_meter: { product: "Panel / demand meter",      channels: { stable: ["3.8.4", "3.8.1"],          beta: ["3.9.0"] } },
    leak_sensor:  { product: "Leak / moisture sensor",    channels: { stable: ["2.6.2", "2.6.0", "2.5.7"], beta: [] } },
    flow_meter:   { product: "Flow meter",                channels: { stable: ["4.2.1", "4.1.6"],          beta: ["4.3.0"] } },
    lift_station: { product: "Lift-station controller",   channels: { stable: ["4.2.1", "4.1.6"],          beta: ["4.3.0"] } },

  };

  // A twin firmware value is stored as "<channel>-<version>" (e.g. "stable-4.2.1").
  function parseFw(v) {
    const m = /^([a-z]+)-(.+)$/.exec(String(v || ""));
    return m ? { channel: m[1], version: m[2] } : { channel: null, version: String(v || "") };
  }
  // FW-2 / FW-2.1: classify a device's reported firmware against the catalog for its
  // product type. Anything the catalog doesn't list is "unmanaged" — never silently OK.
  // A category with no catalog entry (or an unknown category) is also unmanaged, per
  // the section's stated error/edge conditions.
  function fwStatus(cat, fwValue) {
    const entry = FIRMWARE_CATALOG[cat];
    const { channel, version } = parseFw(fwValue);
    if (!entry || !channel || !entry.channels[channel]) return { code: "unmanaged", label: "Unmanaged", cls: "crit" };
    const list = entry.channels[channel];
    const i = list.indexOf(version);
    if (i === -1) return { code: "unmanaged", label: "Unmanaged", cls: "crit" };
    if (i === 0) return { code: "current", label: "Current", cls: "good" };
    return { code: "outdated", label: "Update available", cls: "warn", latest: channel + "-" + list[0] };
  }
  // FW-4 / FW-4.1: the channel/version options a device may be assigned, from the
  // catalog for that product type — never a free-typed string.
  function fwOptionsFor(cat) {
    const entry = FIRMWARE_CATALOG[cat];
    if (!entry) return [];
    return Object.keys(entry.channels).flatMap(ch => entry.channels[ch].map(v => ch + "-" + v));
  }
  // Illustrative firmware spread across the seeded demo fleet, so the drift view has
  // something real to classify (a fleet uniformly on one version proves nothing).
  // Deterministic — keyed off the device id — so counts stay stable across renders.
  // Demo data only: a real fleet reports its own installed versions.
  (function seedFleetFirmware() {
    const EOL = { pool_system: "stable-3.9.2", hvac: "stable-3.7.0", refrigeration: "stable-3.9.9",
                  energy_meter: "stable-3.2.0", leak_sensor: "stable-1.9.4", flow_meter: "stable-3.9.2",
                  lift_station: "stable-3.9.2", roof_moisture: "stable-1.8.0" };
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      let h = 0; for (let i = 0; i < d.id.length; i++) h = (h * 31 + d.id.charCodeAt(i)) >>> 0;
      const opts = fwOptionsFor(a.cat);
      const base = d.cfg || CAT_CONFIG[a.cat] || CAT_CONFIG.hvac;
      const roll = h % 10;
      let fw;
      if (roll === 0 && EOL[a.cat]) fw = EOL[a.cat];                                  // pre-catalog / EOL build
      else if (roll < 4 && opts.length > 1) fw = opts[1 + (h % (opts.length - 1))];    // supported but behind
      else fw = opts[0] || base.fw;                                                    // current
      d.cfg = { ...base, fw: fw };
    }))));
  })();

  // FW-3 / FW-3.1: fleet-wide firmware drift, computed from the same catalog the twin
  // is validated against — never a second, parallel classification.
  function fwFleet() {
    return allDevices().map(d => {
      const fw = (d.cfg && d.cfg.fw) || (CAT_CONFIG[d.cat] && CAT_CONFIG[d.cat].fw);
      return { ...d, fw: fw, st: fwStatus(d.cat, fw) };
    });
  }

  // <option> markup for a category's catalogued firmware, newest stable preselected.
  function fwOptsMarkup(cat) {
    const opts = fwOptionsFor(cat);
    if (!opts.length) return `<option value="">No catalogued firmware</option>`;
    return opts.map((v, i) => {
      const st = fwStatus(cat, v);
      const tag = st.code === "current" ? " · current" : "";
      return `<option value="${v}"${i === 0 ? " selected" : ""}>${v}${tag}</option>`;
    }).join("");
  }

    { id: "fleet-health", name: "Fleet Health & Uptime", vertical: "All",
      desc: "Device online/offline, silent devices, and reporting compliance across the estate." },
    { id: "energy", name: "Energy Performance", vertical: "Energy",
      desc: "Normalized vs. current draw overlay, peak demand, deviation flags, and estimated cost savings." },
    { id: "risk", name: "Risk Reduction Summary", vertical: "Cross-cutting",
      desc: "Assets flagged at-risk, then normalized to reduce risk — the prevention story, by org and period." },
    { id: "refrigeration", name: "Refrigeration Compliance", vertical: "Refrigeration",
      desc: "Product-temperature excursions vs. FDA cold-holding limits; food-safety log." },
    { id: "pool-chem", name: "Pool Chemistry Compliance", vertical: "Pool",
      desc: "pH, free chlorine, and TDS vs. CDC MAHC ranges; time out of range." },
  ];

  // ---------- App state ----------
  const S = { view: "fleet", actingAs: null, partner: null, tab: "sites", ptab: "accounts", setTab: "profile", query: "" };
  // Personal preferences (demo-local)
  const PREFS = { notifyCritical: true, notifyDigest: true, notifyDispatch: false };

  // ---------- Helpers ----------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tenantById = (id) => TENANTS.find(t => t.id === id);
  const partnerById = (id) => PARTNERS.find(p => p.id === id);
  const partnerFor = (tenant) => (tenant && tenant.partnerId ? partnerById(tenant.partnerId) : null);
  // A partner's white-label logo mark (initials on the partner's brand color).
  function partnerLogo(p, px) {
    const s = px || 34;
    return `<span style="width:${s}px;height:${s}px;border-radius:${Math.round(s*0.28)}px;background:${p.brand};display:grid;place-items:center;color:#fff;font-weight:800;font-size:${Math.round(s*0.34)}px;flex:none;letter-spacing:-.02em">${esc(p.logo || p.name[0])}</span>`;
  }

  function healthPill(h, label) {
    const map = { good: ["good", label || "Healthy"], warn: ["warn", label || "Degraded"], crit: ["crit", label || "Critical"] };
    const [cls, txt] = map[h] || map.good;
    return `<span class="pill pill--${cls}"><span class="dot"></span>${txt}</span>`;
  }
  function statePill(state) {
    const m = STATE_META[state] || STATE_META.registered;
    return `<span class="pill pill--${m.pill}"><span class="dot"></span>${m.label}</span>`;
  }
  function rollup(online, total) {
    const pct = total ? Math.round((online / total) * 100) : 0;
    const off = total - online;
    const cls = off === 0 ? "" : (online / total < .9 ? "crit" : "warn");
    return `<div class="rollup"><div class="rollup__track"><div class="rollup__fill ${cls}" style="width:${pct}%"></div></div>
      <span class="rollup__val">${online}/${total}</span></div>`;
  }
  function sparkline(data, health) {
    const w = 76, h = 22, pad = 2;
    const min = Math.min(...data), max = Math.max(...data), rng = (max - min) || 1;
    const pts = data.map((v, i) => {
      const x = pad + (i / (data.length - 1)) * (w - pad * 2);
      const y = pad + (1 - (v - min) / rng) * (h - pad * 2);
      return [x, y];
    });
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`;
    const color = health === "crit" ? "var(--crit)" : health === "warn" ? "var(--warn)" : "var(--good)";
    const last = pts[pts.length - 1];
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <path d="${area}" fill="${color}" opacity="0.12"></path>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2" fill="${color}"></circle>
    </svg>`;
  }

  // Headline conversion = dispatched → on-site (reporting-and-kpi-design.md §3)
  function conversionPct(f) { return f.dispatched ? Math.round((f.onsite / f.dispatched) * 100) : 0; }
  // Fan-out: the fleet funnel is the sum of each partner's own funnel, merged here.
  function fleetFunnel() {
    return PARTNERS.reduce((a, p) => {
      a.dispatched += p.funnel.dispatched; a.accepted += p.funnel.accepted;
      a.onsite += p.funnel.onsite; a.completed += p.funnel.completed; return a;
    }, { dispatched: 0, accepted: 0, onsite: 0, completed: 0 });
  }
  function renderFunnel(f) {
    const stages = [
      { key: "dispatched", label: "Dispatched to CMMS", color: "var(--accent)" },
      { key: "accepted", label: "Accepted in CMMS", color: "var(--info)" },
      { key: "onsite", label: "On-site service call", color: "var(--good)", headline: true },
      { key: "completed", label: "Completed / resolved", color: "var(--good)", faded: true },
    ];
    const max = f.dispatched || 1;
    const rate = (n, d) => (d ? Math.round((n / d) * 100) : 0);
    const rateFor = { accepted: rate(f.accepted, f.dispatched), onsite: rate(f.onsite, f.accepted), completed: rate(f.completed, f.onsite) };
    const rateLabel = { accepted: "accepted", onsite: "conversion", completed: "resolved" };
    let html = '<div class="funnel">';
    stages.forEach((s, i) => {
      const w = Math.round((f[s.key] / max) * 100);
      html += `<div class="funnel__row">
        <div class="funnel__label">${s.label}${s.headline ? ' <span class="pill pill--good" style="padding:0 7px"><span class="dot"></span>headline</span>' : ''}</div>
        <div class="funnel__track"><div class="funnel__fill" style="width:${w}%;background:${s.color}${s.faded ? ';opacity:.5' : ''}"></div></div>
        <div class="funnel__count">${f[s.key].toLocaleString()}</div></div>`;
      if (i < stages.length - 1) {
        const nk = stages[i + 1].key;
        html += `<div class="funnel__rate">↓ ${rateFor[nk]}% ${rateLabel[nk]}</div>`;
      }
    });
    return html + "</div>";
  }

  // ---------- Health rollups (ALWAYS derived from device health, bottom-up) ----------
  // Fix: previously site/tenant status read a manually-set asset/tenant `health`
  // field that could disagree with the devices inside — a site with a critical
  // device could show green. Now every rollup is computed from the actual
  // device states, so it can never drift.
  const HRANK = { good: 0, warn: 1, crit: 2 };
  const RANKH = ["good", "warn", "crit"];
  function worstHealth(list) { return RANKH[list.reduce((m, h) => Math.max(m, HRANK[h] || 0), 0)]; }
  function assetDeviceHealth(a) { return worstHealth(a.devices.map(d => d.health)); }
  function siteHealth(s) { return worstHealth(s.assets.flatMap(a => a.devices.map(d => d.health))); }
  function tenantHealthOf(t) { return worstHealth(t.sites.flatMap(s => s.assets.flatMap(a => a.devices.map(d => d.health)))); }
  function tenantCountsOf(t) {
    let crit = 0, warn = 0;
    t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => { if (d.health === "crit") crit++; else if (d.health === "warn") warn++; })));
    return { crit, warn };
  }
  // ALL tenant counts derived from the actual devices, so the header, tabs,
  // stat cards, and map never disagree (fixes phantom-count misalignment).
  function tenantStats(t) {
    let total = 0, online = 0, crit = 0, warn = 0;
    t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      total++;
      if (d.state === "reporting" || d.state === "configured") online++;
      if (d.health === "crit") crit++; else if (d.health === "warn") warn++;
    })));
    return { total, online, crit, warn, tickets: crit, health: crit ? "crit" : warn ? "warn" : "good" };
  }
  // One users list per tenant — used for BOTH the tab count and the rendered
  // rows, so they can't drift (fixes "3 shown, count says 6").
  function tenantUsers(t) {
    return [
      { n: "Operations Manager", e: "ops@" + t.id + ".example", r: "Admin" },
      { n: "Facilities Lead", e: "facilities@" + t.id + ".example", r: "Operator" },
      { n: "Night Shift Tech", e: "nightshift@" + t.id + ".example", r: "Operator" },
    ];
  }

  // ---------- Map (self-contained — no external tiles; sandbox blocks them) ----------
  function sitePointsFor(tenants) {
    const pts = [];
    tenants.forEach(t => {
      const p = partnerFor(t);
      t.sites.forEach(s => {
        if (s.lat == null) return;
        pts.push({ lat: s.lat, lng: s.lng, site: s.name, tenant: t.name, tenantId: t.id,
          partner: p ? p.name : "Direct", health: siteHealth(s),
          devices: s.assets.reduce((a, x) => a + x.devices.length, 0) });
      });
    });
    return pts;
  }
  function projectLL(lat, lng, w, h) {
    const latMax = 28.35, latMin = 27.25, lngMin = -82.98, lngMax = -82.05;
    return [((lng - lngMin) / (lngMax - lngMin)) * w, ((latMax - lat) / (latMax - latMin)) * h];
  }
  function renderMap(points, height) {
    const W = 900, H = height || 380;
    const grid = [];
    for (let x = 0; x <= W; x += 90) grid.push(`<line class="map__grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`);
    for (let y = 0; y <= H; y += 76) grid.push(`<line class="map__grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`);
    const pins = points.map(p => {
      const [x, y] = projectLL(p.lat, p.lng, W, H);
      const c = p.health === "crit" ? "var(--crit)" : p.health === "warn" ? "var(--warn)" : "var(--good)";
      const data = esc(JSON.stringify({ site: p.site, tenant: p.tenant, partner: p.partner, status: p.health, devices: p.devices }));
      const pulse = p.health === "crit" ? `<circle class="map__pulse" r="6" fill="${c}"></circle>` : "";
      return `<g class="map__pin" data-pin="${data}" ${p.tenantId ? `data-action="manage-tenant:${p.tenantId}"` : ""} transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
        <circle class="halo" r="14" fill="${c}"></circle>${pulse}
        <circle class="dot" r="5.5" fill="${c}" stroke="var(--surface)" stroke-width="2"></circle></g>`;
    }).join("");
    return `<div class="map">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <rect width="${W}" height="${H}" class="map__land"></rect>
        <path class="map__water" d="M0,0 H240 Q246,140 196,236 Q150,320 214,${H} H0 Z"></path>
        <path class="map__water" d="M338,${H} Q360,300 430,286 Q516,274 520,${H} Z"></path>
        <g>${grid.join("")}</g>
        <text x="54" y="${H - 22}" class="map__label">Gulf of Mexico</text>
        <text x="386" y="${H - 14}" class="map__label">Tampa Bay</text>
        ${pins}
      </svg>
      <div class="map__tip" id="map-tip"></div>
      <div class="map__legend">
        <span><span class="dot" style="background:var(--good)"></span>Healthy</span>
        <span><span class="dot" style="background:var(--warn)"></span>Warning</span>
        <span><span class="dot" style="background:var(--crit)"></span>Critical</span>
        <span class="faint" style="margin-left:auto">${points.length} sites · hover for detail · click to open · schematic (real tiles in the deployed app)</span>
      </div>
    </div>`;
  }

  // ---------- Overlay line chart (normalized/expected vs current) ----------
  function overlayChart(baseline, actual, opts) {
    opts = opts || {};
    const W = 860, H = 220, pad = 34;
    const all = baseline.concat(actual);
    const min = Math.min(...all) * 0.9, max = Math.max(...all) * 1.05, rng = (max - min) || 1;
    const px = (i, arr) => pad + (i / (arr.length - 1)) * (W - pad * 2);
    const py = (v) => pad / 2 + (1 - (v - min) / rng) * (H - pad * 1.5);
    const line = (arr) => arr.map((v, i) => (i ? "L" : "M") + px(i, arr).toFixed(1) + " " + py(v).toFixed(1)).join(" ");
    // shade where actual exceeds baseline (spikes = cost / anomaly)
    const overArea = actual.map((v, i) => `${px(i, actual).toFixed(1)},${py(Math.max(v, baseline[i])).toFixed(1)}`).join(" ");
    const baseArea = baseline.slice().reverse().map((v, i) => `${px(baseline.length - 1 - i, baseline).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    const yTicks = [min, (min + max) / 2, max].map(v => `<text x="4" y="${py(v).toFixed(1)}" class="map__label" style="text-transform:none;letter-spacing:0;font-size:10px">${Math.round(v)}${opts.unit || ""}</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:auto">
      <polygon points="${overArea} ${baseArea}" fill="var(--warn)" opacity="0.14"></polygon>
      <path d="${line(baseline)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"></path>
      <path d="${line(actual)}" fill="none" stroke="var(--good)" stroke-width="2.25" stroke-linejoin="round"></path>
      ${yTicks}
    </svg>`;
  }

  // Generic labelled stage bars (used by the risk-reduction report).
  function renderStages(stages) {
    const max = stages[0].count || 1;
    let html = '<div class="funnel">';
    stages.forEach((s, i) => {
      const w = Math.round((s.count / max) * 100);
      html += `<div class="funnel__row"><div class="funnel__label">${s.label}</div>
        <div class="funnel__track"><div class="funnel__fill" style="width:${w}%;background:${s.color || 'var(--accent)'}"></div></div>
        <div class="funnel__count">${s.count}</div></div>`;
      if (i < stages.length - 1 && s.rate) html += `<div class="funnel__rate">↓ ${s.rate}</div>`;
    });
    return html + "</div>";
  }

  // ---------- Derived aggregates (fan-out, computed per-org then merged) ----------
  function fleetTotals() {
    return TENANTS.reduce((a, t) => {
      const s = tenantStats(t); a.online += s.online; a.total += s.total; a.crit += s.crit; a.warn += s.warn; a.tickets += s.tickets; return a;
    }, { online: 0, total: 0, crit: 0, warn: 0, tickets: 0 });
  }
  function needsAttention() {
    const rows = [];
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      if (d.health === "crit" || d.health === "warn") {
        rows.push({ health: d.health, org: t.name, orgId: t.id, site: s.name, asset: a.name, cat: a.cat, device: d.name, id: d.id, metric: d.metric, state: d.state });
      }
    }))));
    return rows.sort((x, y) => (x.health === "crit" ? 0 : 1) - (y.health === "crit" ? 0 : 1));
  }
  function allDevices() {
    const rows = [];
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      rows.push({ ...d, org: t.name, orgId: t.id, site: s.name, cat: a.cat });
    }))));
    return rows;
  }
  function deviceIndex() {
    const idx = {};
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      idx[d.id] = { d: d, org: t.name, orgId: t.id, site: s.name, asset: a.name, cat: a.cat };
    }))));
    return idx;
  }

  // Device twin: desired (cloud→device) vs reported (device→cloud), keyed off lifecycle state
  function twinFor(d, cat) {
    const base = d.cfg || CAT_CONFIG[cat] || CAT_CONFIG.hvac;
    const desired = {
      "Reporting interval": base.interval + "s",
      "Metrics": base.metrics.join(", "),
      "Thresholds": base.thresholds,
      "Firmware channel": base.fw,
      "Command channel": "direct-methods"
    };
    let reported = null, sync;
    if (d.state === "reporting") {
      reported = { "Config version": "v7", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "MQTT/TLS :443", "Last twin sync": "2m ago" };
      sync = { cls: "good", label: "In sync" };
    } else if (d.state === "configured") {
      reported = { "Config version": "v7", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "MQTT/TLS :443", "Last twin sync": "just now" };
      sync = { cls: "good", label: "In sync" };
    } else if (d.state === "provisioning") {
      reported = { "Config version": "— applying", "Firmware installed": base.fw, "Reporting interval": "— pending", "Connectivity": "MQTT/TLS :443", "Last twin sync": "pushing…" };
      sync = { cls: "warn", label: "Config push pending" };
    } else if (d.state === "silent") {
      reported = { "Config version": "v6", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "last seen 46m ago", "Last twin sync": "stale" };
      sync = { cls: "crit", label: "Device silent" };
    } else if (d.state === "registered") {
      sync = { cls: "neutral", label: "Awaiting first connection" };
    } else {
      sync = { cls: "neutral", label: "Decommissioned" };
    }
    return { desired: desired, reported: reported, sync: sync };
  }

  const ID_PREFIX = { pool_system: "pl", hvac: "hv", refrigeration: "rf", energy_meter: "em", leak_sensor: "lk", pump: "pm" };
  function genId(cat) {
    const p = ID_PREFIX[cat] || "dev";
    const n = Math.floor(1000 + Math.random() * 8999);
    const a = "abcdefgh"[Math.floor(Math.random() * 8)];
    return `${p}-${n}-${a}`;
  }
  // Metric explainer — a small ⓘ that reveals how a metric is calculated and
  // why it matters (JS-positioned so it escapes panels' overflow:hidden).
  // The single information affordance used everywhere in the console. Anything that
  // reveals explanatory copy on hover/focus uses this exact glyph — a lowercase "i"
  // in a circle — so "there is more information here" always looks the same.
  const INFO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11.4v4.4"/><circle cx="12" cy="7.7" r="1.15" fill="currentColor" stroke="none"/></svg>';
  function explain(how, why) {
    return `<span class="mx-i" tabindex="0" aria-label="More information" data-how="${esc(how)}" data-why="${esc(why)}">${INFO_ICON}</span>`;
  }
  // Column explainer — reveals a plain-language meaning for a table column header on
  // hover/focus. Uses the same INFO_ICON and the same mx-i/mx-tip hover mechanism as
  // the metric explainer above; only the payload differs (data-tip vs data-how/why).
  function explainCol(text) {
    return `<span class="mx-i" tabindex="0" aria-label="More information" data-tip="${esc(text)}">${INFO_ICON}</span>`;
  }
  function showMxTip(el) {
    const tip = $("#mx-tip");
    const plain = el.getAttribute("data-tip");
    tip.innerHTML = plain != null
      ? `<p>${esc(plain)}</p>`
      : `<b>How it's calculated</b><p>${esc(el.getAttribute("data-how"))}</p><b>Why it matters</b><p>${esc(el.getAttribute("data-why"))}</p>`;
    tip.classList.add("show");
    const r = el.getBoundingClientRect(), th = tip.offsetHeight, tw = 252;
    let left = Math.min(r.left, window.innerWidth - tw - 12);
    let top = r.bottom + 8;
    if (top + th > window.innerHeight - 12) top = r.top - th - 8;
    tip.style.left = Math.max(12, left) + "px"; tip.style.top = top + "px";
  }
  function hideMxTip() { $("#mx-tip").classList.remove("show"); }

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg><span>${esc(msg)}</span>`;
    $("#toasts").appendChild(t);
    setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 2600);
  }

  // ---------- Views ----------
  function viewFleet() {
    const T = fleetTotals();
    const na = needsAttention();
    const orgCount = TENANTS.length + PARTNERS.length;
    const offline = T.total - T.online;
    const ff = fleetFunnel();
    const ff_conv = conversionPct(ff);

    const stats = [
      { label: "Organizations", value: orgCount, sub: `${TENANTS.length} tenants · ${PARTNERS.length} partners`, accent: "var(--accent)",
        how: "Count of every tenant (customer) and channel-partner organization in your book of business.", why: "The breadth of what you manage from one console — the single pane of glass." },
      { label: "Devices online", value: T.online.toLocaleString(), sub: `${offline} offline of ${T.total.toLocaleString()}`, accent: offline > 8 ? "var(--warn)" : "var(--good)",
        how: "Devices currently reporting or configured, summed across every org via per-org scoped reads (fan-out).", why: "Coverage — how much of the estate is actually live and streaming right now." },
      { label: "Open critical alerts", value: T.crit, sub: `${T.warn} warnings active`, accent: T.crit ? "var(--crit)" : "var(--good)",
        how: "Devices whose latest reading is in a critical state, counted across all orgs.", why: "The highest-severity issues — these may already mean downtime, a safety risk, or a compliance breach." },
      { label: "Open tickets", value: T.tickets, sub: "across all accounts", accent: "var(--info)",
        how: "Service tickets auto-created from critical alerts — one work order per critical device — then dispatched to the partner.", why: "Work in flight, and the top of the auto-dispatch → service-call conversion funnel." }
    ].map(s => `<div class="stat"><div class="stat__accent" style="background:${s.accent}"></div>
      <div class="stat__label" style="display:flex;align-items:center;gap:5px">${s.label} ${explain(s.how, s.why)}</div><div class="stat__value">${s.value}</div><div class="stat__sub">${s.sub}</div></div>`).join("");

    const attnRows = na.map(r => `
      <tr class="clickable" data-action="manage-tenant:${r.orgId}">
        <td class="sev-cell"><span class="sev-stripe" style="background:var(--${r.health})"></span></td>
        <td><div class="row-main"><span class="strong">${esc(r.device)}</span><span class="row-sub">${esc(r.org)} · ${esc(r.site)}</span></div></td>
        <td><span class="pill pill--neutral"><span class="dot"></span>${CAT_LABEL[r.cat]}</span></td>
        <td class="mono muted">${esc(r.metric)}</td>
        <td>${statePill(r.state)}</td>
      </tr>`).join("");

    const orgHealth = TENANTS.slice().sort((a,b)=>HRANK[tenantHealthOf(b)]-HRANK[tenantHealthOf(a)]).map(t => { const st = tenantStats(t); return `
      <tr class="clickable" data-action="manage-tenant:${t.id}">
        <td><div class="row-main"><span class="strong">${esc(t.name)}</span><span class="row-sub">${esc(t.industry)}</span></div></td>
        <td style="width:170px">${rollup(st.online, st.total)}</td>
        <td style="text-align:right">${healthPill(st.health)}</td>
      </tr>`; }).join("");

    return `
      <div class="page-head"><h1>Fleet Overview</h1>
        <p>Global health across every account you manage. Superadmin — all organizations in view.</p></div>
      <div class="stats">${stats}</div>
      <div class="panel" style="margin-bottom:22px">
        <div class="panel__head"><span class="panel__title">Automated dispatch → service calls</span>
          <span class="panel__note">CMMS conversion · this month</span></div>
        <div class="kpi-hero">
          <div class="kpi-hero__side">
            <div class="readout__l" style="display:flex;align-items:center;gap:5px">Conversion · dispatched → on-site ${explain("On-site service calls ÷ automated work orders dispatched to partners' CMMS this month, fanned out per partner and summed.", "The core value metric — proves the platform's detection turns into real, billable service work.")}</div>
            <div class="kpi-hero__num">${ff_conv}%</div>
            <div class="faint" style="font-size:12px;margin-top:6px">${ff.onsite.toLocaleString()} on-site service calls generated from ${ff.dispatched.toLocaleString()} auto-dispatched work orders</div>
            <button class="btn btn--ghost" data-action="nav:reports" style="margin-top:14px">Open full report

          </div>
          <div class="kpi-hero__funnel">${renderFunnel(ff)}</div>
        </div>
      </div>
      <div class="panel" style="margin-bottom:22px">
        <div class="panel__head"><span class="panel__title">Asset locations</span>
          <span class="panel__note">every site · all organizations · Tampa Bay</span></div>
        ${renderMap(sitePointsFor(TENANTS))}
      </div>
      <div class="callout">
        ${INFO_ICON}
        <div>Every number here — health rollups, the CMMS conversion funnel, and the map alike — is assembled by <b>fanning out per-organization scoped reads</b> and merging them here, never a single cross-tenant query. Each org opens through <code>withStaffActingOnTenant()</code>, so the isolation boundary holds even for a "global" view.</div>
      </div>
      <div class="grid2">
        <div class="panel">
          <div class="panel__head"><span class="panel__title">Needs attention</span>
            <span class="panel__note">${na.length} items · sorted by severity</span></div>
          <table class="tbl"><thead><tr><th class="sev-cell"></th><th>Device</th><th>System</th><th>Reading</th><th>State</th></tr></thead>
            <tbody>${attnRows}</tbody></table>
        </div>
        <div class="panel">
          <div class="panel__head"><span class="panel__title">Tenant health</span>
            <span class="panel__note">online / total</span></div>
          <table class="tbl"><tbody>${orgHealth}</tbody></table>
        </div>
      </div>`;
  }

  function viewTenants() {
    const q = S.query.toLowerCase();
    const rows = TENANTS.filter(t => !q || t.name.toLowerCase().includes(q) || t.industry.toLowerCase().includes(q)).map(t => {
      const p = partnerFor(t); const st = tenantStats(t);
      return `
      <tr>
        <td><div class="row-main"><span class="strong">${esc(t.name)}</span><span class="row-sub mono">${t.id}</span></div></td>
        <td class="muted">${esc(t.industry)}</td>
        <td>${p ? `<span style="display:inline-flex;align-items:center;gap:8px">${partnerLogo(p, 20)}<span class="muted">${esc(p.name)}</span></span>` : '<span class="faint">Direct</span>'}</td>
        <td class="muted">${esc(t.mgr)}</td>
        <td style="width:140px">${rollup(st.online, st.total)}</td>
        <td>${st.crit ? `<span class="pill pill--crit"><span class="dot"></span>${st.crit} critical</span>` : st.warn ? `<span class="pill pill--warn"><span class="dot"></span>${st.warn} warning</span>` : healthPill("good")}</td>
        <td style="text-align:right"><button class="btn btn--primary" data-action="manage-tenant:${t.id}">Manage
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></td>
      </tr>`;
    }).join("");

    return `
      <div class="page-head"><h1>Tenants</h1><p>Customer organizations. Open one to manage it in an audited act-as context — the same views the customer sees, scoped by row-level security.</p></div>
      <div class="toolbar">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="text" id="q" placeholder="Search tenants…" value="${esc(S.query)}" autocomplete="off"></div>
        <button class="btn btn--primary" data-action="new-tenant" style="margin-left:auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>New tenant</button>
      </div>
      <div class="panel"><table class="tbl">
        <thead><tr><th>Organization</th><th>Industry</th><th>Channel partner</th><th>Account manager</th><th>Devices</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7"><div class="empty">No tenants match "${esc(S.query)}"</div></td></tr>`}</tbody>
      </table></div>`;
  }

  function viewPartners() {
    const rows = PARTNERS.map(p => `
      <tr>
        <td><div style="display:flex;align-items:center;gap:11px">
          ${partnerLogo(p, 30)}
          <div class="row-main"><span class="strong">${esc(p.name)}</span><span class="row-sub mono">${p.id}</span></div></div></td>
        <td class="muted">${esc(p.region)}</td>
        <td class="num strong">${p.accountList.length}</td>
        <td class="num muted">${p.technicians.length}</td>
        <td class="num muted">${p.routes.length}</td>
        <td>${healthPill(p.health, p.health === "warn" ? "Route delay" : "Healthy")}</td>
        <td style="text-align:right"><button class="btn btn--primary" data-action="manage-partner:${p.id}">Manage
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></td>
      </tr>`).join("");
    return `
      <div class="page-head"><h1>Channel Partners</h1><p>White-label partner organizations (the Purple Standard family), authenticated in the separate <span class="mono">PeakLogicPartners</span> directory. Each sees only its attributed accounts. Open one to manage it in an audited act-as context.</p></div>
      <div class="toolbar">
        <span class="faint" style="font-size:12.5px">${PARTNERS.length} partners</span>
        <button class="btn btn--primary" data-action="new-partner" style="margin-left:auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>New channel partner</button>
      </div>
      <div class="panel"><table class="tbl">
        <thead><tr><th>Partner</th><th>Territory</th><th class="num">Accounts</th><th class="num">Techs</th><th class="num">Routes</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  // Flat, fleet-wide list across every tenant's sites — the finest-grain
  // physical location this console has, one level below Tenants. No site
  // has its own id in this data model (only a name, unique within this
  // seed set), so a row's only drill-through is into its parent tenant's
  // act-as context (same manage-tenant action the Tenants list already
  // uses) — there's no standalone per-site page to jump to yet.
  function viewSites() {
    const q = S.query.toLowerCase();
    const allSites = [];
    TENANTS.forEach(t => {
      const p = partnerFor(t);
      t.sites.forEach(s => allSites.push({ s, t, p }));
    });
    const filtered = allSites.filter(({ s, t }) => !q || s.name.toLowerCase().includes(q) || t.name.toLowerCase().includes(q));
    const rows = filtered.map(({ s, t, p }) => {
      const dev = s.assets.reduce((a, x) => a + x.devices.length, 0);
      const worst = siteHealth(s);
      return `
      <tr class="clickable" data-action="manage-tenant:${t.id}">
        <td><span class="strong">${esc(s.name)}</span></td>
        <td class="muted">${esc(t.name)}</td>
        <td>${p ? `<span style="display:inline-flex;align-items:center;gap:8px">${partnerLogo(p, 20)}<span class="muted">${esc(p.name)}</span></span>` : '<span class="faint">Direct</span>'}</td>
        <td class="num muted">${s.assets.length}</td>
        <td class="num muted">${dev}</td>
        <td>${healthPill(worst)}</td>
        <td style="text-align:right"><button class="btn btn--primary" data-action="manage-tenant:${t.id}">Open tenant
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></td>
      </tr>`;
    }).join("");
    return `
      <div class="page-head"><h1>Sites</h1><p>Every physical site across every organization you manage. A site belongs to one tenant — open its tenant to manage it in an audited act-as context.</p></div>
      <div class="toolbar">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="text" id="q" placeholder="Search sites…" value="${esc(S.query)}" autocomplete="off"></div>
        <span class="faint" style="margin-left:auto;font-size:12.5px">${allSites.length} sites</span>
      </div>
      <div class="panel"><table class="tbl">
        <thead><tr><th>Site</th><th>Organization</th><th>Channel partner</th><th class="num">Assets</th><th class="num">Devices</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7"><div class="empty">No sites match "${esc(S.query)}"</div></td></tr>`}</tbody>
      </table></div>`;
  }

  function viewPartnerDetail() {
    const p = partnerById(S.partner);
    if (!p) { S.view = "partners"; return viewPartners(); }
    const tabs = [
      { id: "accounts", label: "Accounts", count: p.accountList.length },
      { id: "territories", label: "Territories", count: p.territories.length },
      { id: "technicians", label: "Technicians", count: p.technicians.length },
      { id: "routes", label: "Routes", count: p.routes.length },
      { id: "branding", label: "Branding", count: null }
    ].map(x => `<button class="tab ${S.ptab===x.id?'tab--active':''}" data-action="partner-tab:${x.id}">${x.label}${x.count!==null?`<span class="tab__count">${x.count}</span>`:''}</button>`).join("");
    return `
      <div class="page-head"><h1>${esc(p.name)}</h1>
        <p>${esc(p.region)} · ${p.technicians.length} technicians across ${p.territories.length} territories. Partner staff sign in through the <span class="mono">PeakLogicPartners</span> directory; you manage them via audited act-as.</p></div>
      <div class="tabs">${tabs}</div>
      <div class="grow">${partnerTab(p)}</div>`;
  }

  function partnerTab(p) {
    if (S.ptab === "accounts") {
      const rows = p.accountList.map(name => {
        const t = TENANTS.find(x => x.name === name);
        return `<tr class="${t?'clickable':''}" ${t?`data-action="manage-tenant:${t.id}"`:''}>
          <td class="strong">${esc(name)}</td>
          <td class="muted">${t ? esc(t.industry) : "External account"}</td>
          <td>${t ? healthPill(tenantHealthOf(t)) : '<span class="pill pill--neutral"><span class="dot"></span>—</span>'}</td>
          <td style="text-align:right" class="faint">${t ? "Open tenant →" : ""}</td></tr>`;
      }).join("");
      return `<div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6z"/></svg>
        <div>This partner sees <b>only these attributed accounts</b> — enforced by the same row-level security as tenants, scoped by <code>channelPartnerId</code>. You can hop straight into any attributed tenant's own act-as context.</div></div>
        <div class="panel"><table class="tbl"><thead><tr><th>Attributed account</th><th>Industry</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (S.ptab === "territories") {
      const rows = p.territories.map(t => `<tr>
        <td class="sev-cell"><span class="sev-stripe" style="background:var(--${t.health})"></span></td>
        <td class="strong">${esc(t.name)}</td><td class="num muted">${t.accounts} accounts</td>
        <td class="num muted">${t.techs} techs</td><td>${healthPill(t.health, t.health==="warn"?"Unstaffed":"Covered")}</td></tr>`).join("");
      return `<div class="panel"><table class="tbl"><thead><tr><th class="sev-cell"></th><th>Territory</th><th class="num">Accounts</th><th class="num">Techs</th><th>Coverage</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (S.ptab === "technicians") {
      const st = { "on-route": "info", "available": "good", "delayed": "warn", "off-shift": "neutral" };
      const rows = p.technicians.map(t => `<tr><td class="strong">${esc(t.name)}</td><td class="muted">${esc(t.cert)}</td>
        <td><span class="pill pill--${st[t.status]}"><span class="dot"></span>${t.status.replace("-"," ")}</span></td></tr>`).join("");
      return `<div class="panel"><table class="tbl"><thead><tr><th>Technician</th><th>Certification</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (S.ptab === "routes") {
      const st = { "in-progress": "info", "scheduled": "neutral", "delayed": "warn" };
      const rows = p.routes.map(r => `<tr><td class="mono strong">${esc(r.name)}</td><td class="num muted">${r.stops} stops</td>
        <td class="muted">${esc(r.tech)}</td><td><span class="pill pill--${st[r.status]}"><span class="dot"></span>${r.status.replace("-"," ")}</span></td></tr>`).join("");
      return `<div class="panel"><table class="tbl"><thead><tr><th>Route</th><th class="num">Stops</th><th>Technician</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (S.ptab === "branding") {
      return `<div class="panel"><div class="panel__head"><span class="panel__title">White-label configuration</span>
          <button class="btn btn--ghost" data-action="toast:Branding saved for ${esc(p.name)}" style="margin-left:auto">Save branding</button></div>
        <div style="padding:20px;display:flex;flex-direction:column;gap:20px">
          <div class="logo-drop">
            ${partnerLogo(p, 52)}
            <div style="flex:1">
              <div class="strong" style="font-size:15px">${esc(p.name)}</div>
              <div class="mono muted" style="font-size:12px">${esc(p.subdomain)}</div>
              <input type="file" accept=".svg,.png" class="hint" style="margin-top:10px">
              <div class="hint" style="margin-top:4px">Replace the logo with a vector <code>.svg</code> (preferred) or transparent <code>.png</code>, min 512×512. Shown on the partner's co-branded portal, login page, and dispatched work orders.</div>
            </div>
          </div>
          <dl class="kv">
            <dt>Logo mark</dt><dd class="mono">${esc(p.logo || p.name[0])}</dd>
            <dt>Primary color</dt><dd><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:13px;height:13px;border-radius:3px;background:${p.brand}"></span><span class="mono">${p.brand.toUpperCase()}</span> <span class="faint">· editable</span></span></dd>
            <dt>Portal domain</dt><dd class="mono">${esc(p.subdomain)}</dd>
            <dt>Identity source</dt><dd>PeakLogicPartners (Entra External ID)</dd>
            <dt>Login page</dt><dd>Co-branded · PeakLogic footer</dd>
          </dl>
        </div></div>`;
    }
    return "";
  }

  function viewTenantDetail() {
    const t = tenantById(S.actingAs);
    if (!t) { S.view = "tenants"; return viewTenants(); }
    const st = tenantStats(t);
    const tabs = [
      { id: "sites", label: "Sites", count: t.sites.length },
      { id: "assets", label: "Assets", count: t.sites.reduce((a,s)=>a+s.assets.length,0) },
      { id: "devices", label: "Devices", count: st.total },
      { id: "alerts", label: "Alerts", count: st.crit + st.warn },
      { id: "tickets", label: "Tickets", count: st.tickets },
      { id: "users", label: "Users", count: tenantUsers(t).length }
    ].map(x => `<button class="tab ${S.tab===x.id?'tab--active':''}" data-action="tenant-tab:${x.id}">${x.label}<span class="tab__count">${x.count}</span></button>`).join("");

    return `
      <div class="page-head"><h1>${esc(t.name)}</h1>
        <p>${esc(t.industry)} · Account manager ${esc(t.mgr)} · ${st.online}/${st.total} devices online. You are viewing this org exactly as its own operators do.</p></div>
      <div class="tabs">${tabs}</div>
      <div class="grow">${tenantTab(t)}</div>`;
  }

  function tenantTab(t) {
    if (S.tab === "sites") {
      const mapped = t.sites.filter(s => s.lat != null);
      const mapPanel = mapped.length ? `<div class="panel" style="margin-bottom:16px">
        <div class="panel__head"><span class="panel__title">Site map</span><span class="panel__note">${mapped.length} located sites · click a pin to drill in</span></div>
        ${renderMap(sitePointsFor([t]), 320)}</div>` : "";
      return `${mapPanel}
      <div class="toolbar" style="margin-bottom:12px">
        <span class="faint" style="font-size:12.5px">Provisioning here uses the same screens ${esc(t.name)}'s own admin sees</span>
        <button class="btn btn--primary" data-action="site-open:${t.id}" style="margin-left:auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Register site</button>
      </div>
      <div class="panel"><table class="tbl">
        <thead><tr><th>Site</th><th class="num">Assets</th><th class="num">Devices</th><th>Status</th></tr></thead>
        <tbody>${t.sites.length ? t.sites.map(s => {
          const dev = s.assets.reduce((a,x)=>a+x.devices.length,0);
          const worst = siteHealth(s);
          return `<tr class="clickable" data-action="tenant-tab:assets"><td class="strong">${esc(s.name)}</td><td class="num muted">${s.assets.length}</td>
            <td class="num muted">${dev}</td><td>${healthPill(worst)}</td></tr>`;
        }).join("") : `<tr><td colspan="4"><div class="empty">No sites yet — register one to get started</div></td></tr>`}</tbody></table></div>`;
    }
    if (S.tab === "assets") {
      const rows = [];
      t.sites.forEach((s, si) => s.assets.forEach((a, ai) => { const ah = assetDeviceHealth(a);
        const thresholds = a.thresholds || (CAT_CONFIG[a.cat] || {}).thresholds || "—"; rows.push(`
        <tr><td class="sev-cell"><span class="sev-stripe" style="background:var(--${ah})"></span></td>
          <td><div class="row-main"><span class="strong">${esc(a.name)}</span><span class="row-sub">${esc(s.name)}</span></div></td>
          <td><span class="pill pill--neutral"><span class="dot"></span>${CAT_LABEL[a.cat]}</span></td>
          <td class="num muted">${a.devices.length} devices</td>
          <td class="mono muted" style="font-size:11.5px">${esc(thresholds)}</td>
          <td>${healthPill(ah)}</td>
          <td><button class="btn btn--ghost btn--sm" data-action="thresholds-open:${t.id}:${si}.${ai}">Thresholds</button></td></tr>`); }));
      return `<div class="panel"><table class="tbl"><thead><tr><th class="sev-cell"></th><th>Asset</th><th>Category</th><th class="num">Devices</th>
        <th>Alert thresholds ${explainCol("The reading range considered normal for this asset. Readings outside it generate an alert.")}</th>
        <th>Status</th><th></th></tr></thead><tbody>${rows.join("") || `<tr><td colspan="7"><div class="empty">No assets yet</div></td></tr>`}</tbody></table></div>`;
    }
    if (S.tab === "devices") {
      const rows = [];
      t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => rows.push(`
        <tr class="clickable" data-action="device:${d.id}"><td class="mono muted">${d.id}</td>
          <td><div class="row-main"><span class="strong">${esc(d.name)}</span><span class="row-sub">${esc(a.name)}</span></div></td>
          <td>${statePill(d.state)}</td>
          <td class="mono" style="color:${d.health==='crit'?'var(--crit-ink)':d.health==='warn'?'var(--warn-ink)':'var(--text-muted)'}">${esc(d.metric)}</td>
          <td>${sparkline(d.spark, d.health)}</td></tr>`))));
      return `
      <div class="toolbar" style="margin-bottom:12px">
        <span class="faint" style="font-size:12.5px">Provisioning here uses the same screens ${esc(t.name)}'s own admin sees</span>
        <button class="btn btn--primary" data-action="register-open:${t.id}" style="margin-left:auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Register devices</button>
      </div>
      <div class="panel"><table class="tbl"><thead><tr>
        <th>Device ID ${explainCol("The unique identifier assigned when the device was registered — used in API calls, firmware logs, and support tickets.")}</th>
        <th>Name ${explainCol("A human-readable label for the device, usually describing what it monitors and where.")}</th>
        <th>State ${explainCol("The device's lifecycle stage, from zero-touch registration through active reporting to silence.")}</th>
        <th>Latest reading ${explainCol("The most recent telemetry value received from the device.")}</th>
        <th>Trend ${explainCol("The recent trajectory of this device's readings, at a glance.")}</th>
      </tr></thead><tbody>${rows.join("") || `<tr><td colspan="5"><div class="empty">No devices yet</div></td></tr>`}</tbody></table></div>`;
    }
    if (S.tab === "alerts") {
      const rows = [];
      t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
        if (d.health !== "good") rows.push(`
          <tr><td class="sev-cell"><span class="sev-stripe" style="background:var(--${d.health})"></span></td>
            <td><div class="row-main"><span class="strong">${esc(d.name)}</span><span class="row-sub">${esc(s.name)} · ${esc(a.name)}</span></div></td>
            <td>${d.health==="crit"?'<span class="pill pill--crit"><span class="dot"></span>Critical</span>':'<span class="pill pill--warn"><span class="dot"></span>Warning</span>'}</td>
            <td class="mono muted">${esc(d.metric)}</td></tr>`);
      })));
      return rows.length ? `<div class="panel"><table class="tbl"><thead><tr><th class="sev-cell"></th><th>Alert</th><th>Severity</th><th>Reading</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`
        : `<div class="panel"><div class="empty">No open alerts — every device reporting within threshold.</div></div>`;
    }
    if (S.tab === "tickets") {
      // Tickets are the auto-created work orders for CRITICAL devices — so the
      // count and the list always match the alerts (design: critical → ticket).
      const crit = [];
      t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => { if (d.health === "crit") crit.push({ d, a, s }); })));
      if (!crit.length) return `<div class="panel"><div class="empty">No open service tickets.</div></div>`;
      const partner = partnerFor(t);
      const tix = crit.map((x, i) => ({ id: "TCK-" + (3391 - i), subj: `${x.d.name} — ${x.a.name}`, site: x.s.name }));
      return `<div class="panel"><table class="tbl"><thead><tr><th>Ticket</th><th>Issue</th><th>Dispatched to</th><th>Priority</th></tr></thead>

  // FW-3: fleet-wide firmware drift + the catalog (FW-1) it is classified against.
  function viewFirmware() {
    const fleet = fwFleet();
    const q = S.query.toLowerCase();
    const rank = { unmanaged: 0, outdated: 1, current: 2 };
    const shown = fleet
      .filter(d => !q || d.id.includes(q) || d.name.toLowerCase().includes(q) || d.org.toLowerCase().includes(q) || d.fw.toLowerCase().includes(q))
      .sort((a, b) => rank[a.st.code] - rank[b.st.code] || a.org.localeCompare(b.org));

    const n = { unmanaged: 0, outdated: 0, current: 0 };
    fleet.forEach(d => n[d.st.code]++);

    const stats = [
      { label: "Unmanaged firmware", value: n.unmanaged, accent: "var(--crit)",
        how: "Devices whose reported version is not present in the Device & Firmware Version Catalog for their product type.",
        why: "An unmanaged build is one PeakLogic does not support — it may predate the catalog, or be a field-flashed one-off. These are the units you cannot make guarantees about." },
      { label: "Update available", value: n.outdated, accent: "var(--warn)",
        how: "Devices on a catalogued version that is not the newest in their assigned channel.",
        why: "Supported, but behind. This is the upgrade backlog — the queue an OTA campaign would work through." },
      { label: "Current", value: n.current, accent: "var(--good)",
        how: "Devices already on the newest catalogued version for their assigned channel.",
        why: "Nothing to do. The larger this share, the more predictable the fleet's behaviour." }
    ].map(s => `<div class="stat"><div class="stat__accent" style="background:${s.accent}"></div>
        <div class="stat__label" style="display:flex;align-items:center;gap:5px">${s.label} ${explain(s.how, s.why)}</div>
        <div class="stat__value">${s.value}</div>
        <div class="stat__sub">of ${fleet.length} devices</div></div>`).join("");

    const rows = shown.map(d => `
      <tr class="clickable" data-action="device:${d.id}">
        <td class="mono muted">${d.id}</td>
        <td><div class="row-main"><span class="strong">${esc(d.name)}</span><span class="row-sub">${esc(d.site)}</span></div></td>
        <td class="muted">${esc(d.org)}</td>
        <td class="muted">${esc((FIRMWARE_CATALOG[d.cat] && FIRMWARE_CATALOG[d.cat].product) || CAT_LABEL[d.cat] || d.cat)}</td>
        <td class="mono">${esc(d.fw)}</td>
        <td><span class="pill pill--${d.st.cls}"><span class="dot"></span>${d.st.label}</span></td>
        <td class="mono muted">${d.st.code === "outdated" ? esc(d.st.latest) : d.st.code === "current" ? "—" : "not catalogued"}</td>
      </tr>`).join("");

    const catalogRows = Object.keys(FIRMWARE_CATALOG).map(cat => {
      const e = FIRMWARE_CATALOG[cat];
      const chans = Object.keys(e.channels).map(ch => {
        const list = e.channels[ch];
        if (!list.length) return `<span class="pill pill--neutral"><span class="dot"></span>${ch} · none</span>`;
        return `<span class="pill pill--${ch === "stable" ? "good" : "info"}"><span class="dot"></span>${ch} · ${list[0]}${list.length > 1 ? ` (+${list.length - 1})` : ""}</span>`;
      }).join(" ");
      return `<tr><td><b>${esc(e.product)}</b><div class="row-sub mono">${cat}</div></td>
        <td>${chans}</td>
        <td class="mono muted">${Object.keys(e.channels).reduce((a, ch) => a + e.channels[ch].length, 0)} version(s)</td></tr>`;
    }).join("");

    return `
      <div class="page-head"><h1>Firmware</h1>
        <p>The Device &amp; Firmware Version Catalog, and every device measured against it. Versions are validated per product type — anything the catalog doesn't list is surfaced as unmanaged rather than silently accepted.</p></div>

      <div class="stats" style="grid-template-columns:repeat(3,1fr)">${stats}</div>

      <div class="callout">${INFO_ICON}
        <div>Drift is computed from the <b>same catalog</b> the device twin validates against — there is no second classification path. The catalog is version and compatibility metadata; whether PeakLogic also hosts and distributes the images themselves is deliberately still open (PRD §5.16).</div></div>

      <div class="toolbar">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="text" id="q" placeholder="Search by ID, name, org, or version…" value="${esc(S.query)}" autocomplete="off"></div>
        <span class="faint" style="font-size:12.5px">${shown.length} of ${fleet.length} devices shown</span>
      </div>

      <div class="panel"><div class="panel__head"><span class="panel__title">Fleet firmware drift</span>
        <span class="panel__note">worst first · select a device to inspect its twin</span></div>
        <table class="tbl">
        <thead><tr>
          <th>Device ID ${explainCol("The unique identifier assigned when the device was registered.")}</th>
          <th>Name ${explainCol("A human-readable label for the device, and the site it serves.")}</th>
          <th>Organization ${explainCol("The tenant or channel-partner account this device is provisioned under.")}</th>
          <th>Product type ${explainCol("The catalogued product this device is, which determines the firmware versions it may run.")}</th>
          <th>Installed ${explainCol("The firmware version the device most recently reported (device twin, reported properties).")}</th>
          <th>Status ${explainCol("How the installed version compares to the catalog: current, behind the newest in its channel, or not catalogued at all.")}</th>
          <th>Latest ${explainCol("The newest catalogued version in this device's assigned channel, when an upgrade exists.")}</th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="7"><div class="empty">No devices match "${esc(S.query)}"</div></td></tr>`}</tbody></table></div>

      <div class="panel" style="margin-top:18px"><div class="panel__head"><span class="panel__title">Device &amp; Firmware Version Catalog</span>
        <span class="panel__note">supported versions per product type · newest first</span></div>
        <table class="tbl">
        <thead><tr><th>Product type</th><th>Channels</th><th>Supported</th></tr></thead>
        <tbody>${catalogRows}</tbody></table></div>`;
  }
