  // ---------- Overlay: device drawer + register modal ----------
  function closeOverlay() { $("#overlay-root").innerHTML = ""; }

  function openDeviceDrawer(id) {
    const idx = deviceIndex();
    const ctx = idx[id]; if (!ctx) return;
    renderDrawer(ctx);
  }

  function renderDrawer(ctx) {
    const d = ctx.d;
    const tw = twinFor(d, ctx.cat);
    // FW-2 / FW-2.1: validate the twin's firmware values against the catalog for this
    // device's product type and badge the row, rather than rendering them as plain text.
    const fwBadge = (v) => {
      const st = fwStatus(ctx.cat, v);
      if (st.code === "current") return "";
      const title = st.code === "outdated" ? ` title="Latest in this channel: ${esc(st.latest)}"` : ` title="Not present in the firmware catalog for this product type"`;
      return ` <span class="pill pill--${st.cls}"${title} style="margin-left:6px;vertical-align:middle"><span class="dot"></span>${st.label}</span>`;
    };
    const twinRow = (k, v) => {
      const isFw = k === "Firmware channel" || k === "Firmware installed";
      return `<tr><td>${k}</td><td>${esc(v)}${isFw ? fwBadge(v) : ""}</td></tr>`;
    };
    const desiredRows = Object.keys(tw.desired).map(k => twinRow(k, tw.desired[k])).join("");
    const reportedRows = tw.reported
      ? Object.keys(tw.reported).map(k => twinRow(k, tw.reported[k])).join("")
      : `<tr><td colspan="2" style="text-align:center;color:var(--text-faint);font-family:var(--sans);padding:14px 0">No reported state yet — device has not connected.</td></tr>`;
    const canPush = d.state === "registered" || d.state === "provisioning";
    const nonNumeric = /[^\d.\-]/.test(d.metric) || d.state === "registered";

    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <aside class="drawer" role="dialog" aria-label="Device detail">
        <div class="drawer__head">
          <div>
            <div class="drawer__title">${esc(d.name)}</div>
            <div class="drawer__id">${d.id} · ${esc(ctx.org)}</div>
          </div>
          <button class="iconbtn" data-action="close-overlay" aria-label="Close" style="margin-left:auto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="drawer__body">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            ${statePill(d.state)}
            <span class="pill pill--neutral"><span class="dot"></span>${CAT_LABEL[ctx.cat]}</span>
            <span class="faint" style="font-size:12px">${esc(ctx.site)} · ${esc(ctx.asset)}</span>
          </div>

          <div class="readout">
            <div>
              <div class="readout__l">Latest reading</div>
              <div class="readout__v" style="color:${d.health==='crit'?'var(--crit-ink)':d.health==='warn'?'var(--warn-ink)':'var(--text)'}">${nonNumeric ? esc(d.metric) : esc(d.metric)}</div>
            </div>
            <div style="margin-left:auto">${sparkline(d.spark, d.health)}</div>
          </div>

          <div>
            <div class="dsec__label">Device twin — desired properties <span class="arrow">cloud → device</span></div>
            <table class="twin"><tbody>${desiredRows}</tbody></table>
          </div>

          <div>
            <div class="dsec__label">Device twin — reported properties <span class="arrow">device → cloud</span>
              <span class="sync sync--${tw.sync.cls}" style="margin-left:auto;background:var(--${tw.sync.cls==='neutral'?'surface-3':tw.sync.cls+'-soft'});color:var(--${tw.sync.cls==='neutral'?'text-muted':tw.sync.cls+'-ink'})">
                <span class="dot" style="background:var(--${tw.sync.cls==='neutral'?'text-faint':tw.sync.cls})"></span>${tw.sync.label}</span>
            </div>
            <table class="twin"><tbody>${reportedRows}</tbody></table>
          </div>

          <div>
            <div class="dsec__label">Direct methods <span class="arrow">imperative · audited</span></div>
            <div class="methods">
              ${canPush ? `<button class="btn btn--primary" data-action="method:push:${d.id}">Push config now</button>` : ``}
              <button class="btn btn--ghost" data-action="method:ping:${d.id}">Ping</button>
              <button class="btn btn--ghost" data-action="method:reset:${d.id}">Reset device</button>
            </div>
            <p class="hint" style="margin:12px 0 0">Twins carry <b>declarative</b> desired state (auto-applied on connect); direct methods are <b>imperative</b> one-shot commands. Both write to <code>audit_log_entries</code>. Safety-critical actuation stays local-first.</p>
          </div>
        </div>
      </aside>`;
    $("#overlay-root").innerHTML = html;
  }

  function runMethod(method, id) {
    const idx = deviceIndex();
    const ctx = idx[id]; if (!ctx) return;
    const d = ctx.d;
    if (method === "push") {
      d.state = "configured";
      d.metric = d.metric === "awaiting first connection" || d.metric === "pending" ? "config applied" : d.metric;
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `push config → ${d.id}` });
      toast(`Configuration pushed to ${d.id}`);
      render(); renderDrawer(deviceIndex()[id]);
    } else if (method === "ping") {
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `ping → ${d.id}` });
      toast(`Ping ack from ${d.id} · 42 ms`);
    } else if (method === "reset") {
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `reset → ${d.id}` });
      toast(`Reset command sent to ${d.id}`);
    }
  }

  function openRegister(lockedOrgId) {
    const locked = lockedOrgId ? tenantById(lockedOrgId) : null;
    const tenantOpts = locked
      ? `<option value="${locked.id}" selected>${esc(locked.name)}</option>`
      : TENANTS.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
    const cats = Object.keys(CAT_LABEL).filter(c => c !== "pump");
    const catOpts = cats.map(c => `<option value="${c}">${CAT_LABEL[c]}</option>`).join("");
    const firstCat = cats[0];
    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="Register devices">
        <div class="modal__head">
          <h2>Register devices</h2>
          <p>Create cloud <b>intent records</b> with desired configuration attached. Devices self-provision and pull this config on first field connection — no per-unit cloud step at connect time.${locked ? ` Scoped to <b>${esc(locked.name)}</b> — the same provisioning screen this organization's own admin would use.` : ""}</p>
        </div>
        <div class="modal__body">
          <div class="field"><label for="rf-org">Organization</label><select id="rf-org" ${locked ? "disabled" : ""}>${tenantOpts}</select></div>
          <div class="field--row">
            <div class="field"><label for="rf-name">Device name</label><input id="rf-name" type="text" placeholder="e.g. Circulation Pump" value="Circulation Pump"></div>
            <div class="field"><label for="rf-cat">Category</label><select id="rf-cat">${catOpts}</select></div>
          </div>
          <div class="field--row">
            <div class="field"><label for="rf-qty">Quantity</label><input id="rf-qty" type="number" min="1" max="50" value="3"></div>
            <div class="field"><label for="rf-fw">Firmware channel</label>
              <select id="rf-fw">${fwOptsMarkup(firstCat)}</select></div>
          </div>
          <div class="field"><label for="rf-enroll">Enrollment</label>
            <select id="rf-enroll"><option value="group">DPS enrollment group (batch / zero-touch)</option><option value="individual">Individual enrollment (one-off)</option></select></div>
          <p class="hint">Intent rows are created in state <code>registered</code> with <code>tenant_id</code> set and desired-config staged. Group enrollment lets any device with a leaf cert signed by the family CA self-provision — the real fleet-scale ZTP path. Firmware options come from the <b>Device &amp; Firmware Version Catalog</b> for the selected product type — never free-typed.</p>
        </div>
        <div class="modal__foot">
          <button class="btn btn--ghost" data-action="close-overlay">Cancel</button>
          <button class="btn btn--primary" data-action="register-submit">Create intent records</button>
        </div>
      </div>`;
    $("#overlay-root").innerHTML = html;
    // FW-4: re-scope the firmware picker whenever the product type changes, so a
    // device can only ever be assigned a version catalogued for its own category.
    const catSel = $("#rf-cat");
    if (catSel) catSel.addEventListener("change", () => {
      const fwSel = $("#rf-fw");
      if (fwSel) fwSel.innerHTML = fwOptsMarkup(catSel.value);
    });
    const n = $("#rf-name"); if (n) n.focus();
  }

  function submitRegister() {
    const orgId = $("#rf-org").value;
    const name = ($("#rf-name").value || "New device").trim();
    const cat = $("#rf-cat").value;
    const qty = Math.max(1, Math.min(50, parseInt($("#rf-qty").value, 10) || 1));
    const fw = $("#rf-fw").value;
    const enroll = $("#rf-enroll").value;
    const t = tenantById(orgId); if (!t) return;

    // find or create the ZTP intake site
    let site = t.sites.find(s => s.name === "ZTP Intake");
    if (!site) { site = { name: "ZTP Intake", assets: [] }; t.sites.push(site); }
    const cfg = { interval: CAT_CONFIG[cat].interval, metrics: CAT_CONFIG[cat].metrics, thresholds: CAT_CONFIG[cat].thresholds, fw: fw };
    const asset = { name: name + (qty > 1 ? " (batch)" : ""), cat: cat, health: "good", devices: [] };
    for (let i = 0; i < qty; i++) {
      asset.devices.push({
        id: genId(cat), name: qty > 1 ? `${name} #${i + 1}` : name, state: "registered",
        metric: "awaiting first connection", spark: [0, 0, 0, 0, 0, 0, 0, 0], health: "good", cfg: cfg
      });
    }
    site.assets.push(asset);
    // No manual count to bump — tenantStats derives device counts live.
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.register",
      target: t.name, note: `${qty}× ${CAT_LABEL[cat]} · ${enroll === "group" ? "enrollment group" : "individual"} intent` });
    closeOverlay();
    setCounts();
    if (!S.actingAs) { S.view = "devices"; S.query = ""; }
    render();
    toast(`${qty} intent record${qty > 1 ? "s" : ""} created for ${t.name}`);
  }

  function openThresholds(orgId, assetKey) {
    const t = tenantById(orgId); if (!t) return;
    const [siteIdx, assetIdx] = assetKey.split(".").map(Number);
    const site = t.sites[siteIdx]; if (!site) return;
    const asset = site.assets[assetIdx]; if (!asset) return;
    const current = asset.thresholds || (CAT_CONFIG[asset.cat] || {}).thresholds || "";
    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="Configure thresholds">
        <div class="modal__head">
          <h2>Configure thresholds</h2>
          <p><b>${esc(asset.name)}</b> · ${esc(site.name)} · ${esc(t.name)} — the same alerting configuration this organization's own admin would set.</p>
        </div>
        <div class="modal__body">
          <div class="field"><label for="th-val">Alert thresholds</label><input id="th-val" type="text" value="${esc(current)}" placeholder="e.g. ph 7.2–7.8 · orp ≥ 650mV"></div>
          <p class="hint">Readings outside this range generate a threshold alert (AL-1.1) and, at critical severity, an automatic service ticket.</p>
        </div>
        <div class="modal__foot">
          <button class="btn btn--ghost" data-action="close-overlay">Cancel</button>
          <button class="btn btn--primary" data-action="thresholds-submit:${t.id}:${assetKey}">Save thresholds</button>
        </div>
      </div>`;
    $("#overlay-root").innerHTML = html;
    const n = $("#th-val"); if (n) n.focus();
  }
  function submitThresholds(orgId, assetKey) {
    const t = tenantById(orgId); if (!t) return;
    const [siteIdx, assetIdx] = assetKey.split(".").map(Number);
    const asset = t.sites[siteIdx] && t.sites[siteIdx].assets[assetIdx]; if (!asset) return;
    asset.thresholds = ($("#th-val").value || "").trim();
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "policy.update", target: t.name, note: `thresholds → ${asset.name}: ${asset.thresholds}` });
    closeOverlay();
    render();
    toast(`Thresholds updated for ${asset.name}`);
  }

  function nowStamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  function slugify(s) {
    let base = s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "org";
    let slug = base, n = 2;
    while (tenantById(slug) || partnerById(slug)) { slug = `${base}-${n++}`; }
    return slug;
  }

  // ---------- Account menu ----------
  function openUserMenu() {
    $("#overlay-root").innerHTML = `
      <div class="overlay overlay--clear" data-action="close-overlay"></div>
      <div class="usermenu" role="menu">
        <div class="usermenu__head">
          <div class="usermenu__av">ML</div>
          <div><div class="strong" style="font-size:13.5px">Marcus Lindqvist</div><div class="faint mono" style="font-size:11px">${ME.email}</div></div>
        </div>
        <button class="usermenu__item" data-action="user-goto:profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Your profile</button>
        <button class="usermenu__item" data-action="user-goto:preferences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Preferences</button>
        <button class="usermenu__item" data-action="toggle-theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>Toggle theme</button>
        <div class="usermenu__sep"></div>
        <button class="usermenu__item" data-action="toast:Signing out…"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
      </div>`;
  }

  // ---------- Create: tenant / partner / user ----------
  function fieldRow(inner) { return `<div class="field--row">${inner}</div>`; }

  function openCreateTenant() {
    const partnerOpts = ['<option value="">— Direct customer (no channel partner) —</option>']
      .concat(PARTNERS.map(p => `<option value="${p.id}">${esc(p.name)}</option>`)).join("");
    const mgrOpts = STAFF.filter(s => s.role !== "support_engineer").map(s => `<option>${esc(s.name)}</option>`).join("");
    $("#overlay-root").innerHTML = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="New tenant">
        <div class="modal__head"><h2>New customer tenant</h2><p>Create a customer organization. It gets its own isolated data space (RLS) in the <span class="mono">PeakLogicCustomers</span> directory.</p></div>
        <div class="modal__body">
          <div class="field"><label for="ct-name">Organization name</label><input id="ct-name" type="text" placeholder="e.g. Bayside Grille Group" value=""></div>
          ${fieldRow(`
            <div class="field"><label for="ct-industry">Industry</label><input id="ct-industry" type="text" placeholder="e.g. Restaurant group"></div>
            <div class="field"><label for="ct-partner">Channel partner</label><select id="ct-partner">${partnerOpts}</select></div>`)}
          ${fieldRow(`
            <div class="field"><label for="ct-mgr">Account manager</label><select id="ct-mgr">${mgrOpts}</select></div>
            <div class="field"><label for="ct-admin">Initial admin email</label><input id="ct-admin" type="email" placeholder="admin@customer.com"></div>`)}
          <p class="hint">The initial admin is invited into the customer directory (Microsoft Entra External ID). PeakLogic never stores their password.</p>
        </div>
        <div class="modal__foot"><button class="btn btn--ghost" data-action="close-overlay">Cancel</button><button class="btn btn--primary" data-action="submit-tenant">Create tenant</button></div>
      </div>`;
    const n = $("#ct-name"); if (n) n.focus();
  }
  function submitCreateTenant() {
    const name = ($("#ct-name").value || "").trim(); if (!name) { toast("Enter an organization name"); return; }
    const partnerId = $("#ct-partner").value || null;
    const t = { id: slugify(name), name, industry: ($("#ct-industry").value || "Customer").trim(), partnerId, mgr: $("#ct-mgr").value,
      online: 0, total: 0, crit: 0, warn: 0, tickets: 0, health: "good", sites: [] };
    TENANTS.push(t);
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "tenant.create", target: name, note: partnerId ? `via ${partnerById(partnerId).name}` : "direct customer" });
    closeOverlay(); setCounts(); S.view = "tenants"; S.query = ""; render();
    toast(`Tenant “${name}” created`);
  }

  function openCreatePartner() {
    $("#overlay-root").innerHTML = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="New channel partner">
        <div class="modal__head"><h2>New channel partner</h2><p>White-label partner org in the separate <span class="mono">PeakLogicPartners</span> directory. Upload their logo and set brand colors for the co-branded portal.</p></div>
        <div class="modal__body">
          <div class="field"><label for="cp-name">Partner name</label><input id="cp-name" type="text" placeholder="e.g. Gulf Coast Mechanical"></div>
          ${fieldRow(`
            <div class="field"><label for="cp-region">Region</label><input id="cp-region" type="text" placeholder="e.g. Sarasota, FL"></div>
            <div class="field"><label for="cp-subdomain">Portal domain</label><input id="cp-subdomain" type="text" placeholder="portal.partner.com"></div>`)}
          <div class="field"><label>Branding</label>
            <div class="logo-drop">
              <span class="logo-drop__mark" id="cp-mark" style="background:#0D9488">GC</span>
              <div style="flex:1">
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                  <label class="hint" style="font-weight:650">Logo mark <input id="cp-logo" type="text" maxlength="4" value="GC" style="width:64px;display:inline-block;margin-left:6px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface-2);color:var(--text)"></label>
                  <label class="hint" style="font-weight:650">Color <input id="cp-brand" type="color" value="#0D9488" style="width:40px;height:28px;padding:0;border:1px solid var(--border-strong);border-radius:6px;background:none;vertical-align:middle;margin-left:6px"></label>
                </div>
                <input type="file" accept=".svg,.png" class="hint" style="margin-top:8px">
                <div class="hint" style="margin-top:4px">Upload a vector <code>.svg</code> (preferred) or transparent <code>.png</code>, min 512×512. The mark + color above are the fallback until a file is uploaded.</div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal__foot"><button class="btn btn--ghost" data-action="close-overlay">Cancel</button><button class="btn btn--primary" data-action="submit-partner">Create partner</button></div>
      </div>`;
    const n = $("#cp-name"); if (n) n.focus();
  }
  function submitCreatePartner() {
    const name = ($("#cp-name").value || "").trim(); if (!name) { toast("Enter a partner name"); return; }
    const p = { id: slugify(name), name, region: ($("#cp-region").value || "—").trim(), accounts: 0, techs: 0, routes: 0, health: "good",
      brand: $("#cp-brand").value || "#0D9488", logo: ($("#cp-logo").value || name[0]).toUpperCase(),
      funnel: { dispatched: 0, accepted: 0, onsite: 0, completed: 0 }, subdomain: ($("#cp-subdomain").value || "").trim(),
      accountList: [], territories: [], technicians: [], routes: [] };
    PARTNERS.push(p);
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "partner.create", target: name, note: "channel partner onboarded" });
    closeOverlay(); setCounts(); S.view = "partners"; render();
    toast(`Channel partner “${name}” created`);
  }

  const ROLE_INFO = {
    superadmin: "Full platform access + all organizations. Just-in-time via PIM.",
    account_manager: "Manage only the tenants/partners in their book of business.",
    support_engineer: "Read-only troubleshooting across orgs; act-as is read-only.",
  };
  function openCreateUser() {
    const roleOpts = Object.keys(ROLE_INFO).map(r => `<option value="${r}">${r.replace("_", " ")}</option>`).join("");
    $("#overlay-root").innerHTML = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="New staff user">
        <div class="modal__head"><h2>New PeakLogic user</h2><p>Staff sign in through the corporate Entra ID workforce tenant. Set their access level and book of business.</p></div>
        <div class="modal__body">
          ${fieldRow(`
            <div class="field"><label for="cu-name">Full name</label><input id="cu-name" type="text" placeholder="e.g. Jordan Ellis"></div>
            <div class="field"><label for="cu-email">Work email</label><input id="cu-email" type="email" placeholder="jordan.ellis@peaklogic.com"></div>`)}
          <div class="field"><label for="cu-role">Access level</label><select id="cu-role" data-action="role-change">${roleOpts}</select>
            <p class="hint" id="cu-role-desc">${ROLE_INFO.superadmin}</p></div>
          <div class="field"><label for="cu-book">Book of business</label><select id="cu-book"><option value="all">All organizations</option><option value="assigned">Assigned orgs only</option></select>
            <p class="hint">Account managers see only assigned orgs; a superadmin sees all. Assignments are managed on the Staff &amp; Access page.</p></div>
        </div>
        <div class="modal__foot"><button class="btn btn--ghost" data-action="close-overlay">Cancel</button><button class="btn btn--primary" data-action="submit-user">Send invite</button></div>
      </div>`;
    const n = $("#cu-name"); if (n) n.focus();
  }
  function submitCreateUser() {
    const name = ($("#cu-name").value || "").trim(); if (!name) { toast("Enter a name"); return; }
    const role = $("#cu-role").value;
    const email = ($("#cu-email").value || `${name.toLowerCase().replace(/\s+/g, ".")}@peaklogic.com`).trim();
    const book = role === "superadmin" ? "All organizations" : ($("#cu-book").value === "all" ? "All organizations" : []);
    STAFF.push({ name, email, role, oid: genOid(), book, elevated: role === "superadmin" });
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "staff.invite", target: name, note: `role: ${role.replace("_", " ")}` });
    closeOverlay(); S.view = "staff"; render();
    toast(`Invite sent to ${email}`);
  }
  function genOid() {
    const h = () => Math.floor(Math.random() * 65536).toString(16).padStart(4, "0");
    return `${h()}-${h()}-${h()}`;
  }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const parts = el.getAttribute("data-action").split(":");
    const action = parts[0], arg = parts[1], arg2 = parts[2];
    if (action === "nav") { closeOverlay(); S.view = arg; S.query = ""; S.actingAs = null; S.partner = null; render(); }
    else if (action === "user-menu") openUserMenu();
    else if (action === "user-goto") { closeOverlay(); S.view = "settings"; S.setTab = arg; render(); }
    else if (action === "set-tab") { S.setTab = arg; render(); }
    else if (action === "toggle-pref") { PREFS[arg] = !PREFS[arg]; render(); }
    else if (action === "new-tenant") openCreateTenant();
    else if (action === "new-partner") openCreatePartner();
    else if (action === "new-user") openCreateUser();
    else if (action === "submit-tenant") submitCreateTenant();
    else if (action === "submit-partner") submitCreatePartner();
    else if (action === "submit-user") submitCreateUser();
    else if (action === "toast") toast(parts.slice(1).join(":"));
    else if (action === "manage-tenant") enterActAs(arg);
    else if (action === "manage-partner") enterActAsPartner(arg);
    else if (action === "exit-actas") exitActAs();
    else if (action === "tenant-tab") { S.tab = arg; render(); }
    else if (action === "partner-tab") { S.ptab = arg; render(); }
    else if (action === "device") openDeviceDrawer(arg);
    else if (action === "register-open") openRegister(arg);
    else if (action === "register-submit") submitRegister();
    else if (action === "site-open") openNewSite(arg);
    else if (action === "site-submit") submitNewSite(arg);
    else if (action === "thresholds-open") openThresholds(arg, arg2);
    else if (action === "thresholds-submit") submitThresholds(arg, arg2);
    else if (action === "method") runMethod(arg, arg2);
    else if (action === "run-report") {
      const r = STANDARD_REPORTS.find(x => x.id === arg);
      toast(`Generating "${r ? r.name : arg}" — export ready`);
    }
    else if (action === "build-report") toast("Custom report queued — you'll be notified when it's ready");
    else if (action === "close-overlay") closeOverlay();
    else if (action === "toggle-theme") toggleTheme();
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "q") { S.query = e.target.value; render(); }
    else if (e.target.id === "cu-role") { const d = $("#cu-role-desc"); if (d) d.textContent = ROLE_INFO[e.target.value] || ""; }
    else if (e.target.id === "cp-logo" || e.target.id === "cp-brand") {
      const mark = $("#cp-mark"); if (mark) { mark.textContent = ($("#cp-logo").value || "?").toUpperCase(); mark.style.background = $("#cp-brand").value; }
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeOverlay();
  });

  // Metric-explainer tooltip triggers
  document.addEventListener("mouseover", (e) => { const el = e.target.closest(".mx-i"); if (el) showMxTip(el); });
  document.addEventListener("mouseout", (e) => { if (e.target.closest(".mx-i")) hideMxTip(); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest(".mx-i"); if (el) showMxTip(el); });
  document.addEventListener("focusout", (e) => { if (e.target.closest(".mx-i")) hideMxTip(); });

  // Map pin hover tooltip
  document.addEventListener("mousemove", (e) => {
    const tip = document.getElementById("map-tip");
    if (!tip) return;
    const pin = e.target.closest(".map__pin");
    if (!pin) { tip.classList.remove("show"); return; }
    const d = JSON.parse(pin.getAttribute("data-pin"));
    const rect = pin.closest(".map").getBoundingClientRect();
    tip.innerHTML = `<div class="t-site">${esc(d.site)}</div>
      <div class="t-row"><span>Customer</span><span>${esc(d.tenant)}</span></div>
      <div class="t-row"><span>Channel partner</span><span>${esc(d.partner)}</span></div>
      <div class="t-row"><span>Devices</span><span>${d.devices}</span></div>
      <div class="t-row"><span>Status</span><span style="text-transform:capitalize;font-weight:700">${esc(d.status)}</span></div>`;
    let x = e.clientX - rect.left + 16, y = e.clientY - rect.top + 16;
    if (x > rect.width - 210) x -= 226;
    tip.style.left = x + "px"; tip.style.top = y + "px";
    tip.classList.add("show");
  });

  // ---------- Theme ----------
  function currentTheme() {
    const attr = document.documentElement.getAttribute("data-theme");
    if (attr) return attr;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function setThemeIcon(theme) {
    const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    const moon = '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>';
    $("#theme-icon").innerHTML = theme === "dark" ? sun : moon;
  }
  function toggleTheme() {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    setThemeIcon(next);
  }

  // ---------- Init ----------
  setCounts();
  setThemeIcon(currentTheme());
  render();
})();
</script>
