<title>PeakLogic Super-Console</title>
<style>
  :root {
    --rail-bg: #0a0f1d;
    --rail-surface: #121b30;
    --rail-border: #1e2a44;
    --rail-text: #e8ecf5;
    --rail-muted: #7f8db0;
    --rail-active-bg: rgba(139, 92, 246, .16);
    --rail-active-bar: #8b5cf6;

    --bg: #f5f5fb;
    --surface: #ffffff;
    --surface-2: #fbfaff;
    --surface-3: #f2f1fa;
    --border: #e7e5f1;
    --border-strong: #d7d4e8;
    --text: #10152a;
    --text-muted: #5c6480;
    --text-faint: #939ab5;
    --accent: #7c3aed;
    --accent-ink: #6d28d9;
    --accent-soft: #ede9fe;

    --good: #16a34a;
    --good-soft: #dcfce7;
    --good-ink: #15803d;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --warn-ink: #b45309;
    --crit: #dc2626;
    --crit-soft: #fee2e2;
    --crit-ink: #b91c1c;
    --info: #2563eb;
    --info-soft: #dbeafe;
    --info-ink: #1d4ed8;

    --shadow: 0 1px 2px rgba(16, 21, 42, .04), 0 4px 16px rgba(16, 21, 42, .05);
    --shadow-lg: 0 12px 40px rgba(16, 21, 42, .16);
    --radius: 12px;
    --radius-sm: 8px;

    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080c17;
      --surface: #10192b;
      --surface-2: #0d1524;
      --surface-3: #16223a;
      --border: #223049;
      --border-strong: #2c3c58;
      --text: #eef2fb;
      --text-muted: #93a0bd;
      --text-faint: #66728f;
      --accent: #8b5cf6;
      --accent-ink: #a78bfa;
      --accent-soft: #241d45;

      --good: #34d399; --good-soft: #0c2a20; --good-ink: #6ee7b7;
      --warn: #fbbf24; --warn-soft: #2e2408; --warn-ink: #fcd34d;
      --crit: #f87171; --crit-soft: #2e1416; --crit-ink: #fca5a5;
      --info: #60a5fa; --info-soft: #12203c; --info-ink: #93c5fd;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
    }
  }

  :root[data-theme="light"] {
    --bg: #f5f5fb; --surface: #ffffff; --surface-2: #fbfaff; --surface-3: #f2f1fa;
    --border: #e7e5f1; --border-strong: #d7d4e8; --text: #10152a; --text-muted: #5c6480;
    --text-faint: #939ab5; --accent: #7c3aed; --accent-ink: #6d28d9; --accent-soft: #ede9fe;
    --good: #16a34a; --good-soft: #dcfce7; --good-ink: #15803d;
    --warn: #d97706; --warn-soft: #fef3c7; --warn-ink: #b45309;
    --crit: #dc2626; --crit-soft: #fee2e2; --crit-ink: #b91c1c;
    --info: #2563eb; --info-soft: #dbeafe; --info-ink: #1d4ed8;
    --shadow: 0 1px 2px rgba(16,21,42,.04), 0 4px 16px rgba(16,21,42,.05);
    --shadow-lg: 0 12px 40px rgba(16,21,42,.16);
  }
  :root[data-theme="dark"] {
    --bg: #080c17; --surface: #10192b; --surface-2: #0d1524; --surface-3: #16223a;
    --border: #223049; --border-strong: #2c3c58; --text: #eef2fb; --text-muted: #93a0bd;
    --text-faint: #66728f; --accent: #8b5cf6; --accent-ink: #a78bfa; --accent-soft: #241d45;
    --good: #34d399; --good-soft: #0c2a20; --good-ink: #6ee7b7;
    --warn: #fbbf24; --warn-soft: #2e2408; --warn-ink: #fcd34d;
    --crit: #f87171; --crit-soft: #2e1416; --crit-ink: #fca5a5;
    --info: #60a5fa; --info-soft: #12203c; --info-ink: #93c5fd;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .app {
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 248px 1fr;
    -webkit-font-smoothing: antialiased;
  }
  @media (max-width: 760px) { .app { grid-template-columns: 68px 1fr; } }

  /* ---------- Command rail (pinned dark, both themes) ---------- */
  .rail {
    background: var(--rail-bg);
    border-right: 1px solid var(--rail-border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    padding: 18px 12px;
  }
  .brand { display: flex; align-items: flex-end; gap: 9px; padding: 6px 8px 20px; }
  .brand svg { width: 30px; height: 22px; display: block; }
  .brand__word { font-size: 19px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .brand__word .peak { color: #ffffff; }
  .brand__word .logic { color: #8b5cf6; }
  @media (max-width: 760px) { .brand__word { display: none; } .brand { justify-content: center; padding: 6px 0 20px; } }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav__label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--rail-muted); font-weight: 700; padding: 16px 10px 6px;
  }
  @media (max-width: 760px) { .nav__label { text-align: center; font-size: 8px; padding: 12px 0 4px; } }
  .nav__item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    color: var(--rail-text); font-size: 13.5px; font-weight: 500;
    cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    position: relative; font-family: inherit; transition: background .12s ease;
  }
  .nav__item:hover { background: rgba(255,255,255,.05); }
  .nav__item svg { width: 17px; height: 17px; flex: none; opacity: .82; }
  .nav__item--active { background: var(--rail-active-bg); color: #fff; font-weight: 600; }
  .nav__item--active::before {
    content: ""; position: absolute; left: -12px; top: 7px; bottom: 7px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--rail-active-bar);
  }
  .nav__item--active svg { opacity: 1; color: #a78bfa; }
  .nav__item--sub { padding-left: 38px; font-size: 13px; }
  @media (max-width: 760px) {
    .nav__item { justify-content: center; padding: 11px 0; gap: 0; }
    .nav__item span, .nav__item--sub { display: none; }
    .nav__item--sub { display: none !important; }
  }
  .nav__count {
    margin-left: auto; font-size: 11px; font-family: var(--mono);
    color: var(--rail-muted); background: rgba(255,255,255,.06);
    padding: 1px 7px; border-radius: 20px; font-variant-numeric: tabular-nums;
  }
  @media (max-width: 760px) { .nav__count { display: none; } }

  .rail__foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--rail-border); }
  .who { display: flex; align-items: center; gap: 10px; }
  .who__avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #8b5cf6, #22c55e);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
  }
  .who__name { font-size: 12.5px; font-weight: 600; color: var(--rail-text); line-height: 1.3; }
  .who__role { font-size: 10.5px; color: var(--rail-muted); display: flex; align-items: center; gap: 4px; }
  .who__role .dot { width: 5px; height: 5px; border-radius: 50%; background: #34d399; }
  @media (max-width: 760px) { .who__name, .who__role { display: none; } .who { justify-content: center; } }

  /* ---------- Main ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20;
  }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); min-width: 0; }
  .crumb b { color: var(--text); font-weight: 650; }
  .crumb .sep { color: var(--text-faint); }
  .topbar__spacer { flex: 1; }
  .iconbtn {
    display: grid; place-items: center; width: 34px; height: 34px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); cursor: pointer;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--border-strong); }
  .iconbtn svg { width: 17px; height: 17px; }

  /* Act-as banner */
  .banner {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 28px; background: var(--accent-soft);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    font-size: 13px; color: var(--text);
  }
  .banner__pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70% { box-shadow: 0 0 0 9px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .banner__pulse { animation: none; } }
  .banner b { font-weight: 700; }
  .banner__meta { color: var(--accent-ink); font-family: var(--mono); font-size: 11.5px; }
  .banner__exit {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 13px; border-radius: 20px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
    background: var(--surface); color: var(--accent-ink); font-weight: 650; font-size: 12.5px;
    cursor: pointer; font-family: inherit;
  }
  .banner__exit:hover { background: var(--surface-2); }

  .view { padding: 26px 28px 60px; max-width: 1240px; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view, .banner__pulse { animation: none; } }

  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; font-weight: 750; letter-spacing: -.02em; margin: 0 0 4px; text-wrap: balance; }
  .page-head p { margin: 0; color: var(--text-muted); font-size: 13.5px; max-width: 68ch; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat__label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 650; }
  .stat__value { font-size: 30px; font-weight: 760; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat__sub { font-size: 12px; color: var(--text-faint); margin-top: 7px; font-variant-numeric: tabular-nums; }
  .stat__accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

  /* Panels */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 940px) { .grid2 { grid-template-columns: 1fr; } }
  .panel__head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
  .panel__title { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .panel__note {
    margin-left: auto; font-size: 11px; color: var(--text-faint);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .panel__note code { font-family: var(--mono); color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; }

  /* Tables */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-faint); font-weight: 700; padding: 10px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface);
  }
  .tbl td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tbody tr { transition: background .1s ease; }
  .tbl tbody tr.clickable { cursor: pointer; }
  .tbl tbody tr.clickable:hover { background: var(--surface-3); }
  .tbl .num { font-variant-numeric: tabular-nums; text-align: right; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }
  .sev-cell { width: 4px; padding: 0 !important; }
  .sev-stripe { display: block; width: 4px; align-self: stretch; min-height: 44px; }
  .strong { font-weight: 650; }
  .row-main { display: flex; flex-direction: column; gap: 2px; }
  .row-sub { font-size: 11.5px; color: var(--text-faint); }

  /* Pills */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border-radius: 20px; font-size: 11.5px; font-weight: 650; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .pill--good { background: var(--good-soft); color: var(--good-ink); } .pill--good .dot { background: var(--good); }
  .pill--warn { background: var(--warn-soft); color: var(--warn-ink); } .pill--warn .dot { background: var(--warn); }
  .pill--crit { background: var(--crit-soft); color: var(--crit-ink); } .pill--crit .dot { background: var(--crit); }
  .pill--info { background: var(--info-soft); color: var(--info-ink); } .pill--info .dot { background: var(--info); }
  .pill--neutral { background: var(--surface-3); color: var(--text-muted); } .pill--neutral .dot { background: var(--text-faint); }
  .pill--accent { background: var(--accent-soft); color: var(--accent-ink); } .pill--accent .dot { background: var(--accent); }

  /* Rollup bar */
  .rollup { display: flex; align-items: center; gap: 10px; }
  .rollup__track { flex: 1; height: 7px; border-radius: 20px; background: var(--surface-3); overflow: hidden; display: flex; }
  .rollup__fill { height: 100%; background: var(--good); }
  .rollup__fill.warn { background: var(--warn); }
  .rollup__fill.crit { background: var(--crit); }
  .rollup__val { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 650; cursor: pointer; font-family: inherit; border: 1px solid transparent;
    transition: transform .06s ease, background .12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--primary:hover { background: var(--accent-ink); }
  .btn--ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .btn--ghost:hover { background: var(--surface-2); }
  .btn svg { width: 14px; height: 14px; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .search {
    display: flex; align-items: center; gap: 8px; padding: 8px 13px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); flex: 1; min-width: 200px; max-width: 340px;
  }
  .search svg { width: 15px; height: 15px; color: var(--text-faint); flex: none; }
  .search input { border: none; background: none; outline: none; font-family: inherit; font-size: 13px; color: var(--text); width: 100%; }
  .search input::placeholder { color: var(--text-faint); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
  .tab {
    padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border: none; background: none; font-family: inherit; white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab--active { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .tab__count { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 5px; }

  .spark { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 11.5px; color: var(--text-muted); margin-top: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  .callout {
    display: flex; gap: 12px; padding: 13px 16px; border-radius: var(--radius);
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    font-size: 12.5px; color: var(--text); margin-bottom: 20px; line-height: 1.5;
  }
  .callout svg { width: 18px; height: 18px; color: var(--accent); flex: none; margin-top: 1px; }
  .callout b { font-weight: 700; }
  .callout code { font-family: var(--mono); font-size: 11.5px; background: var(--surface); padding: 1px 5px; border-radius: 4px; color: var(--accent-ink); }

  .empty { padding: 40px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 12.5px; }
  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; font-weight: 600; }

  .grow { animation: fade .2s ease; }

  /* ---------- Conversion funnel ---------- */
  .kpi-hero { display: flex; flex-wrap: wrap; gap: 28px; padding: 20px; align-items: center; }
  .kpi-hero__num { font-size: 46px; font-weight: 780; letter-spacing: -.03em; color: var(--good-ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .kpi-hero__side { min-width: 210px; }
  .kpi-hero__funnel { flex: 1; min-width: 300px; }
  .funnel { display: flex; flex-direction: column; gap: 3px; }
  .funnel__row { display: flex; align-items: center; gap: 12px; }
  .funnel__label { width: 178px; flex: none; font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .funnel__track { flex: 1; height: 22px; min-width: 70px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
  .funnel__fill { height: 100%; border-radius: 6px; transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .funnel__count { width: 48px; text-align: right; font-family: var(--mono); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .funnel__rate { margin-left: 190px; font-size: 11px; color: var(--text-faint); padding: 1px 0; }
  @media (max-width: 640px) { .funnel__label { width: 104px; } .funnel__rate { margin-left: 116px; } }

  /* ---------- Report catalog ---------- */
  .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 820px) { .report-grid { grid-template-columns: 1fr; } }
  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .12s ease, transform .06s ease; }
  .report-card:hover { border-color: var(--border-strong); }
  .report-card:active { transform: translateY(1px); }
  .report-card__title { font-weight: 700; font-size: 14px; letter-spacing: -.01em; text-wrap: balance; }
  .report-card__desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; flex: 1; }
  .report-card__foot { display: flex; align-items: center; gap: 8px; margin-top: 2px; }

  /* ---------- Overlay / drawer / modal / toast ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(8,12,23,.55); backdrop-filter: blur(2px); z-index: 40; opacity: 0; animation: ovfade .16s ease forwards; }
  @keyframes ovfade { to { opacity: 1; } }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(468px, 96vw); background: var(--surface);
    border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 50;
    display: flex; flex-direction: column; animation: slidein .22s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes slidein { from { transform: translateX(100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .overlay, .drawer, .modal, .toast { animation: none; } }
  .drawer__head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
  .drawer__title { font-size: 16px; font-weight: 720; letter-spacing: -.01em; }
  .drawer__id { font-family: var(--mono); font-size: 12px; color: var(--text-faint); margin-top: 3px; }
  .drawer__body { padding: 18px 20px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
  .dsec__label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted);

  const CAT_LABEL = { pool_system: "Pool system", hvac: "HVAC", refrigeration: "Refrigeration", energy_meter: "Energy meter", leak_sensor: "Leak sensor", pump: "Pump" };

  // Standard report catalog (reporting-and-kpi-design.md §4.1)
  const STANDARD_REPORTS = [
    { id: "conversion", name: "Automated Dispatch → Service Call Conversion", vertical: "Value story",
      desc: "The full CMMS funnel (dispatched → accepted → on-site → completed) with each stage-to-stage rate, by partner and period. Headline: dispatched → on-site." },
    { id: "cmms-log", name: "CMMS Dispatch Log", vertical: "Channel",
      desc: "Every automated work order pushed to a partner's CMMS, its work-order ref, and current status." },
    { id: "scorecard", name: "Partner Scorecard", vertical: "Channel",
      desc: "Work orders received, response time, conversion, and outcomes — per channel partner." },
    { id: "alert-response", name: "Alert & Response Summary", vertical: "All",
      desc: "Alerts by severity, category, and site; mean time to acknowledge and resolve." },
    { id: "fleet-health", name: "Fleet Health & Uptime", vertical: "All",
      desc: "Device online/offline, silent devices, and reporting compliance across the estate." },
    { id: "energy", name: "Energy Performance", vertical: "Energy",
      desc: "Consumption and demand trends, peak demand, and estimated cost savings." },
    { id: "refrigeration", name: "Refrigeration Compliance", vertical: "Refrigeration",
      desc: "Product-temperature excursions vs. FDA cold-holding limits; food-safety log." },
    { id: "pool-chem", name: "Pool Chemistry Compliance", vertical: "Pool",
      desc: "pH, free chlorine, and TDS vs. CDC MAHC ranges; time out of range." },
  ];

  // ---------- App state ----------
  const S = { view: "fleet", actingAs: null, partner: null, tab: "sites", ptab: "accounts", query: "" };

  // ---------- Helpers ----------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tenantById = (id) => TENANTS.find(t => t.id === id);
  const partnerById = (id) => PARTNERS.find(p => p.id === id);

  function healthPill(h, label) {
    const map = { good: ["good", label || "Healthy"], warn: ["warn", label || "Degraded"], crit: ["crit", label || "Critical"] };
    const [cls, txt] = map[h] || map.good;
    return `<span class="pill pill--${cls}"><span class="dot"></span>${txt}</span>`;
  }
  function statePill(state) {
    const m = STATE_META[state] || STATE_META.registered;
    return `<span class="pill pill--${m.pill}"><span class="dot"></span>${m.label}</span>`;
  }
  function rollup(online, total) {
    const pct = total ? Math.round((online / total) * 100) : 0;
    const off = total - online;
    const cls = off === 0 ? "" : (online / total < .9 ? "crit" : "warn");
    return `<div class="rollup"><div class="rollup__track"><div class="rollup__fill ${cls}" style="width:${pct}%"></div></div>
      <span class="rollup__val">${online}/${total}</span></div>`;
  }
  function sparkline(data, health) {
    const w = 76, h = 22, pad = 2;
    const min = Math.min(...data), max = Math.max(...data), rng = (max - min) || 1;
    const pts = data.map((v, i) => {
      const x = pad + (i / (data.length - 1)) * (w - pad * 2);
      const y = pad + (1 - (v - min) / rng) * (h - pad * 2);
      return [x, y];
    });
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`;
    const color = health === "crit" ? "var(--crit)" : health === "warn" ? "var(--warn)" : "var(--good)";
    const last = pts[pts.length - 1];
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <path d="${area}" fill="${color}" opacity="0.12"></path>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2" fill="${color}"></circle>
    </svg>`;
  }

  // Headline conversion = dispatched → on-site (reporting-and-kpi-design.md §3)
  function conversionPct(f) { return f.dispatched ? Math.round((f.onsite / f.dispatched) * 100) : 0; }
  // Fan-out: the fleet funnel is the sum of each partner's own funnel, merged here.
  function fleetFunnel() {
    return PARTNERS.reduce((a, p) => {
      a.dispatched += p.funnel.dispatched; a.accepted += p.funnel.accepted;
      a.onsite += p.funnel.onsite; a.completed += p.funnel.completed; return a;
    }, { dispatched: 0, accepted: 0, onsite: 0, completed: 0 });
  }
  function renderFunnel(f) {
    const stages = [
      { key: "dispatched", label: "Dispatched to CMMS", color: "var(--accent)" },
      { key: "accepted", label: "Accepted in CMMS", color: "var(--info)" },
      { key: "onsite", label: "On-site service call", color: "var(--good)", headline: true },
      { key: "completed", label: "Completed / resolved", color: "var(--good)", faded: true },
    ];
    const max = f.dispatched || 1;
    const rate = (n, d) => (d ? Math.round((n / d) * 100) : 0);
    const rateFor = { accepted: rate(f.accepted, f.dispatched), onsite: rate(f.onsite, f.accepted), completed: rate(f.completed, f.onsite) };
    const rateLabel = { accepted: "accepted", onsite: "conversion", completed: "resolved" };
    let html = '<div class="funnel">';
    stages.forEach((s, i) => {
      const w = Math.round((f[s.key] / max) * 100);
      html += `<div class="funnel__row">
        <div class="funnel__label">${s.label}${s.headline ? ' <span class="pill pill--good" style="padding:0 7px"><span class="dot"></span>headline</span>' : ''}</div>
        <div class="funnel__track"><div class="funnel__fill" style="width:${w}%;background:${s.color}${s.faded ? ';opacity:.5' : ''}"></div></div>
        <div class="funnel__count">${f[s.key].toLocaleString()}</div></div>`;
      if (i < stages.length - 1) {
        const nk = stages[i + 1].key;
        html += `<div class="funnel__rate">↓ ${rateFor[nk]}% ${rateLabel[nk]}</div>`;
      }
    });
    return html + "</div>";
  }

  // ---------- Derived aggregates (fan-out, computed per-org then merged) ----------
  function fleetTotals() {
    return TENANTS.reduce((a, t) => {
      a.online += t.online; a.total += t.total; a.crit += t.crit; a.warn += t.warn; a.tickets += t.tickets; return a;
    }, { online: 0, total: 0, crit: 0, warn: 0, tickets: 0 });
  }
  function needsAttention() {
    const rows = [];
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      if (d.health === "crit" || d.health === "warn") {
        rows.push({ health: d.health, org: t.name, orgId: t.id, site: s.name, asset: a.name, cat: a.cat, device: d.name, id: d.id, metric: d.metric, state: d.state });
      }
    }))));
    return rows.sort((x, y) => (x.health === "crit" ? 0 : 1) - (y.health === "crit" ? 0 : 1));
  }
  function allDevices() {
    const rows = [];
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      rows.push({ ...d, org: t.name, orgId: t.id, site: s.name, cat: a.cat });
    }))));
    return rows;
  }
  function deviceIndex() {
    const idx = {};
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      idx[d.id] = { d: d, org: t.name, orgId: t.id, site: s.name, asset: a.name, cat: a.cat };
    }))));
    return idx;
  }

  // Device twin: desired (cloud→device) vs reported (device→cloud), keyed off lifecycle state
  function twinFor(d, cat) {
    const base = d.cfg || CAT_CONFIG[cat] || CAT_CONFIG.hvac;
    const desired = {
      "Reporting interval": base.interval + "s",
      "Metrics": base.metrics.join(", "),
      "Thresholds": base.thresholds,
      "Firmware channel": base.fw,
      "Command channel": "direct-methods"
    };
    let reported = null, sync;
    if (d.state === "reporting") {
      reported = { "Config version": "v7", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "MQTT/TLS :443", "Last twin sync": "2m ago" };
      sync = { cls: "good", label: "In sync" };
    } else if (d.state === "configured") {
      reported = { "Config version": "v7", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "MQTT/TLS :443", "Last twin sync": "just now" };
      sync = { cls: "good", label: "In sync" };
    } else if (d.state === "provisioning") {
      reported = { "Config version": "— applying", "Firmware installed": base.fw, "Reporting interval": "— pending", "Connectivity": "MQTT/TLS :443", "Last twin sync": "pushing…" };
      sync = { cls: "warn", label: "Config push pending" };
    } else if (d.state === "silent") {
      reported = { "Config version": "v6", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "last seen 46m ago", "Last twin sync": "stale" };
      sync = { cls: "crit", label: "Device silent" };
    } else if (d.state === "registered") {
      sync = { cls: "neutral", label: "Awaiting first connection" };
    } else {
      sync = { cls: "neutral", label: "Decommissioned" };
    }
    return { desired: desired, reported: reported, sync: sync };
  }

  const ID_PREFIX = { pool_system: "pl", hvac: "hv", refrigeration: "rf", energy_meter: "em", leak_sensor: "lk", pump: "pm" };
  function genId(cat) {
    const p = ID_PREFIX[cat] || "dev";
    const n = Math.floor(1000 + Math.random() * 8999);
    const a = "abcdefgh"[Math.floor(Math.random() * 8)];
    return `${p}-${n}-${a}`;
  }
  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg><span>${esc(msg)}</span>`;
    $("#toasts").appendChild(t);
    setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 2600);
  }

  // ---------- Views ----------
  function viewFleet() {
    const T = fleetTotals();
    const na = needsAttention();
    const orgCount = TENANTS.length + PARTNERS.length;
    const offline = T.total - T.online;
    const ff = fleetFunnel();
    const ff_conv = conversionPct(ff);

    const stats = [
      { label: "Organizations", value: orgCount, sub: `${TENANTS.length} tenants · ${PARTNERS.length} partners`, accent: "var(--accent)" },
      { label: "Devices online", value: T.online.toLocaleString(), sub: `${offline} offline of ${T.total.toLocaleString()}`, accent: offline > 8 ? "var(--warn)" : "var(--good)" },
      { label: "Open critical alerts", value: T.crit, sub: `${T.warn} warnings active`, accent: T.crit ? "var(--crit)" : "var(--good)" },
      { label: "Open tickets", value: T.tickets, sub: "across all accounts", accent: "var(--info)" }
    ].map(s => `<div class="stat"><div class="stat__accent" style="background:${s.accent}"></div>
      <div class="stat__label">${s.label}</div><div class="stat__value">${s.value}</div><div class="stat__sub">${s.sub}</div></div>`).join("");

    const attnRows = na.map(r => `
      <tr class="clickable" data-action="manage-tenant:${r.orgId}">
        <td class="sev-cell"><span class="sev-stripe" style="background:var(--${r.health})"></span></td>
        <td><div class="row-main"><span class="strong">${esc(r.device)}</span><span class="row-sub">${esc(r.org)} · ${esc(r.site)}</span></div></td>
        <td><span class="pill pill--neutral"><span class="dot"></span>${CAT_LABEL[r.cat]}</span></td>
        <td class="mono muted">${esc(r.metric)}</td>
        <td>${statePill(r.state)}</td>
      </tr>`).join("");

    const orgHealth = TENANTS.slice().sort((a,b)=>({crit:0,warn:1,good:2}[a.health]-{crit:0,warn:1,good:2}[b.health])).map(t => `
      <tr class="clickable" data-action="manage-tenant:${t.id}">
        <td><div class="row-main"><span class="strong">${esc(t.name)}</span><span class="row-sub">${esc(t.industry)}</span></div></td>
        <td style="width:170px">${rollup(t.online, t.total)}</td>
        <td style="text-align:right">${healthPill(t.health)}</td>
      </tr>`).join("");

    return `
      <div class="page-head"><h1>Fleet Overview</h1>
        <p>Global health across every account you manage. Superadmin — all organizations in view.</p></div>
      <div class="stats">${stats}</div>
      <div class="panel" style="margin-bottom:22px">
        <div class="panel__head"><span class="panel__title">Automated dispatch → service calls</span>
          <span class="panel__note">CMMS conversion · this month</span></div>
        <div class="kpi-hero">
          <div class="kpi-hero__side">
            <div class="readout__l">Conversion · dispatched → on-site</div>
            <div class="kpi-hero__num">${ff_conv}%</div>
            <div class="faint" style="font-size:12px;margin-top:6px">${ff.onsite.toLocaleString()} on-site service calls generated from ${ff.dispatched.toLocaleString()} auto-dispatched work orders</div>
            <button class="btn btn--ghost" data-action="nav:reports" style="margin-top:14px">Open full report
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </div>
          <div class="kpi-hero__funnel">${renderFunnel(ff)}</div>
        </div>
      </div>
      <div class="callout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <div>Every number here — health rollups and the CMMS conversion funnel alike — is assembled by <b>fanning out per-organization scoped reads</b> and merging them here, never a single cross-tenant query. Each org opens through <code>withStaffActingOnTenant()</code>, so the isolation boundary holds even for a "global" view.</div>
      </div>
      <div class="grid2">
        <div class="panel">
          <div class="panel__head"><span class="panel__title">Needs attention</span>
            <span class="panel__note">${na.length} items · sorted by severity</span></div>
          <table class="tbl"><thead><tr><th class="sev-cell"></th><th>Device</th><th>System</th><th>Reading</th><th>State</th></tr></thead>
            <tbody>${attnRows}</tbody></table>
        </div>
        <div class="panel">
          <div class="panel__head"><span class="panel__title">Tenant health</span>
            <span class="panel__note">online / total</span></div>
          <table class="tbl"><tbody>${orgHealth}</tbody></table>
        </div>
      </div>`;
  }

  function viewTenants() {
    const q = S.query.toLowerCase();
    const rows = TENANTS.filter(t => !q || t.name.toLowerCase().includes(q) || t.industry.toLowerCase().includes(q)).map(t => `
      <tr>
        <td><div class="row-main"><span class="strong">${esc(t.name)}</span><span class="row-sub mono">${t.id}</span></div></td>
        <td class="muted">${esc(t.industry)}</td>
        <td class="muted">${esc(t.mgr)}</td>
        <td style="width:150px">${rollup(t.online, t.total)}</td>
        <td>${t.crit ? `<span class="pill pill--crit"><span class="dot"></span>${t.crit} critical</span>` : t.warn ? `<span class="pill pill--warn"><span class="dot"></span>${t.warn} warning</span>` : healthPill("good")}</td>

      </div>
      <div class="panel"><table class="tbl">

  function viewPartners() {
    const rows = PARTNERS.map(p => `
      <tr>
        <td><div style="display:flex;align-items:center;gap:11px">

    return `

      <div class="panel"><table class="tbl">

    if (!p) { S.view = "partners"; return viewPartners(); }

      { id: "accounts", label: "Accounts", count: p.accountList.length },
      { id: "territories", label: "Territories", count: p.territories.length },
      { id: "technicians", label: "Technicians", count: p.technicians.length },
      { id: "routes", label: "Routes", count: p.routes.length },

    ].map(x => `<button class="tab ${S.ptab===x.id?'tab--active':''}" data-action="partner-tab:${x.id}">${x.label}${x.count!==null?`<span class="tab__count">${x.count}</span>`:''}</button>`).join("");
    return `

  function partnerTab(p) {
    if (S.ptab === "accounts") {
      const rows = p.accountList.map(name => {
        const t = TENANTS.find(x => x.name === name);
        return `<tr class="${t?'clickable':''}" ${t?`data-action="manage-tenant:${t.id}"`:''}>
          <td class="strong">${esc(name)}</td>

          <td style="text-align:right" class="faint">${t ? "Open tenant →" : ""}</td></tr>`;
      }).join("");
      return `<div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6z"/></svg>
        <div>This partner sees <b>only these attributed accounts</b> — enforced by the same row-level security as tenants, scoped by <code>channelPartnerId</code>. You can hop straight into any attributed tenant's own act-as context.</div></div>
        <div class="panel"><table class="tbl"><thead><tr><th>Attributed account</th><th>Industry</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (S.ptab === "territories") {
      const rows = p.territories.map(t => `<tr>
        <td class="sev-cell"><span class="sev-stripe" style="background:var(--${t.health})"></span></td>
        <td class="strong">${esc(t.name)}</td><td class="num muted">${t.accounts} accounts</td>
        <td class="num muted">${t.techs} techs</td><td>${healthPill(t.health, t.health==="warn"?"Unstaffed":"Covered")}</td></tr>`).join("");
      return `<div class="panel"><table class="tbl"><thead><tr><th class="sev-cell"></th><th>Territory</th><th class="num">Accounts</th><th class="num">Techs</th><th>Coverage</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (S.ptab === "technicians") {
      const st = { "on-route": "info", "available": "good", "delayed": "warn", "off-shift": "neutral" };
      const rows = p.technicians.map(t => `<tr><td class="strong">${esc(t.name)}</td><td class="muted">${esc(t.cert)}</td>
        <td><span class="pill pill--${st[t.status]}"><span class="dot"></span>${t.status.replace("-"," ")}</span></td></tr>`).join("");
      return `<div class="panel"><table class="tbl"><thead><tr><th>Technician</th><th>Certification</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (S.ptab === "routes") {
      const st = { "in-progress": "info", "scheduled": "neutral", "delayed": "warn" };
      const rows = p.routes.map(r => `<tr><td class="mono strong">${esc(r.name)}</td><td class="num muted">${r.stops} stops</td>
        <td class="muted">${esc(r.tech)}</td><td><span class="pill pill--${st[r.status]}"><span class="dot"></span>${r.status.replace("-"," ")}</span></td></tr>`).join("");
      return `<div class="panel"><table class="tbl"><thead><tr><th>Route</th><th class="num">Stops</th><th>Technician</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (S.ptab === "branding") {
      return `<div class="panel"><div class="panel__head"><span class="panel__title">White-label configuration</span></div>
        <div style="padding:20px;display:flex;flex-direction:column;gap:18px">
          <div style="display:flex;align-items:center;gap:14px">
            <span style="width:44px;height:44px;border-radius:12px;background:${p.brand};display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px">${esc(p.name[0])}</span>
            <div><div class="strong" style="font-size:15px">${esc(p.name)}</div><div class="mono muted" style="font-size:12px">${esc(p.subdomain)}</div></div>
          </div>
          <dl class="kv">
            <dt>Primary color</dt><dd><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:13px;height:13px;border-radius:3px;background:${p.brand}"></span><span class="mono">${p.brand.toUpperCase()}</span></span></dd>
            <dt>Portal domain</dt><dd class="mono">${esc(p.subdomain)}</dd>
            <dt>Identity source</dt><dd>PeakLogicPartners (Entra External ID)</dd>
            <dt>Login page</dt><dd>Co-branded · PeakLogic footer</dd>
          </dl>
        </div></div>`;
    }
    return "";
  }

  function viewTenantDetail() {
    const t = tenantById(S.actingAs);
    if (!t) { S.view = "tenants"; return viewTenants(); }
    const tabs = [
      { id: "sites", label: "Sites", count: t.sites.length },
      { id: "assets", label: "Assets", count: t.sites.reduce((a,s)=>a+s.assets.length,0) },
      { id: "devices", label: "Devices", count: t.sites.reduce((a,s)=>a+s.assets.reduce((b,x)=>b+x.devices.length,0),0) },
      { id: "alerts", label: "Alerts", count: t.crit + t.warn },
      { id: "tickets", label: "Tickets", count: t.tickets },
      { id: "users", label: "Users", count: 6 }
    ].map(x => `<button class="tab ${S.tab===x.id?'tab--active':''}" data-action="tenant-tab:${x.id}">${x.label}<span class="tab__count">${x.count}</span></button>`).join("");

    return `
      <div class="page-head"><h1>${esc(t.name)}</h1>
        <p>${esc(t.industry)} · Account manager ${esc(t.mgr)} · ${t.online}/${t.total} devices online. You are viewing this org exactly as its own operators do.</p></div>
      <div class="tabs">${tabs}</div>
      <div class="grow">${tenantTab(t)}</div>`;
  }

  function tenantTab(t) {
    if (S.tab === "sites") {
      return `<div class="panel"><table class="tbl">
        <thead><tr><th>Site</th><th class="num">Assets</th><th class="num">Devices</th><th>Status</th></tr></thead>
        <tbody>${t.sites.map(s => {
          const dev = s.assets.reduce((a,x)=>a+x.devices.length,0);
          const worst = s.assets.some(a=>a.health==="crit")?"crit":s.assets.some(a=>a.health==="warn")?"warn":"good";
          return `<tr><td class="strong">${esc(s.name)}</td><td class="num muted">${s.assets.length}</td>
            <td class="num muted">${dev}</td><td>${healthPill(worst)}</td></tr>`;
        }).join("")}</tbody></table></div>`;
    }
    if (S.tab === "assets") {
      const rows = [];
      t.sites.forEach(s => s.assets.forEach(a => rows.push(`
        <tr><td class="sev-cell"><span class="sev-stripe" style="background:var(--${a.health})"></span></td>
          <td><div class="row-main"><span class="strong">${esc(a.name)}</span><span class="row-sub">${esc(s.name)}</span></div></td>
          <td><span class="pill pill--neutral"><span class="dot"></span>${CAT_LABEL[a.cat]}</span></td>
          <td class="num muted">${a.devices.length} devices</td><td>${healthPill(a.health)}</td></tr>`)));
      return `<div class="panel"><table class="tbl"><thead><tr><th class="sev-cell"></th><th>Asset</th><th>Category</th><th class="num">Devices</th><th>Status</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
    }
    if (S.tab === "devices") {
      const rows = [];
      t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => rows.push(`
        <tr class="clickable" data-action="device:${d.id}"><td class="mono muted">${d.id}</td>
          <td><div class="row-main"><span class="strong">${esc(d.name)}</span><span class="row-sub">${esc(a.name)}</span></div></td>
          <td>${statePill(d.state)}</td>
          <td class="mono" style="color:${d.health==='crit'?'var(--crit-ink)':d.health==='warn'?'var(--warn-ink)':'var(--text-muted)'}">${esc(d.metric)}</td>
          <td>${sparkline(d.spark, d.health)}</td></tr>`))));
      return `<div class="panel"><table class="tbl"><thead><tr><th>Device ID</th><th>Name</th><th>State</th><th>Latest reading</th><th>Trend</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
    }
    if (S.tab === "alerts") {
      const rows = [];
      t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
        if (d.health !== "good") rows.push(`
          <tr><td class="sev-cell"><span class="sev-stripe" style="background:var(--${d.health})"></span></td>
            <td><div class="row-main"><span class="strong">${esc(d.name)}</span><span class="row-sub">${esc(s.name)} · ${esc(a.name)}</span></div></td>
            <td>${d.health==="crit"?'<span class="pill pill--crit"><span class="dot"></span>Critical</span>':'<span class="pill pill--warn"><span class="dot"></span>Warning</span>'}</td>
            <td class="mono muted">${esc(d.metric)}</td></tr>`);
      })));
      return rows.length ? `<div class="panel"><table class="tbl"><thead><tr><th class="sev-cell"></th><th>Alert</th><th>Severity</th><th>Reading</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`
        : `<div class="panel"><div class="empty">No open alerts — every device reporting within threshold.</div></div>`;
    }
    if (S.tab === "tickets") {
      if (!t.tickets) return `<div class="panel"><div class="empty">No open service tickets.</div></div>`;
      const sample = [
        { id: "TCK-3391", subj: "Freezer Bay A product temp rising", sev: "crit", age: "38m" },
        { id: "TCK-3372", subj: "Chem controller offline", sev: "warn", age: "3h" },
        { id: "TCK-3355", subj: "Chiller loop above setpoint", sev: "warn", age: "1d" },
        { id: "TCK-3340", subj: "Scheduled probe calibration", sev: "info", age: "2d" }
      ].slice(0, t.tickets);
      return `<div class="panel"><table class="tbl"><thead><tr><th>Ticket</th><th>Subject</th><th>Priority</th><th class="num">Age</th></tr></thead>
        <tbody>${sample.map(k => `<tr><td class="mono strong">${k.id}</td><td>${esc(k.subj)}</td>
          <td><span class="pill pill--${k.sev}"><span class="dot"></span>${k.sev==="crit"?"Urgent":k.sev==="warn"?"High":"Normal"}</span></td>
          <td class="num muted">${k.age}</td></tr>`).join("")}</tbody></table></div>`;
    }
    if (S.tab === "users") {
      const users = [
        { n: "Operations Manager", e: "ops@"+t.id+".example", r: "Admin" },
        { n: "Facilities Lead", e: "facilities@"+t.id+".example", r: "Operator" },
        { n: "Night Shift Tech", e: "nightshift@"+t.id+".example", r: "Operator" }
      ];
      return `<div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zM12 8v4l3 2"/></svg>
        <div>These users authenticate in the <b>PeakLogicCustomers</b> directory — a separate token issuer from your staff sign-in. You manage them via act-as; you never hold their credentials.</div></div>
        <div class="panel"><table class="tbl"><thead><tr><th>User</th><th>Email</th><th>Role</th></tr></thead>
        <tbody>${users.map(u => `<tr><td class="strong">${esc(u.n)}</td><td class="mono muted">${esc(u.e)}</td><td><span class="pill pill--accent"><span class="dot"></span>${u.r}</span></td></tr>`).join("")}</tbody></table></div>`;
    }
    return "";
  }

  function viewDevices() {
    const q = S.query.toLowerCase();
    const devs = allDevices().filter(d => !q || d.id.includes(q) || d.name.toLowerCase().includes(q) || d.org.toLowerCase().includes(q));
    const byState = {};
    allDevices().forEach(d => byState[d.state] = (byState[d.state]||0)+1);
    const legend = Object.keys(STATE_META).map(k => `<span><span class="dot" style="background:var(--${STATE_META[k].pill==='neutral'?'text-faint':STATE_META[k].pill})"></span>${STATE_META[k].label}${byState[k]?` · ${byState[k]}`:''}</span>`).join("");

    const rows = devs.map(d => `
      <tr class="clickable" data-action="device:${d.id}"><td class="mono muted">${d.id}</td>
        <td><div class="row-main"><span class="strong">${esc(d.name)}</span><span class="row-sub">${esc(d.site)}</span></div></td>
        <td class="muted">${esc(d.org)}</td>
        <td><span class="pill pill--neutral"><span class="dot"></span>${CAT_LABEL[d.cat]}</span></td>
        <td>${statePill(d.state)}</td>
        <td class="mono" style="color:${d.health==='crit'?'var(--crit-ink)':d.health==='warn'?'var(--warn-ink)':'var(--text-muted)'}">${esc(d.metric)}</td>
        <td>${sparkline(d.spark, d.health)}</td></tr>`).join("");

    return `
      <div class="page-head"><h1>Devices</h1><p>Global inventory across every organization. Lifecycle states carry the zero-touch provisioning model — from cloud registration through reporting to silence. Select any device to inspect its twin.</p></div>
      <div class="toolbar">
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="text" id="q" placeholder="Search by ID, name, or org…" value="${esc(S.query)}" autocomplete="off"></div>
        <span class="faint" style="font-size:12.5px">${devs.length} of ${allDevices().length} devices shown</span>
        <button class="btn btn--primary" data-action="register-open" style="margin-left:auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Register devices</button>
      </div>
      <div class="panel"><table class="tbl">
        <thead><tr><th>Device ID</th><th>Name</th><th>Organization</th><th>Category</th><th>State</th><th>Reading</th><th>Trend</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7"><div class="empty">No devices match "${esc(S.query)}"</div></td></tr>`}</tbody></table></div>
      <div class="legend">${legend}</div>`;
  }

  function viewStaff() {
    const rows = STAFF.map(s => {
      const book = Array.isArray(s.book) ? s.book.map(id => tenantById(id) ? tenantById(id).name : id).join(", ") : s.book;
      const roleClass = s.role === "superadmin" ? "accent" : s.role === "support_engineer" ? "info" : "neutral";
      return `<tr>
        <td><div class="row-main"><span class="strong">${esc(s.name)}</span><span class="row-sub mono">oid ${s.oid}</span></div></td>
        <td class="mono muted">${esc(s.email)}</td>
        <td><span class="pill pill--${roleClass}"><span class="dot"></span>${s.role.replace("_"," ")}</span>${s.elevated?' <span class="pill pill--warn"><span class="dot"></span>PIM active</span>':''}</td>
        <td class="muted" style="max-width:280px">${esc(book)}</td></tr>`;
    }).join("");
    return `
      <div class="page-head"><h1>Staff &amp; Access</h1><p>PeakLogic staff authenticate in the corporate Entra ID workforce tenant. Each account manager sees only their book of business; superadmin is elevated just-in-time through PIM.</p></div>
      <div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <div>Identity is keyed on the stable Entra <code>oid</code>, not the per-app <code>sub</code> — so one person stays one identity across the console, mobile app, and hub.</div></div>
      <div class="panel"><table class="tbl">
        <thead><tr><th>Staff member</th><th>Sign-in</th><th>Role</th><th>Book of business</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  function viewAudit() {
    const actionPill = { "act-as.enter": "accent", "act-as.exit": "neutral", "device.command": "warn", "device.register": "info", "ticket.escalate": "warn", "assignment.grant": "good" };
    const rows = AUDIT.map(a => `
      <tr><td class="mono faint" style="white-space:nowrap">${a.ts}</td>
        <td><div class="row-main"><span class="strong">${esc(a.actor)}</span><span class="row-sub mono">oid ${a.oid}</span></div></td>
        <td><span class="pill pill--${actionPill[a.action]||'neutral'}"><span class="dot"></span>${a.action}</span></td>
        <td class="muted">${esc(a.target)}</td>
        <td class="faint" style="font-size:12px">${esc(a.note)}</td></tr>`).join("");
    return `
      <div class="page-head"><h1>Audit Log</h1><p>Append-only. Every act-as session, device command, and access change is attributed to a real staff identity — nothing here can be edited or deleted.</p></div>
      <div class="panel"><div class="panel__head"><span class="panel__title">Recent activity</span>
        <span class="panel__note"><code>audit_log_entries</code> · newest first</span></div>
        <table class="tbl"><thead><tr><th>Timestamp (UTC)</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  // ---------- Router / render ----------
  function viewReports() {
    const ff = fleetFunnel();
    const conv = conversionPct(ff);
    const partnerRows = PARTNERS.map(p => {
      const c = conversionPct(p.funnel);
      const cls = c >= 70 ? "good" : c >= 60 ? "warn" : "crit";
      return `<tr class="clickable" data-action="manage-partner:${p.id}">
        <td><div style="display:flex;align-items:center;gap:10px"><span style="width:9px;height:9px;border-radius:3px;background:${p.brand};flex:none"></span><span class="strong">${esc(p.name)}</span></div></td>
        <td class="num muted">${p.funnel.dispatched}</td><td class="num muted">${p.funnel.accepted}</td>
        <td class="num strong">${p.funnel.onsite}</td><td class="num muted">${p.funnel.completed}</td>
        <td style="text-align:right"><span class="pill pill--${cls}"><span class="dot"></span>${c}%</span></td></tr>`;
    }).join("");

    const catalog = STANDARD_REPORTS.map(r => `
      <div class="report-card" data-action="run-report:${r.id}">
        <div class="report-card__title">${esc(r.name)}</div>
        <div class="report-card__desc">${esc(r.desc)}</div>
        <div class="report-card__foot"><span class="pill pill--neutral"><span class="dot"></span>${esc(r.vertical)}</span>
          <span class="faint" style="margin-left:auto;font-size:12px;font-weight:650">Run report →</span></div>
      </div>`).join("");

    const opts = (arr) => arr.map(d => `<option>${esc(d)}</option>`).join("");

    return `
      <div class="page-head"><h1>Reports</h1>
        <p>Standard, industry-typical reports plus a custom builder. Everything runs as a fan-out of per-organization scoped reads — never a cross-tenant query.</p></div>

      <div class="panel" style="margin-bottom:24px">
        <div class="panel__head"><span class="panel__title">Automated Dispatch → Service Call Conversion</span>
          <span class="panel__note">headline = dispatched → on-site</span>
          <button class="btn btn--ghost" data-action="run-report:conversion" style="margin-left:12px">Export</button></div>
        <div class="kpi-hero">
          <div class="kpi-hero__side">
            <div class="readout__l">Fleet conversion</div>
            <div class="kpi-hero__num">${conv}%</div>
            <div class="faint" style="font-size:12px;margin-top:6px">${ff.onsite.toLocaleString()} of ${ff.dispatched.toLocaleString()} auto-dispatched work orders reached an on-site service call</div>
          </div>
          <div class="kpi-hero__funnel">${renderFunnel(ff)}</div>
        </div>
        <table class="tbl">
          <thead><tr><th>Channel partner</th><th class="num">Dispatched</th><th class="num">Accepted</th><th class="num">On-site</th><th class="num">Completed</th><th style="text-align:right">Conversion</th></tr></thead>
          <tbody>${partnerRows}</tbody></table>
      </div>

      <div class="page-head" style="margin-bottom:14px"><h1 style="font-size:16px">Standard reports</h1></div>
      <div class="report-grid" style="margin-bottom:26px">${catalog}</div>

      <div class="panel">
        <div class="panel__head"><span class="panel__title">Custom report</span>
          <span class="panel__note">bounded builder over canonical entities</span></div>
        <div style="padding:18px;display:flex;flex-direction:column;gap:14px;max-width:640px">
          <div class="field--row">
            <div class="field"><label>Domain</label><select>${opts(["Tickets & CMMS dispatch","Service visits","Alerts","Devices","Telemetry"])}</select></div>
            <div class="field"><label>Group by</label><select>${opts(["Channel partner","Tenant","Site","Asset category","Day","Week","Month"])}</select></div>
          </div>
          <div class="field--row">
            <div class="field"><label>Date range</label><select>${opts(["Last 7 days","Last 30 days","This quarter","Year to date","Custom…"])}</select></div>
            <div class="field"><label>Format</label><select>${opts(["CSV","PDF","On-screen table"])}</select></div>
          </div>
          <p class="hint">The builder composes a saved report definition over known entities — no raw SQL — so isolation and the no-injection posture hold. Saved reports can be scheduled and delivered via the notification channels.</p>
          <div><button class="btn btn--primary" data-action="build-report">Build report</button></div>
        </div>
      </div>`;
  }

  const VIEWS = { fleet: viewFleet, tenants: viewTenants, partners: viewPartners, "tenant-detail": viewTenantDetail, "partner-detail": viewPartnerDetail, devices: viewDevices, staff: viewStaff, audit: viewAudit, reports: viewReports };
  const NAV_FOR = { fleet: "nav:fleet", tenants: "nav:tenants", "tenant-detail": "nav:tenants", partners: "nav:partners", "partner-detail": "nav:partners", devices: "nav:devices", staff: "nav:staff", audit: "nav:audit", reports: "nav:reports" };
  const TITLE = { fleet: "Fleet Overview", tenants: "Tenants", partners: "Channel Partners", devices: "Devices", staff: "Staff & Access", audit: "Audit Log", reports: "Reports" };

  function render() {
    $("#view").innerHTML = (VIEWS[S.view] || viewFleet)();
    // nav active
    document.querySelectorAll(".nav__item").forEach(b => b.classList.toggle("nav__item--active", b.getAttribute("data-action") === NAV_FOR[S.view]));
    // crumb
    let crumb = `<b>${TITLE[S.view] || "Fleet Overview"}</b>`;
    if (S.view === "tenant-detail" && S.actingAs) {
      const t = tenantById(S.actingAs);
      crumb = `<span class="sep">Tenants</span><span class="sep">/</span><b>${esc(t.name)}</b>`;
    } else if (S.view === "partner-detail" && S.partner) {
      const p = partnerById(S.partner);
      crumb = `<span class="sep">Channel Partners</span><span class="sep">/</span><b>${esc(p.name)}</b>`;
    }
    $("#crumb").innerHTML = crumb;
    renderBanner();
    // focus search if present
    const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }

  function renderBanner() {
    const slot = $("#banner-slot");
    let name = null;
    if (S.view === "tenant-detail" && S.actingAs) name = tenantById(S.actingAs).name;
    else if (S.view === "partner-detail" && S.partner) name = partnerById(S.partner).name;
    if (name) {
      slot.innerHTML = `<div class="banner">
        <span class="banner__pulse"></span>
        <span>Acting as <b>${esc(name)}</b></span>
        <span class="banner__meta">audit → ${ME.oid} · every action logged</span>
        <button class="banner__exit" data-action="exit-actas">Exit context
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>`;
    } else { slot.innerHTML = ""; }
  }

  // update sidebar counts
  function setCounts() {
    $("#cnt-tenants").textContent = TENANTS.length;
    $("#cnt-partners").textContent = PARTNERS.length;
    $("#cnt-devices").textContent = allDevices().length;
  }

  function enterActAs(id) {
    const t = tenantById(id); if (!t) return;
    closeOverlay();
    S.view = "tenant-detail"; S.actingAs = id; S.partner = null; S.tab = "sites";
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "act-as.enter", target: t.name, note: "Opened from Super-Console" });
    render();
  }
  function enterActAsPartner(id) {
    const p = partnerById(id); if (!p) return;
    S.view = "partner-detail"; S.partner = id; S.actingAs = null; S.ptab = "accounts";
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "act-as.enter", target: p.name, note: "Partner context · Super-Console" });
    render();
  }
  function exitActAs() {
    let name = null, back = "tenants";
    if (S.actingAs) { name = tenantById(S.actingAs).name; back = "tenants"; }
    else if (S.partner) { name = partnerById(S.partner).name; back = "partners"; }
    if (name) AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "act-as.exit", target: name, note: "Returned to console" });
    S.actingAs = null; S.partner = null; S.view = back; render();
  }

  // ---------- Overlay: device drawer + register modal ----------
  function closeOverlay() { $("#overlay-root").innerHTML = ""; }

  function openDeviceDrawer(id) {
    const idx = deviceIndex();
    const ctx = idx[id]; if (!ctx) return;
    renderDrawer(ctx);
  }

  function renderDrawer(ctx) {
    const d = ctx.d;
    const tw = twinFor(d, ctx.cat);
    const desiredRows = Object.keys(tw.desired).map(k => `<tr><td>${k}</td><td>${esc(tw.desired[k])}</td></tr>`).join("");
    const reportedRows = tw.reported
      ? Object.keys(tw.reported).map(k => `<tr><td>${k}</td><td>${esc(tw.reported[k])}</td></tr>`).join("")
      : `<tr><td colspan="2" style="text-align:center;color:var(--text-faint);font-family:var(--sans);padding:14px 0">No reported state yet — device has not connected.</td></tr>`;
    const canPush = d.state === "registered" || d.state === "provisioning";
    const nonNumeric = /[^\d.\-]/.test(d.metric) || d.state === "registered";

    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <aside class="drawer" role="dialog" aria-label="Device detail">
        <div class="drawer__head">
          <div>
            <div class="drawer__title">${esc(d.name)}</div>
            <div class="drawer__id">${d.id} · ${esc(ctx.org)}</div>
          </div>
          <button class="iconbtn" data-action="close-overlay" aria-label="Close" style="margin-left:auto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="drawer__body">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            ${statePill(d.state)}
            <span class="pill pill--neutral"><span class="dot"></span>${CAT_LABEL[ctx.cat]}</span>
            <span class="faint" style="font-size:12px">${esc(ctx.site)} · ${esc(ctx.asset)}</span>
          </div>

          <div class="readout">
            <div>
              <div class="readout__l">Latest reading</div>
              <div class="readout__v" style="color:${d.health==='crit'?'var(--crit-ink)':d.health==='warn'?'var(--warn-ink)':'var(--text)'}">${nonNumeric ? esc(d.metric) : esc(d.metric)}</div>
            </div>
            <div style="margin-left:auto">${sparkline(d.spark, d.health)}</div>
          </div>

          <div>
            <div class="dsec__label">Device twin — desired properties <span class="arrow">cloud → device</span></div>
            <table class="twin"><tbody>${desiredRows}</tbody></table>
          </div>

          <div>
            <div class="dsec__label">Device twin — reported properties <span class="arrow">device → cloud</span>
              <span class="sync sync--${tw.sync.cls}" style="margin-left:auto;background:var(--${tw.sync.cls==='neutral'?'surface-3':tw.sync.cls+'-soft'});color:var(--${tw.sync.cls==='neutral'?'text-muted':tw.sync.cls+'-ink'})">
                <span class="dot" style="background:var(--${tw.sync.cls==='neutral'?'text-faint':tw.sync.cls})"></span>${tw.sync.label}</span>
            </div>
            <table class="twin"><tbody>${reportedRows}</tbody></table>
          </div>

          <div>
            <div class="dsec__label">Direct methods <span class="arrow">imperative · audited</span></div>
            <div class="methods">
              ${canPush ? `<button class="btn btn--primary" data-action="method:push:${d.id}">Push config now</button>` : ``}
              <button class="btn btn--ghost" data-action="method:ping:${d.id}">Ping</button>
              <button class="btn btn--ghost" data-action="method:reset:${d.id}">Reset device</button>
            </div>
            <p class="hint" style="margin:12px 0 0">Twins carry <b>declarative</b> desired state (auto-applied on connect); direct methods are <b>imperative</b> one-shot commands. Both write to <code>audit_log_entries</code>. Safety-critical actuation stays local-first.</p>
          </div>
        </div>
      </aside>`;
    $("#overlay-root").innerHTML = html;
  }

  function runMethod(method, id) {
    const idx = deviceIndex();
    const ctx = idx[id]; if (!ctx) return;
    const d = ctx.d;
    if (method === "push") {
      d.state = "configured";
      d.metric = d.metric === "awaiting first connection" || d.metric === "pending" ? "config applied" : d.metric;
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `push config → ${d.id}` });
      toast(`Configuration pushed to ${d.id}`);
      render(); renderDrawer(deviceIndex()[id]);
    } else if (method === "ping") {
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `ping → ${d.id}` });
      toast(`Ping ack from ${d.id} · 42 ms`);
    } else if (method === "reset") {
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `reset → ${d.id}` });
      toast(`Reset command sent to ${d.id}`);
    }
  }

  function openRegister() {
    const tenantOpts = TENANTS.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
    const catOpts = Object.keys(CAT_LABEL).filter(c => c !== "pump").map(c => `<option value="${c}">${CAT_LABEL[c]}</option>`).join("");
    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="Register devices">
        <div class="modal__head">
          <h2>Register devices</h2>
          <p>Create cloud <b>intent records</b> with desired configuration attached. Devices self-provision and pull this config on first field connection — no per-unit cloud step at connect time.</p>
        </div>
        <div class="modal__body">
          <div class="field"><label for="rf-org">Organization</label><select id="rf-org">${tenantOpts}</select></div>
          <div class="field--row">
            <div class="field"><label for="rf-name">Device name</label><input id="rf-name" type="text" placeholder="e.g. Circulation Pump" value="Circulation Pump"></div>
            <div class="field"><label for="rf-cat">Category</label><select id="rf-cat">${catOpts}</select></div>
          </div>
          <div class="field--row">
            <div class="field"><label for="rf-qty">Quantity</label><input id="rf-qty" type="number" min="1" max="50" value="3"></div>
            <div class="field"><label for="rf-fw">Firmware channel</label>
              <select id="rf-fw"><option value="stable-4.2.1">stable-4.2.1</option><option value="beta-4.3.0">beta-4.3.0</option></select></div>
          </div>
          <div class="field"><label for="rf-enroll">Enrollment</label>
            <select id="rf-enroll"><option value="group">DPS enrollment group (batch / zero-touch)</option><option value="individual">Individual enrollment (one-off)</option></select></div>
          <p class="hint">Intent rows are created in state <code>registered</code> with <code>tenant_id</code> set and desired-config staged. Group enrollment lets any device with a leaf cert signed by the family CA self-provision — the real fleet-scale ZTP path.</p>
        </div>
        <div class="modal__foot">
          <button class="btn btn--ghost" data-action="close-overlay">Cancel</button>
          <button class="btn btn--primary" data-action="register-submit">Create intent records</button>
        </div>
      </div>`;
    $("#overlay-root").innerHTML = html;
    const n = $("#rf-name"); if (n) n.focus();
  }

  function submitRegister() {
    const orgId = $("#rf-org").value;
    const name = ($("#rf-name").value || "New device").trim();
    const cat = $("#rf-cat").value;
    const qty = Math.max(1, Math.min(50, parseInt($("#rf-qty").value, 10) || 1));
    const fw = $("#rf-fw").value;
    const enroll = $("#rf-enroll").value;
    const t = tenantById(orgId); if (!t) return;

    // find or create the ZTP intake site
    let site = t.sites.find(s => s.name === "ZTP Intake");
    if (!site) { site = { name: "ZTP Intake", assets: [] }; t.sites.push(site); }
    const cfg = { interval: CAT_CONFIG[cat].interval, metrics: CAT_CONFIG[cat].metrics, thresholds: CAT_CONFIG[cat].thresholds, fw: fw };
    const asset = { name: name + (qty > 1 ? " (batch)" : ""), cat: cat, health: "good", devices: [] };
    for (let i = 0; i < qty; i++) {
      asset.devices.push({
        id: genId(cat), name: qty > 1 ? `${name} #${i + 1}` : name, state: "registered",
        metric: "awaiting first connection", spark: [0, 0, 0, 0, 0, 0, 0, 0], health: "good", cfg: cfg
      });
    }
    site.assets.push(asset);
    t.total += qty;
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.register",
      target: t.name, note: `${qty}× ${CAT_LABEL[cat]} · ${enroll === "group" ? "enrollment group" : "individual"} intent` });
    closeOverlay();
    setCounts();
    S.view = "devices"; S.query = "";
    render();
    toast(`${qty} intent record${qty > 1 ? "s" : ""} created for ${t.name}`);
  }
  function nowStamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const parts = el.getAttribute("data-action").split(":");
    const action = parts[0], arg = parts[1], arg2 = parts[2];
    if (action === "nav") { closeOverlay(); S.view = arg; S.query = ""; S.actingAs = null; S.partner = null; render(); }
    else if (action === "manage-tenant") enterActAs(arg);
    else if (action === "manage-partner") enterActAsPartner(arg);
    else if (action === "exit-actas") exitActAs();
    else if (action === "tenant-tab") { S.tab = arg; render(); }
    else if (action === "partner-tab") { S.ptab = arg; render(); }
    else if (action === "device") openDeviceDrawer(arg);
    else if (action === "register-open") openRegister();
    else if (action === "register-submit") submitRegister();
    else if (action === "method") runMethod(arg, arg2);
    else if (action === "run-report") {
      const r = STANDARD_REPORTS.find(x => x.id === arg);
      toast(`Generating "${r ? r.name : arg}" — export ready`);
    }
    else if (action === "build-report") toast("Custom report queued — you'll be notified when it's ready");
    else if (action === "close-overlay") closeOverlay();
    else if (action === "toggle-theme") toggleTheme();
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "q") { S.query = e.target.value; render(); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeOverlay();
  });

  // ---------- Theme ----------
  function currentTheme() {
    const attr = document.documentElement.getAttribute("data-theme");
    if (attr) return attr;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function setThemeIcon(theme) {
    const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    const moon = '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>';
    $("#theme-icon").innerHTML = theme === "dark" ? sun : moon;
  }
  function toggleTheme() {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    setThemeIcon(next);
  }

  // ---------- Init ----------
  setCounts();
  setThemeIcon(currentTheme());
  render();
})();
</script>
