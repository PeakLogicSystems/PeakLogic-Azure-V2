name: Deploy — staging

# CI/CD Pipeline §3. Manual only — no branch in the current two-branch git
# model (dev, main) naturally maps to "staging-worthy." Runs against
# whichever ref is selected when triggered (main by default), which is also
# why the staging Entra App Registration's federated credential trusts
# ref:refs/heads/main specifically (CI/CD Pipeline §4.1).
#
# Rewritten for Azure (CI/CD Pipeline v0.2 §4) — see deploy-dev.yml's header
# comment for the full AWS→Azure rationale (OIDC mechanism swap, and the
# infra-deploy vs. code-deploy split); identical here except for trigger
# shape and stage-scoped names/secrets.
#
# GENUINELY UNTESTED END-TO-END — same standing gate as deploy-dev.yml
# (CI/CD Pipeline §7 item 2): no Azure subscription, no Entra App
# Registration/federated credential, no repo secrets/variables configured.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_STAGING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: |
          az deployment group create \
            --resource-group peaklogic-staging-rg \
            --template-file infra-azure/main.bicep \
            --parameters stage=staging \
            --parameters alertEmail="${{ vars.ALERT_EMAIL }}" \
            --parameters dbAdminPassword="${{ secrets.STAGING_DB_ADMIN_PASSWORD }}" \
            --parameters killswitchSecret="${{ secrets.STAGING_KILLSWITCH_SECRET }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm prune --omit=dev
        working-directory: backend

      - uses: Azure/functions-action@v1
        with:
          app-name: peaklogic-staging-api
          package: backend
