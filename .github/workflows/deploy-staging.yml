name: Deploy — staging

# CI/CD Pipeline §3. Manual only — no branch in the current two-branch git
# model (dev, main) naturally maps to "staging-worthy." Runs against
# whichever ref is selected when triggered (main by default), which is also
# why cicd-stack.ts's staging role trusts ref:refs/heads/main specifically.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra
      - run: npm ci
        working-directory: backend

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/peaklogic-staging-github-actions-deploy
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm run deploy:staging
        working-directory: infra
