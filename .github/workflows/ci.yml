name: CI

# CI/CD Pipeline §2.2. Runs on every PR into dev or main. Advisory, not
# merge-blocking — this repo's tier doesn't support required status checks
# (CI/CD Pipeline §2.3, confirmed via `gh api .../branches/main/protection`
# returning 403). Independent jobs, none depending on another, so one broken
# job doesn't hide the others' results. Test jobs (backend-unit-tests,
# backend-integration-tests) added per Test Strategy §7 — §3/§4 of that
# document explain what each one actually covers. `infra-validate` is
# compile-time-only (no Bicep-native assertion-test framework is wired up
# yet — the old AWS-CDK `infra-tests` job's aws-cdk-lib/assertions checks
# have no direct Azure/Bicep analogue in this repo today). `dependency-audit`
# jobs added 2026-08-01 (Water-Sector Security Hardening Strategy §5 Tier
# 0.6) — the direct lesson of the 2026-07-26/27 water-sector attacks'
# exploited vulnerability (CVE-2021-22681) surviving unpatched for 5 years:
# a known-CVE dependency has to actually be watched for, not assumed absent.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend

  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Pure-function tests only (rules.test.ts) — no database, runs
      # everywhere. Integration tests (real RLS enforcement) are the
      # separate backend-integration-tests job below, which needs Postgres.
      - run: npm test
        working-directory: backend

  backend-integration-tests:
    runs-on: ubuntu-latest
    # Test Strategy §4 — RLS/tenant-isolation regression tests need a real
    # Postgres; mocking pg would just return whatever the mock says, the
    # exact blind spot that let the telemetry table ship without RLS in the
    # first place (Multi-Tenant Architecture §2.2). GitHub Actions service
    # containers, not Testcontainers — this repo has no Docker-in-Docker
    # setup, and a service container is the simpler, more idiomatic fit for
    # a single ephemeral Postgres per job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: peaklogic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/peaklogic_test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # frontend has no separate typecheck script — build already runs
      # `tsc && vite build`, so this covers both in one step.
      - run: npm run build
        working-directory: frontend

  scripts-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - run: npm run typecheck
        working-directory: scripts

  # CI/CD Pipeline §2.2 — renamed from `infra-synth`. This project's live
  # infra is now infra-azure/ (Bicep); infra/ (AWS CDK) is retained in this
  # repo only as historical reference (CLAUDE.md's fork notice) and is no
  # longer the deploy target, so it's no longer validated here either.
  #
  # `az bicep build` is compile-time validation only (type-checking +
  # resource-schema conformance) — the direct Azure-native equivalent of
  # `cdk synth`'s own "does this even produce a valid template" check. No
  # Azure credentials needed, same reasoning as the old cdk synth job: this
  # only fails on a template error, not a live-subscription lookup, since
  # main.bicep creates every resource fresh rather than importing existing
  # ones. Azure CLI (with the bicep extension) is preinstalled on
  # ubuntu-latest — no setup action required.
  #
  # PSRule for Azure (cdk-nag's best-practices-check analogue, cicd-pipeline.md
  # §2.2) is NOT wired up yet — flagged as a real, disclosed gap, not silently
  # dropped. Add a `microsoft/ps-rule` step here when that's prioritized.
  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # main.bicep pulls in all 7 modules/*.bicep files via `module` blocks,
      # so building it also validates every one of them in a single pass.
      - run: az bicep build --file infra-azure/main.bicep --stdout > /dev/null
      # entra/*.bicep are separate, subscription-scoped templates (each
      # targets a different Entra tenant — customers/partners/staff — per
      # infra-azure/entra/README.md) — never referenced as modules from
      # main.bicep, so each needs its own explicit build check.
      - run: az bicep build --file infra-azure/entra/customers.bicep --stdout > /dev/null
      - run: az bicep build --file infra-azure/entra/partners.bicep --stdout > /dev/null
      - run: az bicep build --file infra-azure/entra/staff.bicep --stdout > /dev/null

  # Water-Sector Security Hardening Strategy §5 Tier 0.6 — SCA (software
  # composition analysis). `--omit=dev --audit-level=high`, deliberately not
  # the npm default (any severity, dev+prod, fails): this repo already has
  # disclosed, accepted dev-tooling-only findings (TD-11 esbuild/Vite
  # dev-server CORS, plus transitive vite/vitest/postcss issues that are
  # real but never reach a deployed backend) that would otherwise make this
  # job permanently red for reasons already triaged as low-risk — noise that
  # trains everyone to ignore red X's, the opposite of this job's purpose.
  # `--omit=dev` scopes to what's actually deployed; `--audit-level=high`
  # still catches a genuinely new high/critical PRODUCTION finding — the
  # class of thing that actually matters (a 2021 CVE sitting unpatched until
  # 2026 is exactly this scenario). `npm audit` reads package-lock.json
  # directly; no `npm ci` needed first.
  #
  # KNOWN, EXPECTED RED: `scripts-dependency-audit` will fail until upstream
  # fixes it — TD-47 (node-pg-migrate → glob command-injection advisory, no
  # patched version exists yet to install). Disclosed, not a broken job.
  backend-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  frontend-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  scripts-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --omit=dev --audit-level=high
        working-directory: scripts
