name: Deploy — dev

# CI/CD Pipeline §3. Push to dev = continuous deployment, no approval gate —
# matches `dev` = active development in CLAUDE.md's branching model.

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never cancel a deploy mid-flight

permissions:
  id-token: write # required for OIDC — no AWS access keys stored anywhere
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra
      - run: npm ci
        working-directory: backend

      # CI/CD Pipeline §4 — OIDC federation, not stored access keys. Role ARN
      # is a repo *variable*, not a secret (it's not sensitive — it only says
      # which role exists, not a credential), but AWS_ACCOUNT_ID and this role
      # must both be configured in repo Settings → Secrets and variables →
      # Actions before this workflow can run (CI/CD Pipeline §7 item 2 — the
      # role itself doesn't exist until infra/lib/cicd-stack.ts's dev stack is
      # deployed at least once, which itself needs `cdk bootstrap` to have run
      # first — this workflow cannot bootstrap its own prerequisites).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/peaklogic-dev-github-actions-deploy
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm run deploy:dev
        working-directory: infra
