name: Deploy — prod

# CI/CD Pipeline §3/§7. Manual dispatch only — NOT triggered by push to main.
#
# Originally designed with an automatic push-to-main trigger gated by the
# `prod` GitHub Environment's required-reviewers protection rule. Tested
# directly against this repo (PUT .../environments/prod with a reviewers
# array) and got a real 422: "Please ensure the billing plan supports the
# required reviewers protection rule" — this repo's tier doesn't support it,
# the same free-tier limitation as branch protection (CI/CD Pipeline §2.3),
# just for a different feature. An automatic trigger with no working
# approval gate behind it would deploy to prod on every merge to main with
# no human in the loop at all — worse than not automating this step.
#
# Fix: manual trigger only, same pattern as deploy-staging.yml. The human
# who deliberately runs this workflow (a real action, not a rubber-stamped
# auto-trigger) *is* the approval gate, standing in for the missing paid
# GitHub feature. `environment: prod` is kept below even without protection
# rules — it still scopes secrets/variables to this environment and gives a
# real deployment audit trail (Settings → Environments → prod) that a bare
# workflow run wouldn't.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag, branch, or commit SHA) — defaults to main. Also used for a rollback per CLAUDE.md''s Rollback Procedure: pass a previous release tag.'
        required: false
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra
      - run: npm ci
        working-directory: backend

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/peaklogic-prod-github-actions-deploy
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Deliberately NOT `npm run deploy:prod` — that script omits
      # --require-approval never so a human at a terminal still gets CDK's
      # own IAM/security-group-broadening confirmation prompt as an extra
      # safety net (Deployment Architecture §4.1's reasoning, made before
      # this pipeline existed). In an unattended CI job there is no TTY to
      # answer that prompt — it would hang until the job timeout, not fail
      # safely. The human-approval gate for this workflow is triggering it
      # in the first place (see the top-of-file note) — bypassing CDK's own
      # prompt here isn't removing a safety check, it's replacing one
      # nothing could answer with the deliberate act of running this
      # workflow at all.
      - run: npx cdk deploy --all -c stage=prod --require-approval never
        working-directory: infra
