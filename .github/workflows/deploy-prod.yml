name: Deploy — prod

# CI/CD Pipeline §3/§7. Manual dispatch only — NOT triggered by push to main.
#
# Originally designed (AWS version) with an automatic push-to-main trigger
# gated by the `prod` GitHub Environment's required-reviewers protection
# rule. Tested directly against this repo (PUT .../environments/prod with a
# reviewers array) and got a real 422: this repo's billing tier doesn't
# support that feature (CI/CD Pipeline §2.3) — carries over unchanged on the
# Azure fork (§7 item 1: re-verified against PeakLogic-Azure, identical
# 403/tier root cause).
#
# Fix, unchanged by the Azure switch: manual trigger only, same pattern as
# deploy-staging.yml. The human who deliberately runs this workflow *is* the
# approval gate, standing in for the missing paid GitHub feature.
# `environment: prod` is kept even without protection rules — it still
# scopes secrets/variables to this environment and gives a real deployment
# audit trail (Settings → Environments → prod).
#
# Rewritten for Azure (CI/CD Pipeline v0.2 §4) — see deploy-dev.yml's header
# comment for the AWS→Azure OIDC/deploy-split rationale. One thing that did
# NOT carry over: the AWS version ran a bare `cdk deploy` here instead of
# `npm run deploy:prod` specifically to skip CDK's own interactive IAM/
# security-group-broadening confirmation prompt, which would otherwise hang
# forever in a CI job with no TTY. `az deployment group create` has no
# equivalent default interactive prompt (CI/CD Pipeline §4.3, reasoned from
# Azure CLI's documented non-interactive behavior — not yet empirically
# verified against a real deploy) — no analogous workaround needed here.
#
# GENUINELY UNTESTED END-TO-END — same standing gate as deploy-dev.yml
# (CI/CD Pipeline §7 item 2): no Azure subscription, no Entra App
# Registration/federated credential, no repo secrets/variables configured.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag, branch, or commit SHA) — defaults to main. Also used for a rollback per CLAUDE.md''s Rollback Procedure: pass a previous release tag.'
        required: false
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: |
          az deployment group create \
            --resource-group peaklogic-prod-rg \
            --template-file infra-azure/main.bicep \
            --parameters stage=prod \
            --parameters alertEmail="${{ vars.ALERT_EMAIL }}" \
            --parameters dbAdminPassword="${{ secrets.PROD_DB_ADMIN_PASSWORD }}" \
            --parameters killswitchSecret="${{ secrets.PROD_KILLSWITCH_SECRET }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm prune --omit=dev
        working-directory: backend

      - uses: Azure/functions-action@v1
        with:
          app-name: peaklogic-prod-api
          package: backend

      # Architecture-review Gap 6/ADR-004 — see deploy-dev.yml's header
      # comment for the full reasoning (api/health.main.ts is a dedicated,
      # dependency-free liveness endpoint; the retry loop absorbs a Function
      # App's normal post-deploy warmup). Most valuable here of all three
      # stages: prod has no automated rollback trigger today (CLAUDE.md's
      # Rollback Procedure is a manual runbook), so a human watching this
      # step fail is the only automated signal a bad prod deploy gets.
      - name: Smoke test — /health
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf "https://peaklogic-prod-api.azurewebsites.net/health"; then
              echo "Smoke test passed."
              exit 0
            fi
            echo "Smoke test attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "::error::Smoke test failed after 5 attempts — /health did not respond successfully."
          exit 1
