<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeakView360 — Operator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Paint the operator canvas BEFORE React mounts.

         ThemeProvider sets the `dark` class in a useEffect, which by definition
         runs after first paint — so the browser painted a white page, then went
         dark a frame or two later. Standalone that reads as a brief flicker; in
         the Control Center's iframe it reads as a white flash on every load,
         because an iframe repaints from scratch each time it is attached.

         These two blocks are the fix and must stay in the document HEAD, inline
         and un-deferred: the class has to be on <html> before the first paint,
         which rules out doing it from the bundle. Keep the storage key and the
         'dark' default in step with src/theme.tsx. -->
    <style>
      html { background: #0b1120; }            /* dark canvas, the default */
      html.pv-light { background: #f1f5f9; }   /* matches AppShell's bg-slate-100 */
    </style>
    <script>
      (function () {
        // Precedence must match initialTheme() in src/theme.tsx exactly:
        //   ?theme= (an embedding console) > localStorage (operator) > dark.
        // If these two disagree the app repaints on mount, which is the very
        // flash this block exists to prevent.
        var t = 'dark';
        try {
          var u = new URLSearchParams(window.location.search).get('theme');
          t = (u === 'dark' || u === 'light') ? u : (localStorage.getItem('pv360-theme') || 'dark');
        } catch (e) { /* storage or URL blocked — keep the dark default */ }
        var d = t !== 'light';
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.classList.toggle('pv-light', !d);
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
