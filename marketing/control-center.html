      "build": "partial",
      "state": "active",
      "cadence": "Daily 05:00",
      "does": "Keeps you ready for an audit or an inspection without a scramble. Tracks regulatory deadlines, verifies the audit trail is complete and unbroken, and continuously collects the evidence a SOC 2 assessor will ask for.",
      "watches": "DMR and permit deadlines, audit-log continuity, retention windows, control evidence.",
      "publishes": [
        "reporting.summary",
        "security.alert"
      ],
      "subs": [
        "data.integrity.issue",
        "security.alert"
      ],
      "run": "npm run agent -- NOTARY-CMP --once\nnpm run agent -- NOTARY-CMP --evidence-pack --framework soc2",
      "cost": "Database reads plus blob storage for the evidence pack. Pennies per month.",
      "safety": "Never files anything with a regulator. The operator remains the filer of record.",
      "note": "The audit log and DMR draft generation exist. Deadline tracking and evidence packs do not."
    },
    {
      "id": "AEGIS-SEC",
      "role": "Threat Detection Officer",
      "div": "Security",
      "build": "partial",
      "state": "active",
      "cadence": "Every 15 min",
      "does": "Watches for someone trying to get in, or something already inside behaving oddly. Failed logins and credential stuffing, API abuse, devices connecting on a rhythm they never had before, and traffic bypassing the gateway.",
      "watches": "Auth logs, APIM traffic, device connection cadence, hub agent versions, admin actions.",
      "publishes": [
        "security.alert"
      ],
      "subs": [
        "performance.anomaly",
        "data.integrity.issue"
      ],
      "run": "npm run agent -- AEGIS-SEC --once\nnpm run agent -- AEGIS-SEC --replay <incidentId>",
      "cost": "Log Analytics queries within the existing workspace. Zero new spend.",
      "safety": "Detects and can isolate a single compromised device identity. Cannot patch, cannot change firewall rules, cannot touch equipment.",
      "note": "Connection-behaviour anomaly detection, the APIM guard, device-identity revocation and hub integrity checks are built. Auth-log correlation is not."
    },
    {
      "id": "WARDEN-TEN",
      "role": "Tenant Isolation Prover",
      "div": "Security",
      "build": "design",
      "state": "active",
      "cadence": "Every push + hourly in production",
      "does": "Continuously proves that one customer cannot see another customer’s data. Enumerates every table, checks row-level security is enabled and forced on each one, and runs live cross-tenant probes that must come back empty.",
      "watches": "Every tenant-scoped table, every RLS policy, every database role, every query path.",
      "publishes": [
        "security.alert"
      ],
      "subs": [],
      "run": "npm run agent -- WARDEN-TEN --once --fail-on-any\nnpm run agent -- WARDEN-TEN --prove-table telemetry",
      "cost": "Runs against the CI database and a read replica. Zero new spend.",
      "safety": "Read-only probes. Any finding is critical by definition — there is no warning tier for a tenant boundary.",
      "note": "The single most important gap. TD-8: isolation is not provably complete. The SET LOCAL defect meant isolation never actually executed for the project’s entire history and nothing noticed — this agent is the thing that would have noticed."
    },
    {
      "id": "CIPHER-IAM",
      "role": "Identity & Secrets Custodian",
      "div": "Security",
      "build": "design",
      "state": "active",
      "cadence": "Daily 03:00",
      "does": "Keeps track of every credential, certificate and key before one of them expires and takes the fleet offline. Also reviews who has access to what, and flags accounts that should have been closed.",
      "watches": "Device certificates, Key Vault secrets, service principals, staff accounts, role assignments.",
      "publishes": [
        "security.alert",
        "health.status"
      ],
      "subs": [],
      "run": "npm run agent -- CIPHER-IAM --once\nnpm run agent -- CIPHER-IAM --expiring 90d",
      "cost": "Key Vault and Entra read operations. Effectively zero.",
      "safety": "Never rotates a credential unattended — a botched rotation is an outage. It warns early enough for a planned one.",
      "note": "Proposed. TD-9: certificate rotation has no owner. Device certs expiring silently would take the entire fleet dark at once."
    },
    {
      "id": "MARSHAL-IR",
      "role": "Incident Commander",
      "div": "Security",
      "build": "partial",
      "state": "active",
      "cadence": "Event-driven, continuous",
      "does": "The only agent that contacts you. Every other agent reports to it; it decides what is genuinely critical, groups related findings into one incident rather than fifteen alerts, and sends you a single message with an action plan. It also owns escalation if nobody acknowledges.",
      "watches": "Every topic on the bus. Owns the critical-vs-warning decision and all outbound notification.",
      "publishes": [
        "incident.response"
      ],
      "subs": [
        "security.alert",
        "performance.anomaly",
        "data.integrity.issue",
        "health.status",
        "maintenance.recommendation"
      ],
      "run": "npm run agent -- MARSHAL-IR --once\nnpm run agent -- MARSHAL-IR --test-escalation   # sends a drill, clearly marked",
      "cost": "Notification send costs only — SMS is fractions of a cent. Email and Teams are free.",
      "safety": "Notifies and recommends. Never restarts a service, never changes equipment state, never applies a patch. Every recommendation needs a human to act on it.",
      "note": "The alert pipeline and ticket creation exist. Correlation, deduplication into incidents, escalation timers and SMS delivery do not."
    }
  ];

  const AGT_BUILD = {
    live:    { label: "Operating",   cls: "good", tip: "Built, tested, and running today." },
    partial: { label: "Partial",     cls: "warn", tip: "Some of this agent's checks exist; the rest are specified but not written." },
    design:  { label: "Specified",   cls: "info", tip: "Designed and scoped. No code yet — it reports nothing until built." },
  };
  const AGT_STATE = {
    active: { label: "Active",  tip: "Runs on its schedule, silently, and reports through the Incident Commander." },
    oncall: { label: "On call", tip: "Dormant. Runs only when you invoke it for a specific task." },
    off:    { label: "Off",     tip: "Fully disabled. Publishes nothing." },
  };
  const AGT_DIVISIONS = ["Engineering", "Operations", "Data & Equipment", "Security"];

  // ---- Actions an agent may PROPOSE. None of these run on their own. ----
  // This is the change that turns the team from advisory-only into
  // propose-and-approve: an agent may now actually execute something, but only
  // after it appears in the approval queue and a human presses Approve. The
  // safety property is preserved — nothing is autonomous — while the operator
  // gets one place to authorise real work instead of doing it by hand.
  //
  // `risk` drives how the approval card is presented. `high` means the action
  // is disruptive or destructive and the card says so plainly before you click.
  const AGENT_ACTIONS = {
    "SENTRY-CQ":  [{ id: "pr-lint", label: "Open PR with lint & format fixes", risk: "low", what: "Raises a pull request containing only mechanical formatting and lint fixes. You review and merge it — the agent never merges." }],
    "FORGE-CD":   [{ id: "deploy-dev", label: "Deploy current dev branch", risk: "medium", what: "Runs the dev deployment workflow. Dev only — staging and production always require you to trigger them." },
                   { id: "rollback", label: "Roll back to previous release tag", risk: "high", what: "Redeploys the last known-good tag. Disruptive: in-flight requests will fail during the swap." }],
    "LEDGER-SC":  [{ id: "pr-bump", label: "Open PR bumping a vulnerable dependency", risk: "low", what: "Raises a pull request upgrading one package with a known advisory. CI must pass before you merge." }],
    "SCRIBE-DOC": [{ id: "pr-docs", label: "Open PR syncing a drifted guide section", risk: "low", what: "Raises a pull request correcting a documented capability that no longer matches the product." }],
    "PULSE-OPS":  [{ id: "restart-fn", label: "Restart a failed function app", risk: "high", what: "Restarts the app. Clears the fault but destroys in-memory diagnostic state — if the cause is unknown, capture evidence first." }],
    "KEEPER-DR":  [{ id: "drill", label: "Run a restore drill now", risk: "medium", what: "Creates a scratch database, restores the latest backup into it, measures recovery time and data loss, then destroys it. Costs roughly $2–4." }],
    "ABACUS-FIN": [{ id: "stop-nonprod", label: "Stop non-production databases", risk: "medium", what: "Stops dev and staging databases to halt spend. Production is never touched. Restart is manual." },
                   { id: "all-agents-off", label: "Disable every agent", risk: "high", what: "Turns the whole team off immediately. This is the same action the cost kill switch performs automatically at your threshold." }],
    "MASON-CFG":  [{ id: "reconcile", label: "Reconcile drift to declared state", risk: "high", what: "Overwrites what is deployed with what the code declares. Only approve once you know WHY it drifted — unexplained drift can be an intrusion, and this erases it." }],
    "ASSAY-DQ":   [{ id: "quarantine", label: "Quarantine a suspect device's readings", risk: "medium", what: "Marks the device's recent readings as untrusted so they are excluded from analytics and compliance reports. Nothing is deleted; the raw data is retained." },
                   { id: "flag-recal", label: "Flag a sensor for recalibration", risk: "low", what: "Raises a calibration task for the servicing partner. Advisory only." }],
    "AUGUR-PDM":  [{ id: "create-wo", label: "Create a preventive work order", risk: "medium", what: "Dispatches a technician. This spends real money, which is why it needs your approval rather than firing on a prediction." }],
    "QUILL-RPT":  [{ id: "send-now", label: "Generate and send the report now", risk: "low", what: "Builds the health report for the current period and emails it immediately, outside the normal schedule." }],
    "NOTARY-CMP": [{ id: "evidence", label: "Generate a compliance evidence pack", risk: "low", what: "Assembles the audit-trail evidence an assessor asks for into a downloadable archive. Files nothing with any regulator." }],
    "AEGIS-SEC":  [{ id: "revoke-device", label: "Revoke a compromised device identity", risk: "high", what: "Disables one device's credentials immediately. That device goes dark until it is re-provisioned on site — this is containment, and it has a field-visit cost." },
                   { id: "block-client", label: "Block an abusive API client", risk: "medium", what: "Adds an API client to the deny list. Reversible from this console." }],
    "WARDEN-TEN": [{ id: "block-deploy", label: "Block the deployment", risk: "medium", what: "Fails the build so a change that would weaken tenant isolation cannot ship. Approving this is almost always correct." }],
    "CIPHER-IAM": [{ id: "rotate-cert", label: "Rotate an expiring certificate", risk: "high", what: "Issues and installs a replacement. A botched rotation is itself an outage, so this is never done unattended — schedule it in a maintenance window." },
                   { id: "disable-orphan", label: "Disable an orphaned account", risk: "medium", what: "Disables (does not delete) an account whose owner has left. Fully reversible." }],
    "MARSHAL-IR": [{ id: "test-escalation", label: "Send a test escalation", risk: "low", what: "Sends a clearly-marked drill through every channel so you can confirm alerts actually reach you before you need them to." },
                   { id: "suppress", label: "Acknowledge and suppress an incident", risk: "medium", what: "Stops the escalation timer for one incident. Recorded in the audit trail with your name against it." }],
  };
  const RISK_META = {
    low:    { cls: "good", label: "Low risk" },
    medium: { cls: "warn", label: "Needs care" },
    high:   { cls: "crit", label: "Disruptive" },
  };

  // Actions an agent has actually proposed and is waiting on you for. Nothing
  // here has run. Seeded with three realistic proposals so the queue is not empty.
  let AGENT_QUEUE = [
    { qid: "q1", agent: "CIPHER-IAM", action: "rotate-cert", target: "17 device certificates expiring in 21 days", why: "Riverside's fleet certs were all issued on the same day, so they expire on the same day — the whole site would go dark at once.", at: "today 03:04" },
    { qid: "q2", agent: "LEDGER-SC", action: "pr-bump", target: "glob 7.2.3 → 10.4.5 (via node-pg-migrate)", why: "A high-severity advisory was published against the installed version after it was added.", at: "today 04:00" },
    { qid: "q3", agent: "ASSAY-DQ", action: "flag-recal", target: "pH probe pl-4471-c at Bayfront Aquatic Center", why: "Reading has drifted 0.4 pH from the technician's reagent panel over three visits — the sensor, not the water.", at: "today 05:15" },
  ];

  // ---- Cost kill switch: a hard ceiling that turns the whole team off. ----
  // Distinct from the Azure budget kill switch (which stops the DATABASE at
  // 100% of the cloud budget). This one governs the AGENTS specifically, so
  // runaway agent activity can be stopped without touching the platform.
  const AGENT_KILLSWITCH = { thresholdUsd: 100, spendUsd: 3.1, armed: true, trippedAt: null };

  // ---- Report schedule (Settings -> Agent Reports) ----
  const REPORT_CADENCES = {
    "first-monday": { label: "First Monday of each month", cron: "0 6 1-7 * 1", sub: "Monthly — 06:00 on the first Monday" },
    "weekly":       { label: "Weekly", cron: "0 6 * * 1", sub: "Every Monday at 06:00" },
    "daily":        { label: "Daily", cron: "0 6 * * *", sub: "Every day at 06:00" },
    "twice-daily":  { label: "Twice daily", cron: "0 6,18 * * *", sub: "Two scheduled times each day" },
  };
  const AGENT_REPORT = { cadence: "weekly", timeA: "06:00", timeB: "18:00", tz: "America/New_York", email: true, dashboard: true };

  function agentById(id) { return AGENTS.find(a => a.id === id); }
  function actionsFor(id) { return AGENT_ACTIONS[id] || []; }
  function actionDef(agentId, actionId) { return actionsFor(agentId).find(x => x.id === actionId); }

  // The kill switch is evaluated wherever spend could have changed. Tripping it
  // forces every agent off and latches — it does not silently re-arm when spend
  // is edited back down, because you should know it fired.
  function evaluateKillswitch() {
    if (!AGENT_KILLSWITCH.armed) return false;
    if (AGENT_KILLSWITCH.spendUsd < AGENT_KILLSWITCH.thresholdUsd) return false;
    AGENTS.forEach(a => { a.state = "off"; });
    AGENT_KILLSWITCH.trippedAt = new Date().toLocaleString();
    return true;
  }
  function setAgentState(id, next) {
    const a = agentById(id); if (!a) return;
    a.state = next;
    toast(`${a.role} — ${AGT_STATE[next].label.toLowerCase()}`);
    render();
  }

  function viewAgents() {
    const on = AGENTS.filter(a => a.state === "active").length;
    const oncall = AGENTS.filter(a => a.state === "oncall").length;
    const built = AGENTS.filter(a => a.build === "live").length;
    const partial = AGENTS.filter(a => a.build === "partial").length;

    const stats = [
      { label: "Agents on duty", value: on, sub: `${oncall} on call · ${AGENTS.length - on - oncall} off`, accent: "var(--accent)",
        how: "Agents whose state is Active — they run on their own schedule without being asked.", why: "Your standing background team. Everything else waits until you engage it." },
      { label: "Actually built", value: `${built} of ${AGENTS.length}`, sub: `${partial} partially built`, accent: partial ? "var(--warn)" : "var(--good)",
        how: "Agents whose logic exists and is tested in this repository, as opposed to specified only.", why: "Separates the team you have from the team you have designed. An agent set to Active but not built still reports nothing." },
      { label: "Added Azure cost", value: "$" + AGENT_KILLSWITCH.spendUsd.toFixed(2), sub: "of $" + AGENT_KILLSWITCH.thresholdUsd + " kill-switch limit — click to change", accent: AGENT_KILLSWITCH.trippedAt ? "var(--crit)" : "var(--good)", action: "killswitch",
        how: "Fifteen of the sixteen agents cost nothing — they run as timer functions on the existing consumption plan and read telemetry already being collected, using about 18,000 executions a month against a 1,000,000 free monthly grant. The exception is the Continuity Warden's monthly restore drill, which creates and destroys a scratch database to prove a backup really restores.", why: "You set a hard rule that agents must never raise your cloud bill, and then approved one deliberate exception to it. Showing the real number rather than a flat zero is what keeps the rule enforceable — the Cost Guardian alerts if it ever drifts above this." },
      { label: "Notifies you", value: "1", sub: "MARSHAL-IR only", accent: "var(--info)",
        how: "Only the Incident Commander sends outbound messages. Every other agent reports onto the internal bus.", why: "A single voice. Fifteen agents noticing one outage reaches you as one incident, not fifteen alerts at 3am." },
    ].map(s => `<div class="stat${s.action ? " stat--click" : ""}"${s.action ? ` data-action="${s.action}" role="button" tabindex="0"` : ""}><div class="stat__accent" style="background:${s.accent}"></div><div class="stat__label">${s.label} ${explain(s.how, s.why)}</div><div class="stat__value">${s.value}</div><div class="stat__sub">${s.sub}</div></div>`).join("");

    // Pending approvals come FIRST — this is the one part of the console that
    // represents work waiting on the operator rather than status to read.
    const queue = AGENT_QUEUE.map(q => {
      const a = agentById(q.agent), def = actionDef(q.agent, q.action);
      if (!a || !def) return "";
      const rm = RISK_META[def.risk];
      return `<div class="appr appr--${def.risk}">
        <div class="appr__main">
          <div class="appr__top">
            <span class="appr__label">${esc(def.label)}</span>
            <span class="pill pill--${rm.cls}"><span class="dot"></span>${rm.label}</span>
          </div>
          <div class="appr__target">${esc(q.target)}</div>
          <div class="appr__why"><b>Why ${esc(a.role)} is proposing this:</b> ${esc(q.why)}</div>
          <div class="appr__what">${esc(def.what)}</div>
          <div class="appr__meta">${esc(q.agent)} · proposed ${esc(q.at)} · has not run</div>
        </div>
        <div class="appr__btns">
          <button class="btn btn--primary btn--sm" data-action="agent-approve:${q.qid}">Approve &amp; run</button>
          <button class="btn btn--sm" data-action="agent-reject:${q.qid}">Reject</button>
        </div>
      </div>`;
    }).join("");

    const queuePanel = AGENT_QUEUE.length ? `
      <div class="panel" style="margin-top:22px;border-color:var(--accent)">
        <div class="panel__head"><span class="panel__title">Waiting for your approval — ${AGENT_QUEUE.length}</span>
          <span class="panel__note">Nothing below has run. Agents propose; you authorise.</span></div>
        <div style="padding:14px 16px;display:flex;flex-direction:column;gap:11px">${queue}</div>
      </div>` : `
      <div class="panel" style="margin-top:22px">
        <div class="panel__head"><span class="panel__title">Waiting for your approval</span></div>
        <div style="padding:20px;color:var(--muted);font-size:13px">Nothing pending. Proposed actions appear here for you to approve or reject before any of them run.</div>
      </div>`;

    const divisions = AGT_DIVISIONS.map(div => {
      const cards = AGENTS.filter(a => a.div === div).map(a => {
        const b = AGT_BUILD[a.build];
        const seg = ["active", "oncall", "off"].map(k =>
          `<button data-action="agent-state:${a.id}:${k}" aria-pressed="${a.state === k}" title="${esc(AGT_STATE[k].tip)}">${AGT_STATE[k].label}</button>`).join("");
        return `<div class="agt ${a.state === "off" ? "agt--off" : ""}">
          <div class="agt__top">
            <div>
              <div class="agt__role">${esc(a.role)}</div>
              <div class="agt__id">${esc(a.id)}</div>
            </div>
            <span class="agt__i"><button class="mx-i" data-action="agent:${a.id}" aria-label="What ${esc(a.role)} does and how to run it" data-tip="${esc(a.role)} — ${esc(a.cadence)}. Click for what it does, how to run it, what it costs, and what it may not do.">${INFO_ICON}</button></span>
          </div>
          <div class="agt__does">${esc(a.does)}</div>
          <div class="agt__foot">
            <span class="agt__cadence">${esc(a.cadence)}</span>
            ${actionsFor(a.id).length ? `<span class="pill pill--info" title="Actions this agent can propose. Each one needs your approval before it runs."><span class="dot"></span>${actionsFor(a.id).length} action${actionsFor(a.id).length > 1 ? "s" : ""}</span>` : ""}
            <span class="pill pill--${b.cls}" title="${esc(b.tip)}"><span class="dot"></span>${b.label}</span>
          </div>
          <div class="agt__seg">${seg}</div>
        </div>`;
      }).join("");
      return `<div class="agt-div"><div class="agt-div__head"><span class="agt-div__name">${esc(div)}</span><span class="agt-div__rule"></span></div><div class="agt-grid">${cards}</div></div>`;
    }).join("");

    return `
      <div class="page-head"><h1>Agent Team</h1>
        <p>Sixteen background agents across four divisions — an engineering, operations, data and security team that works silently and reports to you. Set an agent <b>Active</b> to let it run on its own schedule, <b>On call</b> to keep it dormant until you need it, or <b>Off</b>. Every agent carries an <span class="mx-i" style="cursor:default">${INFO_ICON}</span> explaining exactly what it does and how to run it.</p></div>
      <div class="stats">${stats}</div>
      ${queuePanel}
      ${divisions}
      <div class="panel" style="margin-top:24px">
        <div class="panel__head"><span class="panel__title">Manage the roster</span>
          <span class="panel__note">
            <button class="btn btn--sm" data-action="toast:Agent definition template opened — scope, schedule, topics and thresholds">Add an agent</button>
            <button class="btn btn--sm" data-action="toast:Select an agent, then Off — retiring removes it from the roster and the bus">Retire an agent</button>
          </span></div>
        <div style="padding:15px 17px;display:flex;flex-direction:column;gap:13px">
          <div class="callout">${INFO_ICON}
            <div><b>Agents advise; they never act on equipment.</b> No agent can start or stop a pump, change a setpoint, apply a patch, or restart a service. The most any of them can do on its own is isolate one compromised device identity. Everything else is a recommendation with a human decision in front of it — the same hard gate that governs actuation platform-wide (CC-3.1/CC-4.1).</div></div>
          <div class="callout" style="border-left:3px solid var(--good);padding-left:13px">${INFO_ICON}
            <div><b>Why this costs nothing.</b> The agents reuse infrastructure you already pay for: timer functions on the existing consumption plan, the Log Analytics workspace already collecting telemetry, and Postgres as the message bus. No Kafka cluster, no Prometheus VM, no Grafana host, no SIEM licence. The one agent that can spend real money — the Continuity Warden's monthly restore drill, approved at roughly $3 a month — tears its scratch server down as soon as it finishes.</div></div>
          <div class="callout" style="border-left:3px solid var(--warn);padding-left:13px">${INFO_ICON}
            <div><b>Four agents are specified but not yet built</b> — the Documentation Registrar, Continuity Warden, Tenant Isolation Prover and Identity Custodian. The Tenant Isolation Prover is the one to build first: it is the agent that would have caught the tenant-isolation defect that went unnoticed for this project's entire history.</div></div>
        </div>
      </div>`;
  }

  // Agent detail — the (i). Rich enough to need a drawer rather than the small
  // hover tip: "how to run it" is a command line, not a sentence.
  function openAgentDrawer(id) {
    const a = agentById(id); if (!a) return;
    const b = AGT_BUILD[a.build];
    const topics = list => list.length
      ? list.map(t => `<span class="pill pill--info" style="margin:0 4px 4px 0"><span class="dot"></span>${esc(t)}</span>`).join("")
      : '<span class="muted" style="font-size:12.5px">None — it only listens.</span>';
    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <aside class="drawer agt-drawer" role="dialog" aria-label="Agent detail">
        <div class="drawer__head">
          <div>
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px">${esc(a.div)} division</div>
            <h2 class="drawer__title">${esc(a.role)}</h2>
            <div class="drawer__id">${esc(a.id)}</div>
          </div>
          <button class="btn btn--sm" data-action="close-overlay" style="margin-left:auto">Close</button>
        </div>
        <div class="drawer__body">
          <div class="agt-sec">
            <div class="agt-sec__h">What it does</div>
            <p>${esc(a.does)}</p>
          </div>
          <div class="agt-sec">
            <div class="agt-sec__h">How to run it</div>
            <div class="agt-run">${esc(a.run)}</div>
            <p class="muted" style="font-size:12px">Set it <b>Active</b> and it runs this on its own schedule. <b>On call</b> means it only runs when you invoke it.</p>
          </div>
          <div class="agt-sec">
            <div class="agt-sec__h">Status</div>
            <dl>
              <dt>Build state</dt><dd><span class="pill pill--${b.cls}"><span class="dot"></span>${b.label}</span></dd>
              <dt>Schedule</dt><dd>${esc(a.cadence)}</dd>
              <dt>Watches</dt><dd>${esc(a.watches)}</dd>
            </dl>
            <p class="muted" style="font-size:12.5px;margin-top:2px">${esc(a.note)}</p>
          </div>
          <div class="agt-sec">
            <div class="agt-sec__h">Publishes to</div>
            <div>${topics(a.publishes)}</div>
          </div>
          <div class="agt-sec">
            <div class="agt-sec__h">Listens to</div>
            <div>${topics(a.subs)}</div>
          </div>
          <div class="agt-sec">
            <div class="agt-sec__h">Actions it can propose</div>

  // ---------- PeakView360 embed ----------
  // render() replaces #view's innerHTML wholesale, which destroyed and rebuilt
  // the frame element on EVERY console re-render — and a fresh iframe node means a
  // full reload of the operator app: a white flash, and any operator state lost.
  // Toggling the theme or running a search while on this page was enough to
  // trigger it.
  //
  // So the iframe is created once and kept in this variable for the lifetime of
  // the page. Each render puts an empty #pv-slot in the markup and we re-parent
  // the SAME element into it. Moving a node with appendChild does not reload it
  // (unlike re-parsing identical HTML, which does), so the app keeps running.
  //
  // The slot carries PeakView360's own dark canvas colour rather than #fff, so
  // the very first load — the one time the frame really is fetching — settles
  // onto the operator canvas instead of flashing white against it.
  let pvFrame = null;
  function mountPeakView() {
    const slot = $("#pv-slot");
    if (!slot) return;
    if (!pvFrame) {
      pvFrame = document.createElement("iframe");
      pvFrame.src = PEAKVIEW360_URL;
      pvFrame.title = "PeakView360";
      pvFrame.setAttribute("style", "display:block;width:100%;height:100%;border:0;background:#0b1120");
    }
    if (pvFrame.parentNode !== slot) slot.appendChild(pvFrame);
  }

  // ---------- Agent approvals, kill switch, report schedule ----------
  function approveAgentAction(qid) {
    const q = AGENT_QUEUE.find(x => x.qid === qid); if (!q) return;
    const def = actionDef(q.agent, q.action); if (!def) return;
    // Disruptive actions get a second, explicit confirmation naming the
    // consequence again. One click in a list is intent; the modal is consent.
    if (def.risk === "high") { openConfirmAction(qid); return; }
    runAgentAction(qid);
  }

  function openConfirmAction(qid) {
    const q = AGENT_QUEUE.find(x => x.qid === qid); if (!q) return;
    const a = agentById(q.agent), def = actionDef(q.agent, q.action);
    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="Confirm a disruptive action">
        <div class="modal__head"><h2 class="modal__title">Confirm — this one is disruptive</h2>
          <button class="btn btn--sm" data-action="close-overlay">Close</button></div>
        <div class="modal__body">
          <div class="appr appr--high" style="background:var(--surface-3)">

                <span class="pill pill--crit"><span class="dot"></span>Disruptive</span></div>
              <div class="appr__target">${esc(q.target)}</div>
              <div class="appr__what">${esc(def.what)}</div>
            </div>
          </div>
          <p style="font-size:13px;line-height:1.6;margin:14px 0 0">
            <b>${esc(a.role)} (${esc(q.agent)})</b> will carry this out immediately once you approve.
            It will be recorded in the audit trail against your name.
          </p>
          <div class="callout" style="margin-top:12px">${INFO_ICON}
            <div>If you are not certain <b>why</b> this is being proposed, reject it. The agent keeps
            reporting the underlying finding either way — rejecting loses you nothing except the automation.</div></div>
        </div>
        <div class="modal__foot">
          <button class="btn" data-action="close-overlay">Cancel</button>
          <button class="btn btn--danger" data-action="agent-run:${q.qid}">Yes — run it</button>
        </div>
      </div>`;
    $("#overlay-root").innerHTML = html;
  }

  function runAgentAction(qid) {
    const q = AGENT_QUEUE.find(x => x.qid === qid); if (!q) return;
    const a = agentById(q.agent), def = actionDef(q.agent, q.action);
    AGENT_QUEUE = AGENT_QUEUE.filter(x => x.qid !== qid);
    closeOverlay();
    toast(`Approved — ${a.role} is running "${def.label}". Logged to the audit trail.`);
    render();
  }
  function rejectAgentAction(qid) {
    const q = AGENT_QUEUE.find(x => x.qid === qid); if (!q) return;
    const def = actionDef(q.agent, q.action);
    AGENT_QUEUE = AGENT_QUEUE.filter(x => x.qid !== qid);
    toast(`Rejected — "${def.label}" will not run. The agent keeps reporting the finding.`);
    render();
  }

    const html = `

            <div>This is separate from the <b>Azure budget kill switch</b>, which stops the database at 100% of your cloud budget. This one governs the agents only, so runaway agent activity can be stopped without taking the platform down with it.</div></div>
        </div>
        <div class="modal__foot">
          <button class="btn" data-action="close-overlay">Cancel</button>

  }

  function submitKillswitch() {
    const v = parseFloat(($("#ks-threshold") || {}).value);
    const armed = ($("#ks-armed") || {}).value === "yes";
    if (!isFinite(v) || v <= 0) { toast("Enter a threshold above $0"); return; }
    AGENT_KILLSWITCH.thresholdUsd = v;
    AGENT_KILLSWITCH.armed = armed;
    closeOverlay();
    if (evaluateKillswitch()) {
      toast(`Threshold $${v} is at or below current spend — all agents switched off.`);
    } else {
      toast(`Kill switch ${armed ? "armed" : "disarmed"} at $${v}`);
    }
    render();
  }

  // Apply edited white-label branding to a partner or tenant (in-memory) and
  // re-render, so the new mark/color/logo show everywhere the entity appears.
  // Audited, like any real change.
  function saveBranding(kind, id) {
    const e = kind === "partner" ? partnerById(id) : tenantById(id);
    if (!e) return;
    const logoEl = $("#br-logo"), brandEl = $("#br-brand");
    e.logo = ((logoEl && logoEl.value) || e.name[0]).toUpperCase().trim().slice(0, 4) || e.name[0];
    e.brand = (brandEl && brandEl.value) || e.brand || "#7c3aed";
    if (pendingLogoUpload) { e.logoImg = pendingLogoUpload; pendingLogoUpload = null; }
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: kind + ".branding", target: e.name,
      note: `White-label mark "${e.logo}" · ${e.brand.toUpperCase()}${e.logoImg ? " · logo image" : ""}` });
    render();
    toast(`Branding saved for ${e.name}`);
  }

  // Channels: the artifact & release-channel library (Platform Control Center
  // architecture §2 items 1-2 — the Artifact Repository + Release Channels as
  // the core abstraction), covering EVERY managed device type: the 9 leaf
  // product types (firmware-only — a sensor/controller runs one image) and the
  // PeakLogic Hub (a full software stack — firmware/bootloader/drivers/app/
  // config/security/PeakAssist, one named channel per bundle). Fleet-wide
  // firmware drift + the catalog (FW-1/FW-3) live here as the leaf-device detail
  // section; the Hub bundle comparison is this page's other half.
  function channelPill(tier, text) {
    return `<span class="pill pill--${CHANNEL_TIER_PILL[tier] || "neutral"}"><span class="dot"></span>${esc(text)}</span>`;
  }
  function channelLibraryRows() {
    const editBtn = (cat, tier) => `<button class="btn btn--ghost btn--sm" data-action="new-channel:${cat}:${tier}">Edit</button>`;
    const leafRows = Object.keys(FIRMWARE_CATALOG).map((cat) => {
      const e = FIRMWARE_CATALOG[cat];
      const chans = CHANNEL_TIER_ORDER.map((ch) => {
        const list = e.channels[ch] || [];
        if (!list.length) return channelPill("neutral", `${CHANNEL_TIER_LABEL[ch]} · none`);
        return channelPill(ch, `${CHANNEL_TIER_LABEL[ch]} · ${list[0]}${list.length > 1 ? ` (+${list.length - 1})` : ""}`);
      }).join(" ");
      return `<tr><td><b>${esc(e.product)}</b><div class="row-sub mono">${cat}</div></td><td class="muted">Firmware only</td><td>${chans}</td><td>${editBtn(cat, "stable")}</td></tr>`;
    }).join("");
    const hubChans = CHANNEL_TIER_ORDER.map((key) => {
      const ch = HUB_RELEASE_CHANNELS[key];
      return channelPill(key, `${ch.label} · software ${ch.bundle.software}`);
    }).join(" ");
    const hubRow = `<tr><td><b>PeakLogic Hub</b><div class="row-sub mono">edge · full stack</div></td><td class="muted">Firmware + hardware (drivers) + software (agent) + config + security + PeakAssist</td><td>${hubChans}</td><td>${editBtn("hub", "stable")}</td></tr>`;
    return leafRows + hubRow;
  }

  function viewChannels() {
    const fleet = fwFleet();
    const q = S.query.toLowerCase();
    const rank = { unmanaged: 0, outdated: 1, current: 2 };
    const shown = fleet
      .filter(d => !q || d.id.includes(q) || d.name.toLowerCase().includes(q) || d.org.toLowerCase().includes(q) || d.fw.toLowerCase().includes(q))
      .sort((a, b) => rank[a.st.code] - rank[b.st.code] || a.org.localeCompare(b.org));

    const n = { unmanaged: 0, outdated: 0, current: 0 };
    fleet.forEach(d => n[d.st.code]++);

    const stats = [
      { label: "Unmanaged firmware", value: n.unmanaged, accent: "var(--crit)",
        how: "Devices whose reported version is not present in the Device & Firmware Version Catalog for their product type.",
        why: "An unmanaged build is one PeakLogic does not support — it may predate the catalog, or be a field-flashed one-off. These are the units you cannot make guarantees about." },
      { label: "Update available", value: n.outdated, accent: "var(--warn)",
        how: "Devices on a catalogued version that is not the newest in their assigned channel.",
        why: "Supported, but behind. This is the upgrade backlog — the queue an OTA campaign would work through." },
      { label: "Current", value: n.current, accent: "var(--good)",
        how: "Devices already on the newest catalogued version for their assigned channel.",
        why: "Nothing to do. The larger this share, the more predictable the fleet's behaviour." }

    const rows = shown.map(d => `
      <tr class="clickable" data-action="device:${d.id}">

    const catalogRows = Object.keys(FIRMWARE_CATALOG).map(cat => {
      const e = FIRMWARE_CATALOG[cat];
      const chans = CHANNEL_TIER_ORDER.map(ch => {
        const list = e.channels[ch] || [];
        if (!list.length) return channelPill("neutral", `${CHANNEL_TIER_LABEL[ch]} · none`);

    const fmtVersion = (v) => (v == null ? `<span class="muted">— not shipped</span>` : `<span class="mono">${esc(v)}</span>`);
    const hubComponentRows = Object.keys(HUB_COMPONENT_LABELS).map((key) => {

    return `
      <div class="page-head"><h1>System Channels</h1>

      <div class="panel"><div class="panel__head"><span class="panel__title">Device types &amp; channels</span>
        <span class="panel__note"><button class="btn btn--ghost btn--sm" data-action="add-artifact-version">Add library version</button> <button class="btn btn--primary btn--sm" data-action="new-channel">New device channel</button></span></div>

        <thead><tr>
          <th>Device type ${explainCol("Every product category the platform manages an artifact catalog for, plus the PeakLogic Hub itself.")}</th>
          <th>Artifacts managed ${explainCol("What this type actually ships. A sensor/controller only ever runs firmware; a Hub runs a full stack, versioned as one bundle.")}</th>
          <th>Channels ${explainCol("The named release channel(s) available for this type, and the current version each points to. Stable = production default; Beta = pre-release; Preview = earliest/experimental.")}</th>
          <th></th>
        </tr></thead>
        <tbody>${channelLibraryRows()}</tbody></table></div>

      <div class="callout" style="margin-top:18px">${INFO_ICON}
        <div><b>Why drift happens even though devices are channel-managed:</b> assigning a channel declares <i>intent</i>, not an instant fact — convergence still has to travel the network, in order, and can be legitimately incomplete: the channel was <b>just updated</b> and the push hasn't landed yet (Behind); a device was <b>offline mid-rollout</b> so a component never arrived (Missing); or someone changed a component <b>outside the platform</b> — a field tech's manual override (Unexpected, needs a reviewed Override to count as expected, not a silent pass). A device that stays online and untouched converges to 100% in sync and stays there — drift is exactly the exceptions surfacing, not a sign the channel model is broken.</div></div>

      <div class="callout">${INFO_ICON}
        <div>Drift below is computed from the <b>same catalog</b> the device twin validates against — there is no second classification path. The catalog is version and compatibility metadata; whether PeakLogic also hosts and distributes the images themselves is deliberately still open (PRD §5.16).</div></div>

      <div class="page-head" style="margin-top:26px"><h2 style="font-size:16px;margin:0">Leaf devices — firmware</h2></div>

          <input type="text" id="q" placeholder="Search by ID, name, org, or version…" value="${esc(S.query)}" autocomplete="off"></div>

      </div>

      <div class="panel"><div class="panel__head"><span class="panel__title">Fleet firmware drift</span>
        <span class="panel__note">worst first · select a device to inspect its twin</span></div>
        <table class="tbl">
        <thead><tr>
          <th>Device ID ${explainCol("The unique identifier assigned when the device was registered.")}</th>
          <th>Name ${explainCol("A human-readable label for the device, and the site it serves.")}</th>
          <th>Organization ${explainCol("The tenant or channel-partner account this device is provisioned under.")}</th>
          <th>Product type ${explainCol("The catalogued product this device is, which determines the firmware versions it may run.")}</th>
          <th>Installed ${explainCol("The firmware version the device most recently reported (device twin, reported properties).")}</th>
          <th>Status ${explainCol("How the installed version compares to the catalog: current, behind the newest in its channel, or not catalogued at all.")}</th>
          <th>Latest ${explainCol("The newest catalogued version in this device's assigned channel, when an upgrade exists.")}</th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="7"><div class="empty">No devices match "${esc(S.query)}"</div></td></tr>`}</tbody></table></div>

      <div class="panel" style="margin-top:18px"><div class="panel__head"><span class="panel__title">Device &amp; Firmware Version Catalog</span>
        <span class="panel__note">supported versions per product type · newest first</span></div>
        <table class="tbl">
        <thead><tr><th>Product type</th><th>Channels</th><th>Supported</th></tr></thead>
        <tbody>${catalogRows}</tbody></table></div>

  // ============================================================================
  // UNIFIED PLATFORM (v2.0) — PeakView360 · PeakLogic Hubs · CMMS · Compliance ·
  // PeakAssist. Self-contained illustrative data (same "no backend, all data in
  // the file" posture as the rest of this demo). Makes the unified-platform
  // reframe operable — the design target for the PeakView360/Hub/CMMS/Compliance
  // build, not an implementation of it. Wastewater (the beachhead) anchors the
  // operator/compliance views. Backs PRD/SRS §5.18–§5.22.

  const pvPill = (s) => `<span class="pill pill--${s==='online'||s==='ok'?'good':s==='offline'||s==='crit'?'crit':s==='provisioning'||s==='warn'?'warn':'neutral'}"><span class="dot"></span>${s.charAt(0).toUpperCase()+s.slice(1)}</span>`;

  // A tiny multi-pen trend (PV-3.1). Inline-styled — no CSS additions needed.
  function penChart(series, height) {
    const W = 580, H = height || 130, pad = 8;
    const all = series.flatMap(s => s.data); const min = Math.min(...all), max = Math.max(...all), rng = (max - min) || 1;
    const n = series[0].data.length;
    const x = i => pad + (i * (W - 2 * pad)) / (n - 1);
    const y = v => H - pad - ((v - min) / rng) * (H - 2 * pad);
    const paths = series.map(s => `<path d="${s.data.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
    const legend = series.map(s => `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:18px;font-size:12px;color:var(--muted)"><span style="width:11px;height:3px;border-radius:2px;background:${s.color};display:inline-block"></span>${esc(s.label)}</span>`).join('');
    return `<div style="padding:6px 4px 2px"><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">${paths}</svg><div style="margin-top:8px">${legend}</div></div>`;
  }

  // ---------- PeakView360 (HMI/SCADA operator screen) ----------

  }

  // ---------- Hub Release Channels & Desired-State Bundle ----------
  // (Platform Control Center architecture §2 item 2 / §3.1.) A Release Channel is
  // a named, versioned DESIRED-STATE BUNDLE — the same component categories the
  // REAL, already-built device-side reconciler works from
  // (PeakLogicEdge.Core.Reconciliation.DesiredStateReconciler, windows-hub/):
  // firmware, bootloader, hardware (driver/interface layer — Modbus/OPC-UA/
  // EtherNet-IP), software (the agent app), config, security, and help
  // (PeakAssist). Named to match the three libraries this console manages
  // (Firmware / Hardware / Software) — "hardware" here means the DRIVER layer
  // that talks to physical interfaces, not a physical part; "software" is the
  // agent application. This is a materially different, broader model than the
  // per-leaf-device Firmware Catalog above — that catalog is correct for a SENSOR
  // (it only ever runs firmware); a HUB is a small computer running an actual
  // software stack, so it needs the full bundle. AI-model is a real slot in
  // the architecture's artifact-repository list but has no populated version here
  // — AI Analytics Tier 1 runs cloud-side only today (ai-analytics-layer-design.md),
  // nothing has ever shipped an on-Hub model — shown honestly as "not shipped",
  // never a fabricated version number.
  const HUB_COMPONENT_LABELS = {
    firmware: "Firmware (Hub OS image)",
    bootloader: "Bootloader",
    hardware: "Hardware (drivers — Modbus · OPC-UA · EtherNet/IP)",
    software: "Software (PeakLogicEdge agent)",
    config: "Config template",
    security: "Security policy / cert bundle",
    aiModel: "AI model (on-Hub)",
    peakassist: "PeakAssist content",
  };
  const HUB_RELEASE_CHANNELS = {
    stable: {
      label: "Stable",
      bundle: { firmware: "1.2.0", bootloader: "1.0.3", hardware: "2.1.0", software: "1.4.2", config: "v7", security: "2026.07.1", aiModel: null, peakassist: "2026.07.1" },
    },
    beta: {
      label: "Beta",
      bundle: { firmware: "1.3.0-beta.2", bootloader: "1.0.3", hardware: "2.2.0-beta.1", software: "1.5.0-beta.3", config: "v7", security: "2026.07.1", aiModel: null, peakassist: "2026.07.1" },
    },
    preview: {
      label: "Preview",
      bundle: { firmware: "1.4.0-preview.1", bootloader: "1.0.3", hardware: "2.3.0-preview.1", software: "1.6.0-preview.2", config: "v7", security: "2026.07.1", aiModel: null, peakassist: "2026.07.1" },
    },
  };
  // The Hub's own library, one array per component — same "select, never
  // free-type" discipline as the leaf library above. Seeded from every
  // version already assigned across the 3 tiers, plus the legitimate older
  // builds the seeded per-Hub drift data (hubBundleFor) references, so a
  // "Behind" Hub's actual reported version is still a real, findable library
  // entry — never the deliberately-out-of-catalog "…-custom.rf1" override,
  // which must NOT be selectable here (it exists only to demonstrate
  // Unexpected drift; adding it to the library would make it look sanctioned).
  const HUB_ARTIFACT_LIBRARY = (() => {
    const lib = {};
    Object.keys(HUB_COMPONENT_LABELS).filter((k) => k !== "aiModel").forEach((k) => { lib[k] = []; });
    Object.keys(HUB_RELEASE_CHANNELS).forEach((tier) => {
      const bundle = HUB_RELEASE_CHANNELS[tier].bundle;
      Object.keys(lib).forEach((k) => { if (bundle[k] != null && !lib[k].includes(bundle[k])) lib[k].push(bundle[k]); });
    });
    lib.hardware.push("2.0.4");
    lib.software.push("1.4.1");
    return lib;
  })();
  const DRIFT_META = {
    insync: { label: "In sync", cls: "good" },
    behind: { label: "Behind", cls: "warn" },
    ahead: { label: "Ahead", cls: "info" },
    missing: { label: "Missing", cls: "crit" },
    unexpected: { label: "Unexpected", cls: "warn" },
    na: { label: "Not shipped", cls: "neutral" },
  };
  // Dotted-version compare (mirrors the real Core.Versioning.DottedVersion —
  // plain string comparison gets "1.4.10" < "1.4.2" wrong; this doesn't).
  function compareDottedVersions(a, b) {
    const [aBase, aPre] = String(a).split("-");
    const [bBase, bPre] = String(b).split("-");
    const as = aBase.split(".").map(Number), bs = bBase.split(".").map(Number);
    for (let i = 0; i < Math.max(as.length, bs.length); i++) {
      const av = as[i] || 0, bv = bs[i] || 0;
      if (av !== bv) return av - bv;
    }
    if (aPre && !bPre) return -1;
    if (!aPre && bPre) return 1;
    if (aPre && bPre) return aPre < bPre ? -1 : aPre > bPre ? 1 : 0;
    return 0;
  }
  // Per-component drift classification — the same categories the real device-side
  // reconciler computes (InSync/Behind/Ahead/Missing/Unexpected); "na" is this
  // demo's own addition for a component the platform has never shipped (AI-model).
  //
  // WHY DRIFT HAPPENS AT ALL under channel management (a real, common question):
  // assigning a device to a channel declares INTENT, not an instantaneous fact —
  // convergence still has to happen over the network, in order, and can be
  // legitimately incomplete or interrupted:
  //   - Behind:      the channel was just updated (or the device just joined it)
  //                  and the push hasn't completed yet — a normal, transient state.
  //   - Missing:     a component was never successfully pushed (e.g. the device
  //                  was offline mid-rollout) — the reconciler will retry.
  //   - Unexpected:  someone changed a component OUTSIDE the platform (a field
  //                  tech manually reflashed a driver) — the channel didn't do
  //                  this; a human bypassed it. Needs a reviewed Override to be
  //                  "expected," never silently accepted as compliant.
  //   - Ahead:       rare — a component newer than the channel declares (e.g. a
  //                  hotfix applied before the channel caught up).
  // A device that's ALWAYS online and never manually touched should converge to
  // 100% in-sync and stay there — drift is what surfaces the exceptions.
  function componentDrift(desired, reported) {
    if (desired == null) return "na";
    if (reported == null) return "missing";
    // A build tag outside the catalogued channel (e.g. a field tech's manual
    // driver override) isn't "behind" or "ahead" on any numeric axis — it's
    // simply not a version the channel ever declared. Same "unmanaged" idea
    // as the per-device Firmware Catalog's own unmanaged classification.
    if (reported !== desired && /custom/i.test(reported)) return "unexpected";
    const cmp = compareDottedVersions(reported, desired);
    return cmp === 0 ? "insync" : cmp < 0 ? "behind" : "ahead";
  }
  // Illustrative per-Hub reported bundle: mostly matches its assigned channel
  // (the common case — a healthy fleet converges), with deterministic seeded
  // drift so the compliance view has real variety to show: one component behind
  // (an update in flight), one missing (security policy never pushed to a
  // freshly-provisioned Hub), and one unexpected (a field tech's manual hardware
  // override — the real "expected drift needs an Override row" case, §6).
  function hubBundleFor(hubId, channelKey) {
    let h = 0; for (let i = 0; i < hubId.length; i++) h = (h * 31 + hubId.charCodeAt(i)) >>> 0;
    const desired = HUB_RELEASE_CHANNELS[channelKey].bundle;
    const reported = { ...desired };
    const keys = Object.keys(desired).filter((k) => desired[k] != null);
    const roll = h % 9;
    if (roll === 1) reported.software = "1.4.1"; // agent update in flight — one minor behind
    else if (roll === 2) reported.hardware = "2.0.4"; // driver bundle behind
    else if (roll === 3) reported.security = null; // never pushed — Missing
    else if (roll === 4) reported.hardware = "2.1.0-custom.rf1"; // field-tech override — Unexpected
    else if (roll === 5) reported.peakassist = "2026.06.2"; // content a cycle behind
    return { desired, reported, keys };
  }
  function hubCompliance(bundle) {
    const drifts = bundle.keys.map((k) => componentDrift(bundle.desired[k], bundle.reported[k]));
    const bad = drifts.filter((d) => d !== "insync").length;
    return { total: bundle.keys.length, driftCount: bad, compliant: bad === 0 };
  }

  // ---------- PeakLogic Hubs (on-prem edge fleet) ----------
  // Derived from the REAL estate: one Hub per physically-located site. Status is
  // derived from the site's device states (a silent device -> the Hub can't reach
  // it -> offline; a provisioning device -> the Hub is still being set up), so the
  // edge fleet can never disagree with the devices it acquires.
  function fleetHubs() {
    const hubs = [];
    TENANTS.forEach(t => t.sites.forEach((s, si) => {
      if (s.lat == null) return;
      const states = s.assets.flatMap(a => a.devices.map(d => d.state));
      const status = states.includes("provisioning") ? "provisioning" : states.includes("silent") ? "offline" : "online";
      const cats = [...new Set(s.assets.map(a => a.cat))];
      const protocols = status === "provisioning" ? "— (setup)"
        : (cats.includes("wastewater") || cats.includes("energy_meter")) ? "Modbus TCP · OPC-UA"
        : cats.includes("refrigeration") ? "OPC-UA · EtherNet/IP" : "Modbus TCP";
      let h = 0; for (let i = 0; i < s.name.length; i++) h = (h * 31 + s.name.charCodeAt(i)) >>> 0;
      const id = `hub-${t.id}-${si + 1}`;
      const channelKey = h % 9 === 0 ? "preview" : h % 6 === 0 ? "beta" : "stable";
      const bundle = hubBundleFor(id, channelKey);
      const compliance = hubCompliance(bundle);
      const tags = status === "provisioning" ? 0 : s.assets.reduce((a, x) => a + x.devices.length, 0) * 6 + 6;
      hubs.push({ id, orgId: t.id, org: t.name, site: s.name, status, protocols, tags,
        channelKey, channel: HUB_RELEASE_CHANNELS[channelKey].label, bundle, compliance,
        agent: bundle.reported.software, content: bundle.reported.peakassist,
        seen: status === "online" ? "just now" : status === "offline" ? "17 min ago" : "—" });
    }));
    return hubs;
  }
  function viewHubs() {
    const hubs = fleetHubs();
    const online = hubs.filter(h => h.status === "online").length;
    const stale = hubs.filter(h => h.content !== "2026.07.1").length;
    const fullyCompliant = hubs.filter(h => h.compliance.compliant).length;
    const stats = [
      { label: "Hubs online", value: `${online} / ${hubs.length}`, sub: `${hubs.length - online} offline or provisioning`, accent: online === hubs.length ? "var(--good)" : "var(--warn)" },
      { label: "Tags acquired", value: hubs.reduce((a, h) => a + h.tags, 0), sub: "PLC/RTU points across the fleet", accent: "var(--accent)" },
      { label: "PeakAssist content", value: `${hubs.length - stale} current`, sub: `${stale} Hub(s) behind v2026.07.1`, accent: stale ? "var(--warn)" : "var(--good)" },
      { label: "Desired-state compliance", value: `${fullyCompliant} / ${hubs.length}`, sub: `${hubs.length - fullyCompliant} Hub(s) with component drift`,
        accent: fullyCompliant === hubs.length ? "var(--good)" : "var(--warn)" },
    ].map(s => `<div class="stat"><div class="stat__accent" style="background:${s.accent}"></div><div class="stat__label">${s.label}</div><div class="stat__value">${s.value}</div><div class="stat__sub">${s.sub}</div></div>`).join("");
    const rows = hubs.map(h => `<tr class="clickable" data-action="hub:${h.id}">
      <td class="mono strong">${esc(h.id)}</td>
      <td><div class="row-main"><span class="strong">${esc(h.site)}</span><span class="row-sub">${esc(h.org)}</span></div></td>
      <td>${pvPill(h.status)}</td>
      <td>${channelPill(h.channelKey, h.channel)}</td>
      <td class="mono muted">${esc(h.protocols)}</td>
      <td class="mono muted">v${h.agent}</td>
      <td>${h.content === "2026.07.1" ? `<span class="pill pill--good"><span class="dot"></span>v${h.content}</span>` : `<span class="pill pill--warn"><span class="dot"></span>v${h.content}</span>`}</td>
      <td>${h.compliance.compliant ? `<span class="pill pill--good"><span class="dot"></span>${h.compliance.total}/${h.compliance.total} in sync</span>` : `<span class="pill pill--warn"><span class="dot"></span>${h.compliance.driftCount} drifted</span>`}</td>
      <td class="mono muted">${h.seen}</td></tr>`).join("");
    return `
      <div class="page-head"><h1>PeakLogic Hubs</h1>
        <p>The on-prem edge fleet — each Hub acquires from PLCs/RTUs, evaluates alarms locally, serves PeakView360 and PeakAssist on the LAN (offline-capable), and store-and-forwards to the cloud over an outbound-only connection. Each Hub is assigned a <b>Release Channel</b> — a named bundle of firmware, drivers, the agent, config, security, and PeakAssist content — the same desired-state model the on-device reconciler enforces. Click a Hub for its full component breakdown.</p></div>

      <div class="panel" style="margin-top:22px">

  // ---------- CMMS (work orders + PM schedules) ----------
  // Work orders are DERIVED from the same real alarms the fleet shows, each
  // dispatched to the servicing channel partner of the customer whose asset

  // chain: customer alarm -> auto work order -> that customer's partner's CMMS.
  const WO_STATUS_PILL = { dispatched: '<span class="pill pill--neutral"><span class="dot"></span>Dispatched</span>', accepted: '<span class="pill pill--info"><span class="dot"></span>Accepted</span>', on_site: '<span class="pill pill--warn"><span class="dot"></span>On site</span>', completed: '<span class="pill pill--good"><span class="dot"></span>Completed</span>' };

  // This is the console's mock of the intelligent-assistant capability designed

  function helpAlarmText(type) {

  const PEAKASSIST_REFUSAL = "I don't have that documented.";
  const PEAKASSIST_MIN_SCORE = 1; // at least one real keyword hit — mirrors the real prototype's retrieval-score floor
  function askPeakAssist(question) {
    const q = question.toLowerCase();
    let best = null, bestScore = 0;
    for (const entry of PEAKASSIST_QA) {
      const score = entry.keywords.filter((k) => q.includes(k)).length;
      if (score > bestScore) { bestScore = score; best = entry; }
    }
    if (!best || bestScore < PEAKASSIST_MIN_SCORE) {
      return { grounded: false, answer: PEAKASSIST_REFUSAL, source: null };
    }
    return { grounded: true, answer: best.answer(), source: best.source };
  }

  function setCounts() {
    $("#cnt-tenants").textContent = TENANTS.length;

    // this page now covers — leaf-device firmware drift (unmanaged + behind) and
    // Hub release-channel non-compliance — not the whole fleet, which wouldn't
    // tell an operator anything.
    const deviceDrift = fwFleet().filter(d => d.st.code !== "current").length;
    const hubDrift = fleetHubs().filter(h => !h.compliance.compliant).length;
    const chEl = $("#cnt-channels");

  // ---------- Overlay: device drawer + register modal ----------
  function closeOverlay() { $("#overlay-root").innerHTML = ""; }

  // Hub detail drawer — the desired-state bundle, component by component,
  // exactly the categories the real on-device reconciler computes drift over
  // (firmware/bootloader/drivers/app/config/security/AI-model/help). This is
  // the "correctly represented software/driver/firmware" view the per-leaf-
  // device Firmware Catalog can't provide on its own — a Hub is a small
  // computer running a stack, not a single-firmware sensor.
  function openHubDrawer(id) {
    const hubs = fleetHubs();
    const h = hubs.find((x) => x.id === id); if (!h) return;
    renderHubDrawer(h);
  }

    const b = h.bundle;
    const rows = Object.keys(HUB_COMPONENT_LABELS).map((key) => {
      const desired = b.desired[key];
      const reported = b.reported[key];
      const drift = componentDrift(desired, reported);
      const meta = DRIFT_META[drift];
      const desiredText = desired == null ? "— (not shipped)" : desired;
      const reportedText = reported == null ? (desired == null ? "— (not shipped)" : "— missing") : reported;
      return `<tr>
        <td>${HUB_COMPONENT_LABELS[key]}</td>
        <td class="mono muted">${esc(desiredText)}</td>
        <td class="mono muted">${esc(reportedText)}</td>
        <td><span class="pill pill--${meta.cls}"><span class="dot"></span>${meta.label}</span></td>
      </tr>`;
    }).join("");

    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <aside class="drawer" role="dialog" aria-label="Hub detail">
        <div class="drawer__head">
          <div>
            <div class="drawer__title">${esc(h.site)}</div>
            <div class="drawer__id">${h.id} · ${esc(h.org)}</div>

          <button class="iconbtn" data-action="close-overlay" aria-label="Close" style="margin-left:auto">

        </div>

          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

            ${channelPill(h.channelKey, h.channel + " channel")}
            <span class="faint" style="font-size:12px">${esc(h.protocols)} · ${h.tags || 0} tags acquired</span>
          </div>

          <div>
            <div class="dsec__label">Desired-state bundle <span class="arrow">Release Channel → Hub</span>
              <span class="sync sync--${h.compliance.compliant ? "good" : "warn"}" style="margin-left:auto;background:var(--${h.compliance.compliant ? "good-soft" : "warn-soft"});color:var(--${h.compliance.compliant ? "good-ink" : "warn-ink"})">
                <span class="dot" style="background:var(--${h.compliance.compliant ? "good" : "warn"})"></span>${h.compliance.compliant ? "Compliant" : `${h.compliance.driftCount} component(s) drifted`}</span>

            <table class="twin"><thead><tr><th>Component</th><th>Desired</th><th>Reported</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
            <p class="hint" style="margin:10px 0 0">Software, drivers, and firmware are versioned <b>together</b> as one named Release Channel — the same bundle model <code>PeakLogicEdge.Core.Reconciliation.DesiredStateReconciler</code> already reconciles on-device. "Behind" converges automatically on next sync; "Unexpected" needs a reviewed Override (Platform Control Center §6) before it's compliant, not a silent pass.</p>
          </div>

          <div>
            <div class="dsec__label">Direct methods <span class="arrow">imperative · audited</span></div>
            <div class="methods">
              ${h.compliance.compliant ? "" : `<button class="btn btn--primary" data-action="method:hub-resync:${h.id}">Push channel now</button>`}
              <button class="btn btn--ghost" data-action="method:hub-ping:${h.id}">Ping Hub</button>
              <button class="btn btn--ghost" data-action="manage-tenant:${h.orgId}">Enter as ${esc(h.org)}</button>
            </div>
          </div>
        </div>
      </aside>`;
    $("#overlay-root").innerHTML = html;
  }

  function openDeviceDrawer(id) {
    const idx = deviceIndex();
    const ctx = idx[id]; if (!ctx) return;
    renderDrawer(ctx);
  }

  function renderDrawer(ctx) {
    const d = ctx.d;
    const tw = twinFor(d, ctx.cat);
    // FW-2 / FW-2.1: validate the twin's firmware values against the catalog for this
    // device's product type and badge the row, rather than rendering them as plain text.
    const fwBadge = (v) => {
      const st = fwStatus(ctx.cat, v);
      if (st.code === "current") return "";
      const title = st.code === "outdated" ? ` title="Latest in this channel: ${esc(st.latest)}"` : ` title="Not present in the firmware catalog for this product type"`;
      return ` <span class="pill pill--${st.cls}"${title} style="margin-left:6px;vertical-align:middle"><span class="dot"></span>${st.label}</span>`;
    };
    const twinRow = (k, v) => {
      const isFw = k === "Firmware channel" || k === "Firmware installed";
      return `<tr><td>${k}</td><td>${esc(v)}${isFw ? fwBadge(v) : ""}</td></tr>`;
    };
    const desiredRows = Object.keys(tw.desired).map(k => twinRow(k, tw.desired[k])).join("");
    const reportedRows = tw.reported
      ? Object.keys(tw.reported).map(k => twinRow(k, tw.reported[k])).join("")
      : `<tr><td colspan="2" style="text-align:center;color:var(--text-faint);font-family:var(--sans);padding:14px 0">No reported state yet — device has not connected.</td></tr>`;
    const canPush = d.state === "registered" || d.state === "provisioning";
    const nonNumeric = /[^\d.\-]/.test(d.metric) || d.state === "registered";

    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <aside class="drawer" role="dialog" aria-label="Device detail">
        <div class="drawer__head">
          <div>
            <div class="drawer__title">${esc(d.name)}</div>
            <div class="drawer__id">${d.id} · ${esc(ctx.org)}</div>
          </div>
          <button class="iconbtn" data-action="close-overlay" aria-label="Close" style="margin-left:auto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="drawer__body">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            ${statePill(d.state)}
            <span class="pill pill--neutral"><span class="dot"></span>${CAT_LABEL[ctx.cat]}</span>
            <span class="faint" style="font-size:12px">${esc(ctx.site)} · ${esc(ctx.asset)}</span>
          </div>

          <div class="readout">
            <div>
              <div class="readout__l">Latest reading</div>
              <div class="readout__v" style="color:${d.health==='crit'?'var(--crit-ink)':d.health==='warn'?'var(--warn-ink)':'var(--text)'}">${nonNumeric ? esc(d.metric) : esc(d.metric)}</div>
            </div>
            <div style="margin-left:auto">${sparkline(d.spark, d.health)}</div>
          </div>

          <div>
            <div class="dsec__label">Device twin — desired properties <span class="arrow">cloud → device</span></div>
            <table class="twin"><tbody>${desiredRows}</tbody></table>
          </div>

          <div>
            <div class="dsec__label">Device twin — reported properties <span class="arrow">device → cloud</span>
              <span class="sync sync--${tw.sync.cls}" style="margin-left:auto;background:var(--${tw.sync.cls==='neutral'?'surface-3':tw.sync.cls+'-soft'});color:var(--${tw.sync.cls==='neutral'?'text-muted':tw.sync.cls+'-ink'})">
                <span class="dot" style="background:var(--${tw.sync.cls==='neutral'?'text-faint':tw.sync.cls})"></span>${tw.sync.label}</span>
            </div>
            <table class="twin"><tbody>${reportedRows}</tbody></table>
          </div>

          <div>
            <div class="dsec__label">Direct methods <span class="arrow">imperative · audited</span></div>
            <div class="methods">
              ${canPush ? `<button class="btn btn--primary" data-action="method:push:${d.id}">Push config now</button>` : ``}
              <button class="btn btn--ghost" data-action="method:ping:${d.id}">Ping</button>
              <button class="btn btn--ghost" data-action="method:reset:${d.id}">Reset device</button>
            </div>
            <p class="hint" style="margin:12px 0 0">Twins carry <b>declarative</b> desired state (auto-applied on connect); direct methods are <b>imperative</b> one-shot commands. Both write to <code>audit_log_entries</code>. Safety-critical actuation stays local-first.</p>
          </div>
        </div>
      </aside>`;
    $("#overlay-root").innerHTML = html;
  }

  // A resync forces every component to its channel's desired version (the
  // real reconciler's convergence outcome) and re-renders the open drawer;
  // this demo doesn't persist the change into fleetHubs()'s next recompute
  // (it re-derives seeded drift deterministically), so it's an illustrative
  // one-shot rather than a durable state change — same honesty posture as
  // every other seeded-data view in this console.
  function runHubMethod(method, id) {
    const h = fleetHubs().find((x) => x.id === id); if (!h) return;
    if (method === "hub-resync") {
      const synced = { ...h, bundle: { desired: h.bundle.desired, reported: { ...h.bundle.desired }, keys: h.bundle.keys }, compliance: { total: h.bundle.keys.length, driftCount: 0, compliant: true } };
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: h.org, note: `push channel "${h.channel}" → ${h.id}` });
      toast(`Channel "${h.channel}" pushed to ${h.id} — converging to desired state`);
      renderHubDrawer(synced);
    } else if (method === "hub-ping") {
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: h.org, note: `ping → ${h.id}` });
      toast(`Ping ack from ${h.id} · 38 ms`);
    }
  }

  function runMethod(method, id) {
    if (method === "hub-resync" || method === "hub-ping") return runHubMethod(method, id);
    const idx = deviceIndex();
    const ctx = idx[id]; if (!ctx) return;
    const d = ctx.d;
    if (method === "push") {
      d.state = "configured";
      d.metric = d.metric === "awaiting first connection" || d.metric === "pending" ? "config applied" : d.metric;
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `push config → ${d.id}` });
      toast(`Configuration pushed to ${d.id}`);
      render(); renderDrawer(deviceIndex()[id]);
    } else if (method === "ping") {
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `ping → ${d.id}` });
      toast(`Ping ack from ${d.id} · 42 ms`);
    } else if (method === "reset") {
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.command", target: ctx.org, note: `reset → ${d.id}` });
      toast(`Reset command sent to ${d.id}`);
    }
  }

  function openRegister(lockedOrgId) {
    const locked = lockedOrgId ? tenantById(lockedOrgId) : null;
    const tenantOpts = locked
      ? `<option value="${locked.id}" selected>${esc(locked.name)}</option>`
      : TENANTS.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
    const cats = Object.keys(CAT_LABEL).filter(c => c !== "pump");
    const catOpts = cats.map(c => `<option value="${c}">${CAT_LABEL[c]}</option>`).join("");
    const firstCat = cats[0];
    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="Register devices">
        <div class="modal__head">
          <h2>Register devices</h2>
          <p>Create cloud <b>intent records</b> with desired configuration attached. Devices self-provision and pull this config on first field connection — no per-unit cloud step at connect time.${locked ? ` Scoped to <b>${esc(locked.name)}</b> — the same provisioning screen this organization's own admin would use.` : ""}</p>
        </div>
        <div class="modal__body">
          <div class="field"><label for="rf-org">Organization</label><select id="rf-org" ${locked ? "disabled" : ""}>${tenantOpts}</select></div>
          <div class="field--row">
            <div class="field"><label for="rf-name">Device name</label><input id="rf-name" type="text" placeholder="e.g. Circulation Pump" value="Circulation Pump"></div>
            <div class="field"><label for="rf-cat">Category</label><select id="rf-cat">${catOpts}</select></div>
          </div>
          <div class="field--row">
            <div class="field"><label for="rf-qty">Quantity</label><input id="rf-qty" type="number" min="1" max="50" value="3"></div>
            <div class="field"><label for="rf-fw">Channel</label>
              <select id="rf-fw">${channelTierOptsMarkup(firstCat)}</select></div>
          </div>
          <div class="field"><label for="rf-enroll">Enrollment</label>
            <select id="rf-enroll"><option value="group">DPS enrollment group (batch / zero-touch)</option><option value="individual">Individual enrollment (one-off)</option></select></div>
          <p class="hint">Intent rows are created in state <code>registered</code> with <code>tenant_id</code> set and desired-config staged. Group enrollment lets any device with a leaf cert signed by the family CA self-provision — the real fleet-scale ZTP path. The device converges to whatever version its assigned <b>channel</b> (System Channels) currently points to — never a free-typed firmware string.</p>
        </div>
        <div class="modal__foot">
          <button class="btn btn--ghost" data-action="close-overlay">Cancel</button>
          <button class="btn btn--primary" data-action="register-submit">Create intent records</button>
        </div>
      </div>`;
    $("#overlay-root").innerHTML = html;
    // FW-4: re-scope the channel picker whenever the product type changes, so a
    // device can only ever be assigned a channel catalogued for its own category.
    const catSel = $("#rf-cat");
    if (catSel) catSel.addEventListener("change", () => {
      const fwSel = $("#rf-fw");
      if (fwSel) fwSel.innerHTML = channelTierOptsMarkup(catSel.value);
    });
    const n = $("#rf-name"); if (n) n.focus();
  }

  function submitRegister() {
    const orgId = $("#rf-org").value;
    const name = ($("#rf-name").value || "New device").trim();
    const cat = $("#rf-cat").value;
    const qty = Math.max(1, Math.min(50, parseInt($("#rf-qty").value, 10) || 1));
    const fw = $("#rf-fw").value;
    const enroll = $("#rf-enroll").value;
    const t = tenantById(orgId); if (!t) return;

    // find or create the ZTP intake site
    let site = t.sites.find(s => s.name === "ZTP Intake");
    if (!site) { site = { name: "ZTP Intake", assets: [] }; t.sites.push(site); }
    const cfg = { interval: CAT_CONFIG[cat].interval, metrics: CAT_CONFIG[cat].metrics, thresholds: CAT_CONFIG[cat].thresholds, fw: fw };
    const asset = { name: name + (qty > 1 ? " (batch)" : ""), cat: cat, health: "good", devices: [] };
    for (let i = 0; i < qty; i++) {
      asset.devices.push({
        id: genId(cat), name: qty > 1 ? `${name} #${i + 1}` : name, state: "registered",
        metric: "awaiting first connection", spark: [0, 0, 0, 0, 0, 0, 0, 0], health: "good", cfg: cfg
      });
    }
    site.assets.push(asset);
    // No manual count to bump — tenantStats derives device counts live.
    AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "device.register",
      target: t.name, note: `${qty}× ${CAT_LABEL[cat]} · ${enroll === "group" ? "enrollment group" : "individual"} intent` });
    closeOverlay();
    setCounts();
    if (!S.actingAs) { S.view = "devices"; S.query = ""; }
    render();
    toast(`${qty} intent record${qty > 1 ? "s" : ""} created for ${t.name}`);
  }

  function openThresholds(orgId, assetKey) {
    const t = tenantById(orgId); if (!t) return;
    const [siteIdx, assetIdx] = assetKey.split(".").map(Number);
    const site = t.sites[siteIdx]; if (!site) return;
    const asset = site.assets[assetIdx]; if (!asset) return;
    const current = asset.thresholds || (CAT_CONFIG[asset.cat] || {}).thresholds || "";
    const html = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="Configure thresholds">
        <div class="modal__head">
          <h2>Configure thresholds</h2>
          <p><b>${esc(asset.name)}</b> · ${esc(site.name)} · ${esc(t.name)} — the same alerting configuration this organization's own admin would set.</p>
        </div>

  function nowStamp() {
    const d = new Date();

    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  function slugify(s) {
    let base = s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "org";

    while (tenantById(slug) || partnerById(slug)) { slug = `${base}-${n++}`; }
    return slug;
  }

  // ---------- Manage a device-type's channel (System Channels) ----------
  // One modal covers both real actions the page needs: creating a NEW named
  // channel for a device type (pick a type + tier that has none yet) and
  // "adding a file" to the Firmware/Hardware/Software library for an existing
  // one (the version fields below ARE the library entries — saving writes
  // straight into the same FIRMWARE_CATALOG / HUB_RELEASE_CHANNELS structures
  // the drift computation already reads, so there is no second, disconnected
  // copy of this data). A leaf device type only ever has a Firmware field (it
  // only ever runs firmware); PeakLogic Hub gets the full component set.
  function channelDeviceTypeOptions(selected) {
    const opts = Object.keys(FIRMWARE_CATALOG).map((cat) =>
      `<option value="${cat}"${cat === selected ? " selected" : ""}>${esc(FIRMWARE_CATALOG[cat].product)}</option>`).join("");
    return opts + `<option value="hub"${selected === "hub" ? " selected" : ""}>PeakLogic Hub</option>`;
  }
  // Every field here is a <select> sourced from a library array — never a
  // free-text input — so a channel can only ever point at a version that was
  // actually registered (Add library version), matching how a real fleet
  // shouldn't be able to converge devices onto a typo.
  function selectFromLibrary(id, label, options, current) {
    if (!options.length) {
      return `<div class="field"><label for="${id}">${label}</label><select id="${id}" disabled><option value="">No versions in library yet</option></select>
        <p class="hint">Use <b>Add library version</b> below to register the first build before assigning it to a channel.</p></div>`;
    }
    const opts = options.map((v) => `<option value="${esc(v)}"${v === current ? " selected" : ""}>${esc(v)}</option>`).join("");
    return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts}</select></div>`;
  }
  function manageChannelFieldsHtml(cat, tier) {
    if (cat === "hub") {
      const bundle = HUB_RELEASE_CHANNELS[tier] ? HUB_RELEASE_CHANNELS[tier].bundle : {};
      return Object.keys(HUB_COMPONENT_LABELS).filter((k) => k !== "aiModel")
        .map((k) => selectFromLibrary(`mc-${k}`, HUB_COMPONENT_LABELS[k], HUB_ARTIFACT_LIBRARY[k] || [], bundle[k])).join("");
    }
    const entry = FIRMWARE_CATALOG[cat];
    const current = entry && entry.channels[tier] && entry.channels[tier][0] || "";
    return selectFromLibrary("mc-firmware", "Firmware version", (entry && entry.library) || [], current)
      + `<p class="hint">${esc((entry && entry.product) || cat)} only ships firmware — no separate hardware/software artifact.</p>`;
  }
  function openManageChannel(prefillCat, prefillTier) {
    const cat = prefillCat || Object.keys(FIRMWARE_CATALOG)[0];
    const tier = prefillTier || "stable";
    $("#overlay-root").innerHTML = `
      <div class="overlay" data-action="close-overlay"></div>
      <div class="modal" role="dialog" aria-label="Manage device channel">
        <div class="modal__head"><h2>${prefillCat ? "Edit" : "New"} device channel</h2>
          <p>Assign a device type to a named channel, and set the artifact version(s) that channel pushes. Devices in this channel converge to exactly these versions, in order, on their next sync.</p></div>
        <div class="modal__body">
          ${fieldRow(`
            <div class="field"><label for="mc-type">Device type</label><select id="mc-type">${channelDeviceTypeOptions(cat)}</select></div>
            <div class="field"><label for="mc-tier">Channel</label><select id="mc-tier">${CHANNEL_TIER_ORDER.map((t) => `<option value="${t}"${t === tier ? " selected" : ""}>${CHANNEL_TIER_LABEL[t]}</option>`).join("")}</select></div>`)}
          <div class="field"><label>Attach build artifact <span class="faint">(optional)</span></label>

    const cat = $("#mc-type").value, tier = $("#mc-tier").value;
