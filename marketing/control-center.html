<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PeakLogic Control Center — the internal, staff-only fleet management console: tenants, channel partners, devices, firmware, audit log, and unified-platform operations.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>PeakLogic Control Center</title>
<style>
  :root {
    --rail-bg: #0a0f1d;
    --rail-surface: #121b30;
    --rail-border: #1e2a44;
    --rail-text: #e8ecf5;
    --rail-muted: #7f8db0;
    --rail-active-bg: rgba(139, 92, 246, .16);
    --rail-active-bar: #8b5cf6;

    --bg: #f5f5fb;
    --surface: #ffffff;
    --surface-2: #fbfaff;
    --surface-3: #f2f1fa;
    --border: #e7e5f1;
    --border-strong: #d7d4e8;
    --text: #10152a;
    --text-muted: #5c6480;
    --text-faint: #939ab5;
    --accent: #7c3aed;
    --accent-ink: #6d28d9;
    --accent-soft: #ede9fe;
    --data-val: var(--text-muted);

    --good: #16a34a;
    --good-soft: #dcfce7;
    --good-ink: #15803d;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --warn-ink: #b45309;
    --crit: #dc2626;
    --crit-soft: #fee2e2;
    --crit-ink: #b91c1c;
    --info: #2563eb;
    --info-soft: #dbeafe;
    --info-ink: #1d4ed8;

    --shadow: 0 1px 2px rgba(16, 21, 42, .04), 0 4px 16px rgba(16, 21, 42, .05);
    --shadow-lg: 0 12px 40px rgba(16, 21, 42, .16);
    --radius: 12px;
    --radius-sm: 8px;

    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080c17;
      --surface: #10192b;
      --surface-2: #0d1524;
      --surface-3: #16223a;
      --border: #223049;
      --border-strong: #2c3c58;
      --text: #eef2fb;
      --text-muted: #93a0bd;
      --text-faint: #66728f;
      --accent: #8b5cf6;
      --accent-ink: #a78bfa;
      --accent-soft: #241d45;
      --data-val: var(--text);

      --good: #34d399; --good-soft: #0c2a20; --good-ink: #6ee7b7;
      --warn: #fbbf24; --warn-soft: #2e2408; --warn-ink: #fcd34d;
      --crit: #f87171; --crit-soft: #2e1416; --crit-ink: #fca5a5;
      --info: #60a5fa; --info-soft: #12203c; --info-ink: #93c5fd;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
    }
  }

  :root[data-theme="light"] {
    --bg: #f5f5fb; --surface: #ffffff; --surface-2: #fbfaff; --surface-3: #f2f1fa;
    --border: #e7e5f1; --border-strong: #d7d4e8; --text: #10152a; --text-muted: #5c6480;
    --text-faint: #939ab5; --accent: #7c3aed; --accent-ink: #6d28d9; --accent-soft: #ede9fe;
    --data-val: var(--text-muted);
    --good: #16a34a; --good-soft: #dcfce7; --good-ink: #15803d;
    --warn: #d97706; --warn-soft: #fef3c7; --warn-ink: #b45309;
    --crit: #dc2626; --crit-soft: #fee2e2; --crit-ink: #b91c1c;
    --info: #2563eb; --info-soft: #dbeafe; --info-ink: #1d4ed8;
    --shadow: 0 1px 2px rgba(16,21,42,.04), 0 4px 16px rgba(16,21,42,.05);
    --shadow-lg: 0 12px 40px rgba(16,21,42,.16);
  }
  :root[data-theme="dark"] {
    --bg: #080c17; --surface: #10192b; --surface-2: #0d1524; --surface-3: #16223a;
    --border: #223049; --border-strong: #2c3c58; --text: #eef2fb; --text-muted: #93a0bd;
    --text-faint: #66728f; --accent: #8b5cf6; --accent-ink: #a78bfa; --accent-soft: #241d45;
    --data-val: var(--text);
    --good: #34d399; --good-soft: #0c2a20; --good-ink: #6ee7b7;
    --warn: #fbbf24; --warn-soft: #2e2408; --warn-ink: #fcd34d;
    --crit: #f87171; --crit-soft: #2e1416; --crit-ink: #fca5a5;
    --info: #60a5fa; --info-soft: #12203c; --info-ink: #93c5fd;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .app {
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 248px 1fr;
    -webkit-font-smoothing: antialiased;
  }
  @media (max-width: 760px) { .app { grid-template-columns: 68px 1fr; } }

  /* ---------- Command rail (pinned dark, both themes) ---------- */
  .rail {
    background: var(--rail-bg);
    border-right: 1px solid var(--rail-border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    padding: 18px 12px;
  }
  .brand {
    display: flex; align-items: flex-end; gap: 9px; padding: 6px 8px 20px;
    border: none; background: none; cursor: pointer; width: 100%; font-family: inherit; text-align: left;
  }
  .brand:hover .brand__word .peak { color: #e8ecf5; }
  .brand svg { width: 30px; height: 22px; display: block; }
  .brand__word { font-size: 19px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .brand__word .peak { color: #ffffff; }
  .brand__word .logic { color: #8b5cf6; }
  @media (max-width: 760px) { .brand__word { display: none; } .brand { justify-content: center; padding: 6px 0 20px; } }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav__label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--rail-muted); font-weight: 700; padding: 16px 10px 6px;
  }
  @media (max-width: 760px) { .nav__label { text-align: center; font-size: 8px; padding: 12px 0 4px; } }
  .nav__item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    color: var(--rail-text); font-size: 13.5px; font-weight: 500;
    cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    position: relative; font-family: inherit; transition: background .12s ease;
  }
  .nav__item:hover { background: rgba(255,255,255,.05); }
  .nav__item svg { width: 17px; height: 17px; flex: none; opacity: .82; }
  .nav__item--active { background: var(--rail-active-bg); color: #fff; font-weight: 600; }
  .nav__item--active::before {
    content: ""; position: absolute; left: -12px; top: 7px; bottom: 7px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--rail-active-bar);
  }
  .nav__item--active svg { opacity: 1; color: #a78bfa; }
  .nav__item--sub { padding-left: 38px; font-size: 13px; }
  @media (max-width: 760px) {
    .nav__item { justify-content: center; padding: 11px 0; gap: 0; }
    .nav__item span, .nav__item--sub { display: none; }
    .nav__item--sub { display: none !important; }
  }
  .nav__count {
    margin-left: auto; font-size: 11px; font-family: var(--mono);
    color: var(--rail-muted); background: rgba(255,255,255,.06);
    padding: 1px 7px; border-radius: 20px; font-variant-numeric: tabular-nums;
  }
  @media (max-width: 760px) { .nav__count { display: none; } }

  .rail__foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--rail-border); }
  .who { display: flex; align-items: center; gap: 10px; }
  .who__avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #8b5cf6, #22c55e);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
  }
  .who__name { font-size: 12.5px; font-weight: 600; color: var(--rail-text); line-height: 1.3; }
  .who__role { font-size: 10.5px; color: var(--rail-muted); display: flex; align-items: center; gap: 4px; }
  .who__role .dot { width: 5px; height: 5px; border-radius: 50%; background: #34d399; }
  @media (max-width: 760px) { .who__name, .who__role { display: none; } .who { justify-content: center; } }

  /* ---------- Main ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20;
  }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); min-width: 0; }
  .crumb b { color: var(--text); font-weight: 650; }
  .crumb .sep { color: var(--text-faint); }
  .topbar__spacer { flex: 1; }
  .iconbtn {
    display: grid; place-items: center; width: 34px; height: 34px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); cursor: pointer;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--border-strong); }
  .iconbtn svg { width: 17px; height: 17px; }

  /* Act-as banner */
  .banner {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 28px; background: var(--accent-soft);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    font-size: 13px; color: var(--text);
  }
  .banner__pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70% { box-shadow: 0 0 0 9px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .banner__pulse { animation: none; } }
  .banner b { font-weight: 700; }
  .banner__meta { color: var(--accent-ink); font-family: var(--mono); font-size: 11.5px; }
  .banner__exit {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 13px; border-radius: 20px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
    background: var(--surface); color: var(--accent-ink); font-weight: 650; font-size: 12.5px;
    cursor: pointer; font-family: inherit;
  }
  .banner__exit:hover { background: var(--surface-2); }

  .view { padding: 26px 28px 60px; animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view, .banner__pulse { animation: none; } }

  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; font-weight: 750; letter-spacing: -.02em; margin: 0 0 4px; text-wrap: balance; }
  .page-head p { margin: 0; color: var(--text-muted); font-size: 13.5px; max-width: 68ch; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat__label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 650; }
  .stat__value { font-size: 30px; font-weight: 760; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat__sub { font-size: 12px; color: var(--text-faint); margin-top: 7px; font-variant-numeric: tabular-nums; }
  .stat__accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

  /* Panels */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 940px) { .grid2 { grid-template-columns: 1fr; } }
  .panel__head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
  .panel__title { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .panel__note {
    margin-left: auto; font-size: 11px; color: var(--text-faint);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .panel__note code { font-family: var(--mono); color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; }

  /* Tables */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text); }
  .tbl th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-faint); font-weight: 700; padding: 10px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface);
  }
  .tbl td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tbody tr { transition: background .1s ease; }
  .tbl tbody tr.clickable { cursor: pointer; }
  .tbl tbody tr.clickable:hover { background: var(--surface-3); }
  .tbl .num { font-variant-numeric: tabular-nums; text-align: right; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }
  .sev-cell { width: 4px; padding: 0 !important; }
  .sev-stripe { display: block; width: 4px; align-self: stretch; min-height: 44px; }
  .strong { font-weight: 650; }
  .row-main { display: flex; flex-direction: column; gap: 2px; }
  .row-sub { font-size: 11.5px; color: var(--text-faint); }

  /* Pills */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border-radius: 20px; font-size: 11.5px; font-weight: 650; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .pill--good { background: var(--good-soft); color: var(--good-ink); } .pill--good .dot { background: var(--good); }
  .pill--warn { background: var(--warn-soft); color: var(--warn-ink); } .pill--warn .dot { background: var(--warn); }
  .pill--crit { background: var(--crit-soft); color: var(--crit-ink); } .pill--crit .dot { background: var(--crit); }
  .pill--info { background: var(--info-soft); color: var(--info-ink); } .pill--info .dot { background: var(--info); }
  .pill--neutral { background: var(--surface-3); color: var(--text-muted); } .pill--neutral .dot { background: var(--text-faint); }
  .pill--accent { background: var(--accent-soft); color: var(--accent-ink); } .pill--accent .dot { background: var(--accent); }

  /* Rollup bar */
  .rollup { display: flex; align-items: center; gap: 10px; }
  .rollup__track { flex: 1; height: 7px; border-radius: 20px; background: var(--surface-3); overflow: hidden; display: flex; }
  .rollup__fill { height: 100%; background: var(--good); }
  .rollup__fill.warn { background: var(--warn); }
  .rollup__fill.crit { background: var(--crit); }
  .rollup__val { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 650; cursor: pointer; font-family: inherit; border: 1px solid transparent;
    transition: transform .06s ease, background .12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--primary:hover { background: var(--accent-ink); }
  .btn--ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  /* Confirming a disruptive agent action — the button must not look like the
     routine primary, or the confirmation step stops carrying any weight. */
  .btn--danger { background: var(--crit); color: #fff; border-color: transparent; }
  .btn--danger:hover { filter: brightness(.92); }
  .btn--ghost:hover { background: var(--surface-2); }
  .btn svg { width: 14px; height: 14px; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .search {
    display: flex; align-items: center; gap: 8px; padding: 8px 13px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); flex: 1; min-width: 200px; max-width: 340px;
  }
  .search svg { width: 15px; height: 15px; color: var(--text-faint); flex: none; }
  .search input { border: none; background: none; outline: none; font-family: inherit; font-size: 13px; color: var(--text); width: 100%; }
  .search input::placeholder { color: var(--text-faint); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; overflow-y: hidden; }
  .tab {
    padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border: none; background: none; font-family: inherit; white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab--active { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .tab__count { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 5px; }

  .spark { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 11.5px; color: var(--text-muted); margin-top: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  .callout {
    display: flex; gap: 12px; padding: 13px 16px; border-radius: var(--radius);
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    font-size: 12.5px; color: var(--text); margin-bottom: 20px; line-height: 1.5;
  }
  .callout svg { width: 18px; height: 18px; color: var(--accent); flex: none; margin-top: 1px; }
  .callout b { font-weight: 700; }
  .callout code { font-family: var(--mono); font-size: 11.5px; background: var(--surface); padding: 1px 5px; border-radius: 4px; color: var(--accent-ink); }
  .linklike { background: none; border: none; padding: 0; margin: 0; font: inherit; font-weight: 600; color: var(--accent-ink); cursor: pointer; text-align: left; }
  .linklike:hover { text-decoration: underline; }

  .empty { padding: 40px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 12.5px; }
  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; font-weight: 600; }

  .grow { animation: fade .2s ease; }

  /* ---------- Conversion funnel ---------- */
  .kpi-hero { display: flex; flex-wrap: wrap; gap: 28px; padding: 20px; align-items: center; }
  .kpi-hero__num { font-size: 46px; font-weight: 780; letter-spacing: -.03em; color: var(--good-ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .kpi-hero__side { min-width: 210px; }
  .kpi-hero__funnel { flex: 1; min-width: 300px; }
  .funnel { display: flex; flex-direction: column; gap: 3px; }
  .funnel__row { display: flex; align-items: center; gap: 12px; }
  .funnel__label { width: 178px; flex: none; font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .funnel__track { flex: 1; height: 22px; min-width: 70px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
  .funnel__fill { height: 100%; border-radius: 6px; transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .funnel__count { width: 48px; text-align: right; font-family: var(--mono); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .funnel__rate { margin-left: 190px; font-size: 11px; color: var(--text-faint); padding: 1px 0; }
  @media (max-width: 640px) { .funnel__label { width: 104px; } .funnel__rate { margin-left: 116px; } }

  /* ---------- Report catalog ---------- */
  .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 820px) { .report-grid { grid-template-columns: 1fr; } }
  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .12s ease, transform .06s ease; }
  .report-card:hover { border-color: var(--border-strong); }
  .report-card:active { transform: translateY(1px); }
  .report-card__title { font-weight: 700; font-size: 14px; letter-spacing: -.01em; text-wrap: balance; }
  .report-card__desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; flex: 1; }
  .report-card__foot { display: flex; align-items: center; gap: 8px; margin-top: 2px; }

  /* ---------- Agents console ---------- */
  .agt-div { margin-top: 24px; }
  .agt-div__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 11px; }
  .agt-div__name { font-size: 12px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .agt-div__rule { flex: 1; height: 1px; background: var(--border); }
  .agt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 13px; }
  .agt { border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); padding: 14px 15px; display: flex; flex-direction: column; gap: 9px; }
  .agt--off { opacity: .55; }
  .agt__top { display: flex; align-items: flex-start; gap: 9px; }
  .agt__role { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
  .agt__id { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .agt__i { margin-left: auto; flex: none; }
  .agt__does { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .agt__foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
  .agt__cadence { font-size: 11.5px; color: var(--text-faint); margin-right: auto; }
  .agt__seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .agt__seg button { border: none; background: none; font-family: inherit; font-size: 11px; font-weight: 650; padding: 4px 9px; color: var(--muted); cursor: pointer; }
  .agt__seg button:hover { background: var(--surface-3); color: var(--text); }
  .agt__seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
  .agt-drawer dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; font-size: 12.5px; }
  .agt-drawer dt { color: var(--muted); white-space: nowrap; }
  .agt-drawer dd { margin: 0; }
  .agt-sec { display: flex; flex-direction: column; gap: 6px; }
  .agt-sec__h { font-size: 11px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .agt-sec p { margin: 0; font-size: 13px; line-height: 1.55; }
  .agt-run { font-family: var(--mono); font-size: 11.5px; line-height: 1.65; background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-x: auto; }

  /* Approval queue */
  .stat--click { cursor: pointer; }
  .stat--click:hover { border-color: var(--accent); }
  .appr { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--border); border-left-width: 3px; border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
  .appr--low { border-left-color: var(--good); }
  .appr--medium { border-left-color: var(--warn); }
  .appr--high { border-left-color: var(--crit); }
  .appr__main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .appr__top { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .appr__label { font-size: 13.5px; font-weight: 700; }
  .appr__target { font-family: var(--mono); font-size: 12px; color: var(--text); }
  .appr__why, .appr__what { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .appr__meta { font-size: 11px; color: var(--text-faint); font-family: var(--mono); margin-top: 2px; }
  .appr__btns { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .ks-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .ks-row:last-child { border-bottom: none; }

  /* ---------- Overlay / drawer / modal / toast ---------- */
  /* The overlay root is a sibling of .app, so it does NOT inherit .app's
     color/font — without this, drawer/modal text fell back to the browser
     default (black), which is illegible on the dark theme. Real bug caught
     in the device drawer's twin values. */
  #overlay-root { font-family: var(--sans); color: var(--text); }
  .overlay { position: fixed; inset: 0; background: rgba(8,12,23,.55); backdrop-filter: blur(2px); z-index: 40; opacity: 0; animation: ovfade .16s ease forwards; }
  @keyframes ovfade { to { opacity: 1; } }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(468px, 96vw); background: var(--surface);
    border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 50;
    display: flex; flex-direction: column; animation: slidein .22s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes slidein { from { transform: translateX(100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .overlay, .drawer, .modal, .toast { animation: none; } }
  .drawer__head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
  .drawer__title { font-size: 16px; font-weight: 720; letter-spacing: -.01em; }
  .drawer__id { font-family: var(--mono); font-size: 12px; color: var(--text-faint); margin-top: 3px; }
  .drawer__body { padding: 18px 20px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; }
  .dsec__label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted);
    font-weight: 700; margin-bottom: 11px; display: flex; align-items: center; gap: 8px;
  }
  .dsec__label .arrow { font-family: var(--mono); color: var(--text-faint); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .twin { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .twin td { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .twin td:first-child { color: var(--text-muted); padding-right: 12px; }
  .twin td:last-child { text-align: right; font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--data-val); }
  .twin tr:last-child td { border-bottom: none; }
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
  .sync .dot { width: 6px; height: 6px; border-radius: 50%; }
  .readout { display: flex; align-items: center; gap: 16px; padding: 15px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); }
  .readout__v { font-size: 23px; font-weight: 740; font-variant-numeric: tabular-nums; line-height: 1; }
  .readout__l { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; margin-bottom: 5px; }
  .methods { display: flex; flex-wrap: wrap; gap: 8px; }

  .modal {
    position: fixed; z-index: 50; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(540px, 95vw);
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg);
    animation: modalin .2s ease forwards; max-height: 92vh; overflow: auto;
  }
  @keyframes modalin { from { opacity: 0; transform: translate(-50%, -47%); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .modal__head { padding: 22px 24px 4px; }
  .modal__head h2 { margin: 0; font-size: 18px; font-weight: 740; letter-spacing: -.02em; }
  .modal__head p { margin: 7px 0 0; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .modal__body { padding: 18px 24px 6px; display: flex; flex-direction: column; gap: 15px; }
  .modal__foot { padding: 16px 24px 22px; display: flex; gap: 10px; justify-content: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 12px; font-weight: 650; color: var(--text-muted); }
  .field input, .field select {
    padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface-2); font-family: inherit; font-size: 13px; color: var(--text); outline: none; width: 100%;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field--row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 11.5px; color: var(--text-faint); line-height: 1.5; }
  .hint code { font-family: var(--mono); background: var(--surface-3); padding: 1px 5px; border-radius: 4px; color: var(--accent-ink); }

  .toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 10px; padding: 11px 17px; background: var(--text); color: var(--surface); border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); animation: toastin .2s ease; }
  .toast svg { width: 16px; height: 16px; color: var(--good); flex: none; }
  @keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- User menu / account ---------- */
  .who { border: none; background: none; cursor: pointer; width: 100%; padding: 6px; border-radius: 8px; font-family: inherit; }
  .who:hover { background: rgba(255,255,255,.06); }
  .topbar-user { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text-muted); }
  .topbar-user:hover { border-color: var(--border-strong); color: var(--text); }
  .topbar-user__avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg,#8b5cf6,#22c55e); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px; }
  .overlay--clear { background: transparent; backdrop-filter: none; }
  .usermenu { position: fixed; top: 54px; right: 18px; z-index: 50; width: 264px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; animation: fade .14s ease; }
  .usermenu__head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 11px; align-items: center; }
  .usermenu__av { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,#8b5cf6,#22c55e); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex: none; }
  .usermenu__item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 16px; border: none; background: none; font-family: inherit; font-size: 13px; color: var(--text); cursor: pointer; text-align: left; }
  .usermenu__item:hover { background: var(--surface-3); }
  .usermenu__item svg { width: 16px; height: 16px; color: var(--text-muted); flex: none; }
  .usermenu__sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* ---------- Logo upload / branding ---------- */
  .logo-drop { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface-2); }
  .logo-drop__mark { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; flex: none; }
  .logo-swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .logo-swatch { width: 26px; height: 26px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .logo-swatch.sel { border-color: var(--text); }

  /* ---------- Settings ---------- */
  .set-grid { display: grid; grid-template-columns: 200px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 760px) { .set-grid { grid-template-columns: 1fr; } }
  .set-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 84px; }
  .set-nav__item { text-align: left; padding: 9px 12px; border-radius: 8px; border: none; background: none; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  .set-nav__item:hover { background: var(--surface-3); color: var(--text); }
  .set-nav__item--active { background: var(--accent-soft); color: var(--accent-ink); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row__label { font-size: 13.5px; font-weight: 600; }
  .toggle-row__sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .switch { width: 40px; height: 23px; border-radius: 20px; background: var(--border-strong); position: relative; cursor: pointer; border: none; flex: none; transition: background .15s ease; }
  .switch.on { background: var(--good); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: #fff; transition: left .15s ease; }
  .switch.on::after { left: 19px; }

  /* ---------- Map ---------- */
  .map { position: relative; width: 100%; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
  .map svg { display: block; width: 100%; height: auto; }
  .map__land { fill: var(--surface-3); }
  .map__water { fill: color-mix(in srgb, var(--info) 15%, var(--surface-2)); }
  .map__grid { stroke: var(--border); stroke-width: .5; opacity: .5; }
  .map__label { fill: var(--text-faint); font-size: 12px; font-family: var(--sans); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .map__pin { cursor: pointer; }
  .map__pin circle.halo { opacity: .16; }
  .map__pin:hover circle.dot { stroke-width: 3; }
  .map__pulse { transform-origin: center; animation: mappulse 2s ease-out infinite; }
  @keyframes mappulse { 0% { r: 6; opacity: .5; } 100% { r: 18; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .map__pulse { animation: none; } }
  .map__tip { position: absolute; pointer-events: none; z-index: 6; background: var(--text); color: var(--surface); padding: 9px 12px; border-radius: 9px; font-size: 12px; box-shadow: var(--shadow-lg); min-width: 190px; opacity: 0; transition: opacity .1s ease; }
  .map__tip.show { opacity: 1; }
  .map__tip .t-site { font-weight: 700; margin-bottom: 4px; }
  .map__tip .t-row { display: flex; justify-content: space-between; gap: 14px; margin-top: 2px; }
  .map__tip .t-row span:first-child { opacity: .7; }
  .map__legend { display: flex; gap: 16px; padding: 10px 14px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); }
  .map__legend span { display: inline-flex; align-items: center; gap: 6px; }
  .map__legend .dot { width: 9px; height: 9px; border-radius: 50%; }

  /* ---------- Overlay chart (energy / risk) ---------- */
  .chart-legend { display: flex; gap: 18px; font-size: 12px; color: var(--text-muted); margin-top: 10px; flex-wrap: wrap; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .chart-legend i { width: 16px; height: 0; border-top-width: 2px; border-top-style: solid; display: inline-block; }

  /* ---------- Metric explainer ("how it's calculated / why it matters") ---------- */
  .mx-i { display: inline-flex; width: 14px; height: 14px; color: var(--text-faint); cursor: help; vertical-align: middle;
           /* Reset button chrome: .mx-i is used on span AND button elements, and
              without this a button rendered its default fill/border inside 14px. */
           padding: 0; border: 0; background: none; font: inherit; -webkit-appearance: none; appearance: none; }
  button.mx-i { cursor: pointer; }
  .mx-i:hover, .mx-i:focus-visible { color: var(--accent); outline: none; }
  .mx-i svg { width: 14px; height: 14px; }
  #mx-tip { position: fixed; z-index: 80; width: 252px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 12px 14px; font-size: 12px; line-height: 1.5; opacity: 0; visibility: hidden; transition: opacity .1s ease; pointer-events: none; }
  #mx-tip.show { opacity: 1; visibility: visible; }
  #mx-tip b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-ink); margin: 9px 0 3px; font-weight: 700; }
  #mx-tip b:first-child { margin-top: 0; }
  #mx-tip p { margin: 0; color: var(--text-muted); }
</style>

</head>
<body>
<div id="staff-gate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0f1d;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <div style="width:100%;max-width:400px;">
    <div style="background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(16,21,42,.35);overflow:hidden;">
      <div style="padding:36px 32px 28px;text-align:center;">
        <div style="display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:14px;">
          <svg viewBox="0 0 24 18" width="26" height="20"><path d="M0,18 L8,0 L14,10 L19,2 L24,18 Z" fill="#7c3aed"/><path d="M14,10 L19,2 L24,18 Z" fill="#22c55e" opacity="0.85"/></svg>
          <span style="font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1;color:#0f172a;">Peak<span style="color:#8b5cf6;">Logic</span></span>
        </div>
        <h1 style="margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;color:#0f172a;">Sign in to the Control Center</h1>
        <p style="margin:8px 0 0;font-size:13.5px;color:#5b6478;">PeakLogic staff only — Entra ID workforce sign-in.</p>
        <form id="staff-gate-form" style="text-align:left;margin-top:22px;display:flex;flex-direction:column;gap:14px;">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:5px;">Work email</label>
            <input type="email" placeholder="you@peaklogicsystems.com" style="width:100%;box-sizing:border-box;padding:10px 13px;border:1px solid #d9d8ea;border-radius:10px;font-size:14.5px;outline:none;">
          </div>
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:5px;">Password</label>
            <input type="password" placeholder="••••••••" style="width:100%;box-sizing:border-box;padding:10px 13px;border:1px solid #d9d8ea;border-radius:10px;font-size:14.5px;outline:none;">
          </div>
          <button type="submit" style="margin-top:2px;padding:11px;border:none;border-radius:999px;background:#7c3aed;color:#fff;font-size:15px;font-weight:650;cursor:pointer;">Sign in</button>
        </form>
        <div style="display:flex;align-items:center;gap:10px;margin:20px 0 16px;">
          <div style="flex:1;height:1px;background:#e7e6f1;"></div>
          <span style="font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94a0b5;">Demo</span>
          <div style="flex:1;height:1px;background:#e7e6f1;"></div>
        </div>
        <button id="staff-gate-bypass" type="button" style="width:100%;padding:10px;border:1px solid #d9d8ea;border-radius:10px;background:#fff;color:#334155;font-size:14px;font-weight:650;cursor:pointer;">Continue with demo credentials</button>
      </div>
    </div>
    <p style="text-align:center;font-size:11.5px;color:#7c89a5;margin:18px 0 0;">Demo build — any email/password is accepted; no real Entra ID auth exists yet.</p>
    <p style="text-align:center;font-size:11.5px;margin:10px 0 0;"><a href="/demo.html" style="color:#a78bfa;text-decoration:none;">&larr; PeakLogic platform demo</a></p>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="rail">
    <button class="brand" data-action="nav:fleet" title="Fleet Overview" aria-label="PeakLogic — go to Fleet Overview">
      <svg viewBox="0 0 24 18" aria-hidden="true">
        <path d="M0,18 L8,0 L14,10 L19,2 L24,18 Z" fill="#7c3aed"></path>
        <path d="M14,10 L19,2 L24,18 Z" fill="#22c55e" opacity="0.85"></path>
      </svg>
      <span class="brand__word"><span class="peak">Peak</span><span class="logic">Logic</span></span>
    </button>

    <nav class="nav" id="nav">
      <button class="nav__item" data-action="nav:fleet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Fleet Overview</span>
      </button>

      <div class="nav__label">Organizations</div>
      <button class="nav__item" data-action="nav:tenants">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>
        <span>Customer Tenants</span><span class="nav__count" id="cnt-tenants"></span>
      </button>
      <button class="nav__item" data-action="nav:partners">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Channel Partners</span><span class="nav__count" id="cnt-partners"></span>
      </button>
      <button class="nav__item" data-action="nav:sites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Sites</span><span class="nav__count" id="cnt-sites"></span>
      </button>

      <div class="nav__label">Fleet</div>
      <button class="nav__item" data-action="nav:devices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>
        <span>Devices</span><span class="nav__count" id="cnt-devices"></span>

    let total = 0, online = 0, crit = 0, warn = 0;
    t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      total++;
      if (d.state === "reporting" || d.state === "configured") online++;
      if (d.health === "crit") crit++; else if (d.health === "warn") warn++;
    })));
    return { total, online, crit, warn, tickets: crit, health: crit ? "crit" : warn ? "warn" : "good" };
  }
  // One users list per tenant — used for BOTH the tab count and the rendered
  // rows, so they can't drift (fixes "3 shown, count says 6").
  function tenantUsers(t) {
    return [
      { n: "Operations Manager", e: "ops@" + t.id + ".example", r: "Admin" },
      { n: "Facilities Lead", e: "facilities@" + t.id + ".example", r: "Operator" },
      { n: "Night Shift Tech", e: "nightshift@" + t.id + ".example", r: "Operator" },
    ];
  }

  // ---------- Map (self-contained — no external tiles; sandbox blocks them) ----------
  function sitePointsFor(tenants) {
    const pts = [];
    tenants.forEach(t => {
      const p = partnerFor(t);
      t.sites.forEach(s => {
        if (s.lat == null) return;
        pts.push({ lat: s.lat, lng: s.lng, site: s.name, tenant: t.name, tenantId: t.id,
          partner: p ? p.name : "Direct", health: siteHealth(s),
          devices: s.assets.reduce((a, x) => a + x.devices.length, 0) });
      });
    });
    return pts;
  }
  function projectLL(lat, lng, w, h) {
    const latMax = 28.35, latMin = 27.25, lngMin = -82.98, lngMax = -82.05;
    return [((lng - lngMin) / (lngMax - lngMin)) * w, ((latMax - lat) / (latMax - latMin)) * h];
  }
  function renderMap(points, height) {
    const W = 900, H = height || 380;
    const grid = [];
    for (let x = 0; x <= W; x += 90) grid.push(`<line class="map__grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`);
    for (let y = 0; y <= H; y += 76) grid.push(`<line class="map__grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`);
    const pins = points.map(p => {
      const [x, y] = projectLL(p.lat, p.lng, W, H);
      const c = p.health === "crit" ? "var(--crit)" : p.health === "warn" ? "var(--warn)" : "var(--good)";
      const data = esc(JSON.stringify({ site: p.site, tenant: p.tenant, partner: p.partner, status: p.health, devices: p.devices }));
      const pulse = p.health === "crit" ? `<circle class="map__pulse" r="6" fill="${c}"></circle>` : "";
      return `<g class="map__pin" data-pin="${data}" ${p.tenantId ? `data-action="manage-tenant:${p.tenantId}"` : ""} transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
        <circle class="halo" r="14" fill="${c}"></circle>${pulse}
        <circle class="dot" r="5.5" fill="${c}" stroke="var(--surface)" stroke-width="2"></circle></g>`;
    }).join("");
    return `<div class="map">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <rect width="${W}" height="${H}" class="map__land"></rect>
        <path class="map__water" d="M0,0 H240 Q246,140 196,236 Q150,320 214,${H} H0 Z"></path>
        <path class="map__water" d="M338,${H} Q360,300 430,286 Q516,274 520,${H} Z"></path>
        <g>${grid.join("")}</g>
        <text x="54" y="${H - 22}" class="map__label">Gulf of Mexico</text>
        <text x="386" y="${H - 14}" class="map__label">Tampa Bay</text>
        ${pins}
      </svg>
      <div class="map__tip" id="map-tip"></div>
      <div class="map__legend">
        <span><span class="dot" style="background:var(--good)"></span>Healthy</span>
        <span><span class="dot" style="background:var(--warn)"></span>Warning</span>
        <span><span class="dot" style="background:var(--crit)"></span>Critical</span>
        <span class="faint" style="margin-left:auto">${points.length} sites · hover for detail · click to open · schematic (real tiles in the deployed app)</span>
      </div>
    </div>`;
  }

  // ---------- Overlay line chart (normalized/expected vs current) ----------
  function overlayChart(baseline, actual, opts) {
    opts = opts || {};
    const W = 860, H = 220, pad = 34;
    const all = baseline.concat(actual);
    const min = Math.min(...all) * 0.9, max = Math.max(...all) * 1.05, rng = (max - min) || 1;
    const px = (i, arr) => pad + (i / (arr.length - 1)) * (W - pad * 2);
    const py = (v) => pad / 2 + (1 - (v - min) / rng) * (H - pad * 1.5);
    const line = (arr) => arr.map((v, i) => (i ? "L" : "M") + px(i, arr).toFixed(1) + " " + py(v).toFixed(1)).join(" ");
    // shade where actual exceeds baseline (spikes = cost / anomaly)
    const overArea = actual.map((v, i) => `${px(i, actual).toFixed(1)},${py(Math.max(v, baseline[i])).toFixed(1)}`).join(" ");
    const baseArea = baseline.slice().reverse().map((v, i) => `${px(baseline.length - 1 - i, baseline).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    const yTicks = [min, (min + max) / 2, max].map(v => `<text x="4" y="${py(v).toFixed(1)}" class="map__label" style="text-transform:none;letter-spacing:0;font-size:10px">${Math.round(v)}${opts.unit || ""}</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:auto">
      <polygon points="${overArea} ${baseArea}" fill="var(--warn)" opacity="0.14"></polygon>
      <path d="${line(baseline)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"></path>
      <path d="${line(actual)}" fill="none" stroke="var(--good)" stroke-width="2.25" stroke-linejoin="round"></path>
      ${yTicks}
    </svg>`;
  }

  // Generic labelled stage bars (used by the risk-reduction report).
  function renderStages(stages) {
    const max = stages[0].count || 1;
    let html = '<div class="funnel">';
    stages.forEach((s, i) => {
      const w = Math.round((s.count / max) * 100);
      html += `<div class="funnel__row"><div class="funnel__label">${s.label}</div>
        <div class="funnel__track"><div class="funnel__fill" style="width:${w}%;background:${s.color || 'var(--accent)'}"></div></div>
        <div class="funnel__count">${s.count}</div></div>`;
      if (i < stages.length - 1 && s.rate) html += `<div class="funnel__rate">↓ ${s.rate}</div>`;
    });
    return html + "</div>";
  }

  // ---------- Derived aggregates (fan-out, computed per-org then merged) ----------
  function fleetTotals() {
    return TENANTS.reduce((a, t) => {
      const s = tenantStats(t); a.online += s.online; a.total += s.total; a.crit += s.crit; a.warn += s.warn; a.tickets += s.tickets; return a;
    }, { online: 0, total: 0, crit: 0, warn: 0, tickets: 0 });
  }
  function needsAttention() {
    const rows = [];
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      if (d.health === "crit" || d.health === "warn") {
        rows.push({ health: d.health, org: t.name, orgId: t.id, site: s.name, asset: a.name, cat: a.cat, device: d.name, id: d.id, metric: d.metric, state: d.state });
      }
    }))));
    return rows.sort((x, y) => (x.health === "crit" ? 0 : 1) - (y.health === "crit" ? 0 : 1));
  }
  function allDevices() {
    const rows = [];
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      rows.push({ ...d, org: t.name, orgId: t.id, site: s.name, cat: a.cat });
    }))));
    return rows;
  }
  function deviceIndex() {
    const idx = {};
    TENANTS.forEach(t => t.sites.forEach(s => s.assets.forEach(a => a.devices.forEach(d => {
      idx[d.id] = { d: d, org: t.name, orgId: t.id, site: s.name, asset: a.name, cat: a.cat };
    }))));
    return idx;
  }

  // Device twin: desired (cloud→device) vs reported (device→cloud), keyed off lifecycle state
  function twinFor(d, cat) {
    const base = d.cfg || CAT_CONFIG[cat] || CAT_CONFIG.hvac;
    const desired = {
      "Reporting interval": base.interval + "s",
      "Metrics": base.metrics.join(", "),
      "Thresholds": base.thresholds,
      "Firmware channel": base.fw,
      "Command channel": "direct-methods"
    };
    let reported = null, sync;
    if (d.state === "reporting") {
      reported = { "Config version": "v7", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "MQTT/TLS :443", "Last twin sync": "2m ago" };
      sync = { cls: "good", label: "In sync" };
    } else if (d.state === "configured") {
      reported = { "Config version": "v7", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "MQTT/TLS :443", "Last twin sync": "just now" };
      sync = { cls: "good", label: "In sync" };
    } else if (d.state === "provisioning") {
      reported = { "Config version": "— applying", "Firmware installed": base.fw, "Reporting interval": "— pending", "Connectivity": "MQTT/TLS :443", "Last twin sync": "pushing…" };
      sync = { cls: "warn", label: "Config push pending" };
    } else if (d.state === "silent") {
      reported = { "Config version": "v6", "Firmware installed": base.fw, "Reporting interval": base.interval + "s", "Connectivity": "last seen 46m ago", "Last twin sync": "stale" };
      sync = { cls: "crit", label: "Device silent" };
    } else if (d.state === "registered") {
      sync = { cls: "neutral", label: "Awaiting first connection" };
    } else {
      sync = { cls: "neutral", label: "Decommissioned" };
    }
    return { desired: desired, reported: reported, sync: sync };
  }

  const ID_PREFIX = { pool_system: "pl", hvac: "hv", refrigeration: "rf", energy_meter: "em", leak_sensor: "lk", pump: "pm" };
  function genId(cat) {
    const p = ID_PREFIX[cat] || "dev";
    const n = Math.floor(1000 + Math.random() * 8999);
    const a = "abcdefgh"[Math.floor(Math.random() * 8)];
    return `${p}-${n}-${a}`;
  }
  // Metric explainer — a small ⓘ that reveals how a metric is calculated and
  // why it matters (JS-positioned so it escapes panels' overflow:hidden).
  // The single information affordance used everywhere in the console. Anything that
  // reveals explanatory copy on hover/focus uses this exact glyph — a lowercase "i"
  // in a circle — so "there is more information here" always looks the same.
  const INFO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11.4v4.4"/><circle cx="12" cy="7.7" r="1.15" fill="currentColor" stroke="none"/></svg>';
  function explain(how, why) {
    return `<span class="mx-i" tabindex="0" aria-label="More information" data-how="${esc(how)}" data-why="${esc(why)}">${INFO_ICON}</span>`;
  }
  // Column explainer — reveals a plain-language meaning for a table column header on
  // hover/focus. Uses the same INFO_ICON and the same mx-i/mx-tip hover mechanism as
  // the metric explainer above; only the payload differs (data-tip vs data-how/why).
  function explainCol(text) {
    return `<span class="mx-i" tabindex="0" aria-label="More information" data-tip="${esc(text)}">${INFO_ICON}</span>`;
  }
  function showMxTip(el) {
    const tip = $("#mx-tip");
    const plain = el.getAttribute("data-tip");
    // Defensive: an .mx-i carrying none of the three payload attributes used to
    // render "How it's calculated: null". Show nothing rather than nonsense.
    if (plain == null && el.getAttribute("data-how") == null) return;
    tip.innerHTML = plain != null
      ? `<p>${esc(plain)}</p>`
      : `<b>How it's calculated</b><p>${esc(el.getAttribute("data-how"))}</p><b>Why it matters</b><p>${esc(el.getAttribute("data-why"))}</p>`;
    tip.classList.add("show");
    const r = el.getBoundingClientRect(), th = tip.offsetHeight, tw = 252;
    let left = Math.min(r.left, window.innerWidth - tw - 12);
    let top = r.bottom + 8;
    if (top + th > window.innerHeight - 12) top = r.top - th - 8;
    tip.style.left = Math.max(12, left) + "px"; tip.style.top = top + "px";
  }
  function hideMxTip() { $("#mx-tip").classList.remove("show"); }

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg><span>${esc(msg)}</span>`;
    $("#toasts").appendChild(t);
    setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 2600);
  }
