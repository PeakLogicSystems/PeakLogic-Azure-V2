  }
  function submitManageChannel() {
    const cat = $("#mc-type").value, tier = $("#mc-tier").value;
    if (cat === "hub") {
      const bundle = { ...HUB_RELEASE_CHANNELS[tier].bundle };
      Object.keys(HUB_COMPONENT_LABELS).filter((k) => k !== "aiModel").forEach((k) => {
        const el = $(`#mc-${k}`); if (el && el.value.trim()) bundle[k] = el.value.trim();
      });
      HUB_RELEASE_CHANNELS[tier].bundle = bundle;
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "policy.update", target: "PeakLogic Hub", note: `${CHANNEL_TIER_LABEL[tier]} channel bundle updated` });
      toast(`${CHANNEL_TIER_LABEL[tier]} channel updated for PeakLogic Hub — Hubs on this channel converge on next sync`);
    } else {
      const v = ($("#mc-firmware").value || "").trim();
      if (!v) { toast("Enter a firmware version"); return; }
      const entry = FIRMWARE_CATALOG[cat];
      if (!entry.channels[tier]) entry.channels[tier] = [];
      // Newest-first convention (index 0 = current) — a saved version becomes
      // the new current for this channel, matching how the catalog is read
      // everywhere else (fwStatus/fwOptionsFor).
      entry.channels[tier] = entry.channels[tier].filter((x) => x !== v);
      entry.channels[tier].unshift(v);
      AUDIT.unshift({ ts: nowStamp(), actor: ME.name, oid: ME.oid, action: "policy.update", target: entry.product, note: `${CHANNEL_TIER_LABEL[tier]} channel → ${v}` });
      toast(`${CHANNEL_TIER_LABEL[tier]} channel for ${entry.product} → ${v}`);
    }
    closeOverlay(); setCounts(); render();
  }

  // ---------- Add library version (System Channels) ----------
  // The ONE place a version string is actually typed — registering a brand
  // new build. Deliberately separate from "New device channel" (which only
  // ever SELECTS from what's here): typing happens once per real build,
  // assignment happens as many times as needed afterward, with no way to

  function artifactOptionsFor(cat) {

  function submitAddArtifactVersion() {

  // ---------- Events ----------
  document.addEventListener("click", (e) => {

    const parts = el.getAttribute("data-action").split(":");
    const action = parts[0], arg = parts[1], arg2 = parts[2];
    if (action === "nav") { closeOverlay(); S.view = arg; S.query = ""; S.actingAs = null; S.partner = null; render(); }

    else if (action === "set-tab") { S.setTab = arg; render(); }
    else if (action === "toggle-pref") { PREFS[arg] = !PREFS[arg]; render(); }
    else if (action === "new-tenant") openCreateTenant();
    else if (action === "new-partner") openCreatePartner();
    else if (action === "new-user") openCreateUser();
    else if (action === "new-channel") openManageChannel(arg, arg2);
    else if (action === "add-artifact-version") openAddArtifactVersion();
    else if (action === "submit-tenant") submitCreateTenant();
    else if (action === "submit-partner") submitCreatePartner();
    else if (action === "submit-user") submitCreateUser();
    else if (action === "submit-channel") submitManageChannel();
    else if (action === "submit-artifact-version") submitAddArtifactVersion();
    else if (action === "toast") toast(parts.slice(1).join(":"));
    else if (action === "manage-tenant") enterActAs(arg);
    else if (action === "manage-partner") enterActAsPartner(arg);
    else if (action === "exit-actas") exitActAs();
    else if (action === "tenant-tab") { S.tab = arg; render(); }
    else if (action === "partner-tab") { S.ptab = arg; render(); }
    else if (action === "save-branding") saveBranding(arg, arg2);
    else if (action === "device") openDeviceDrawer(arg);
    else if (action === "hub") openHubDrawer(arg);
    else if (action === "agent") openAgentDrawer(arg);
    else if (action === "agent-state") setAgentState(arg, arg2);
    else if (action === "agent-approve") approveAgentAction(arg);
    else if (action === "agent-run") runAgentAction(arg);
    else if (action === "agent-reject") rejectAgentAction(arg);
    else if (action === "killswitch") openKillswitch();
    else if (action === "killswitch-submit") submitKillswitch();
    else if (action === "report-cadence") setReportCadence(arg);
    else if (action === "register-open") openRegister(arg);
    else if (action === "register-submit") submitRegister();
    else if (action === "site-open") openNewSite(arg);
    else if (action === "site-submit") submitNewSite(arg);
    else if (action === "thresholds-open") openThresholds(arg, arg2);
    else if (action === "thresholds-submit") submitThresholds(arg, arg2);
    else if (action === "method") runMethod(arg, arg2);
    else if (action === "run-report") {
      const r = STANDARD_REPORTS.find(x => x.id === arg);
      toast(`Generating "${r ? r.name : arg}" — export ready`);
    }
    else if (action === "build-report") toast("Custom report queued — you'll be notified when it's ready");
    else if (action === "close-overlay") closeOverlay();
    else if (action === "help") openHelpDrawer();
    else if (action === "ask-peakassist") { const inp = $("#pa-q"); if (inp) renderPeakAssistAnswer(inp.value); }
    else if (action === "help-alarm") openHelpDrawer(arg);
    else if (action === "toggle-theme") toggleTheme();
    else if (action === "signout") { closeOverlay(); if (window.__pccSignOut) window.__pccSignOut(); }
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "q") { S.query = e.target.value; render(); }
    else if (e.target.id === "cu-role") { const d = $("#cu-role-desc"); if (d) d.textContent = ROLE_INFO[e.target.value] || ""; }
    else if (e.target.id === "mc-type" || e.target.id === "mc-tier") { rescopeManageChannelFields(); }
    else if (e.target.id === "cp-logo" || e.target.id === "cp-brand") {
      const mark = $("#cp-mark"); if (mark) { mark.textContent = ($("#cp-logo").value || "?").toUpperCase(); mark.style.background = $("#cp-brand").value; }
    }
    else if (e.target.id === "br-logo" || e.target.id === "br-brand") {
      // Editing initials/color clears any staged uploaded image, so preview + save agree.
      pendingLogoUpload = null;
      const mark = $("#br-mark");
      if (mark) { mark.style.backgroundImage = "none"; mark.textContent = (($("#br-logo").value || "?").toUpperCase()); mark.style.background = $("#br-brand").value; mark.style.display = "grid"; mark.style.placeItems = "center"; }
    }
  });

  // File picker for a logo upload (fires 'change', not 'input'). Reads the file
  // to a data URL, previews it, and stages it for Save.
  document.addEventListener("change", (e) => {
    if (e.target.id !== "br-logo-file") return;
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingLogoUpload = reader.result;
      const mark = $("#br-mark");
      if (mark) { mark.textContent = ""; mark.style.background = "#fff"; mark.style.backgroundImage = `url('${reader.result}')`; mark.style.backgroundSize = "cover"; mark.style.backgroundPosition = "center"; }
      toast(`${file.name} ready — click Save branding to apply`);
    };
    reader.readAsDataURL(file);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeOverlay();
  });

  // Metric-explainer tooltip triggers
  document.addEventListener("mouseover", (e) => { const el = e.target.closest(".mx-i"); if (el) showMxTip(el); });
  document.addEventListener("mouseout", (e) => { if (e.target.closest(".mx-i")) hideMxTip(); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest(".mx-i"); if (el) showMxTip(el); });
  document.addEventListener("focusout", (e) => { if (e.target.closest(".mx-i")) hideMxTip(); });

  // Map pin hover tooltip
  document.addEventListener("mousemove", (e) => {
    const tip = document.getElementById("map-tip");
    if (!tip) return;
    const pin = e.target.closest(".map__pin");
    if (!pin) { tip.classList.remove("show"); return; }
    const d = JSON.parse(pin.getAttribute("data-pin"));
    const rect = pin.closest(".map").getBoundingClientRect();
    tip.innerHTML = `<div class="t-site">${esc(d.site)}</div>
      <div class="t-row"><span>Customer</span><span>${esc(d.tenant)}</span></div>
      <div class="t-row"><span>Channel partner</span><span>${esc(d.partner)}</span></div>
      <div class="t-row"><span>Devices</span><span>${d.devices}</span></div>
      <div class="t-row"><span>Status</span><span style="text-transform:capitalize;font-weight:700">${esc(d.status)}</span></div>`;
    let x = e.clientX - rect.left + 16, y = e.clientY - rect.top + 16;
    if (x > rect.width - 210) x -= 226;
    tip.style.left = x + "px"; tip.style.top = y + "px";
    tip.classList.add("show");
  });

  // ---------- Theme ----------
  function currentTheme() {
    const attr = document.documentElement.getAttribute("data-theme");
    if (attr) return attr;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function setThemeIcon(theme) {
    const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    const moon = '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>';
    $("#theme-icon").innerHTML = theme === "dark" ? sun : moon;
  }
  function toggleTheme() {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    setThemeIcon(next);
  }

  // ---------- Init ----------
  setCounts();
  setThemeIcon(currentTheme());
  render();
})();
</script>

<script>
(function () {
  "use strict";
  // Demo-only staff session gate: no real Entra ID/PartnerPool auth exists (no
  // backend deployed). Whatever is typed is accepted, and a bypass is offered
  // openly -- same pattern as the other portal apps' login screens.
  var KEY = "pcc-authed";
  var gate = document.getElementById("staff-gate");
  var app = document.getElementById("app");
  function enter() {
    localStorage.setItem(KEY, "1");
    gate.style.display = "none";
    app.style.display = "";
  }
  function signOut() {
    localStorage.removeItem(KEY);
    app.style.display = "none";
    gate.style.display = "flex";
    window.scrollTo(0, 0);
  }
  // Exposed so the console's own user-menu "Sign out" (handled by the main
  // script's action router) can return to this gate, not just toast.
  window.__pccSignOut = signOut;
  if (localStorage.getItem(KEY) === "1") enter();
  document.getElementById("staff-gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    enter();
  });
  document.getElementById("staff-gate-bypass").addEventListener("click", enter);
})();
</script>
</body>
</html>
