<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeakLogic Solutions</title>
<meta name="description" content="PeakLogic Solutions — industrial IoT monitoring and control. Site launching soon.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0F172A;
    font-family: 'Inter', system-ui, sans-serif;
    color: #E2E8F0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.1), transparent 40%),
      #0F172A;
  }
  main {
    text-align: center;
    max-width: 520px;
  }
  .logo-mark {
    margin-bottom: 1.75rem;
  }
  .wordmark {
    font-size: 2.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  .wordmark .peak { color: #FFFFFF; }
  .wordmark .logic { color: #8B5CF6; }
  .tagline {
    font-size: 0.95rem;
    font-weight: 500;
    color: #94A3B8;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }
  .coming-soon {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(124, 58, 237, 0.12);
    border: 1px solid rgba(124, 58, 237, 0.35);
    color: #C4B5FD;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    margin-bottom: 2.5rem;
  }
  .coming-soon .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22C55E;
    box-shadow: 0 0 8px #22C55E;
  }
  p.blurb {
    color: #94A3B8;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  .actions {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 1.5rem;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary {
    background: #7C3AED;
    color: #FFFFFF;
  }
  .btn-primary:hover { background: #8B5CF6; }
  .btn-secondary {
    background: transparent;
    color: #E2E8F0;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .btn-secondary:hover { border-color: rgba(255, 255, 255, 0.3); }
  footer {
    margin-top: 3rem;
    font-size: 0.78rem;
    color: #475569;
  }
</style>
</head>
<body>
<main>
  <div class="logo-mark">
    <svg width="72" height="54" viewBox="4 10 24 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 28 L12 10 L18 20 L23 12 L28 28 Z" fill="#7C3AED" />
      <path d="M18 20 L23 12 L28 28 Z" fill="#22C55E" opacity="0.85" />
    </svg>
  </div>

  <h1 class="wordmark"><span class="peak">Peak</span><span class="logic">Logic</span> Solutions</h1>
  <p class="tagline">Industrial IoT Monitoring &amp; Control</p>

  <div class="coming-soon"><span class="dot"></span> Coming Soon</div>

  <p class="blurb">
    We're building the new home for PeakLogic Solutions. Real-time telemetry,
    site &amp; asset monitoring, and control — all in one platform.
  </p>

  <div class="actions">
    <a class="btn btn-primary" href="https://app.peaklogicsolutions.com">Log In →</a>
    <a class="btn btn-secondary" href="mailto:hello@peaklogicsolutions.com">Contact Us</a>
  </div>

  <footer>&copy; 2026 PeakLogic Solutions. All rights reserved.</footer>
</main>
</body>
</html>
